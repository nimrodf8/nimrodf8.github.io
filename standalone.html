<!-- Deliberately NOT apple-mobile-web-app-capable, and the manifest asks for
     "browser" rather than "standalone". A home-screen icon that opens in the
     browser shares the browser's storage; a standalone web app gets a storage
     container of its own. Turning that on took the family's sign-in away from
     an install that already existed — the family document was safe on the
     server, but the id and secret needed to reach it live in that storage, so
     the device was locked out. The full-screen look is not worth that. -->

<style>
/* Rubik, self-hosted.

   Google serves this family as a variable font: one file per script covers
   every weight from 300 to 900, which is why there are three files here and
   not nine. Served from this repository rather than linked from Google, so the
   family's phones make no request to anyone else, and so a home screen that
   has opened the app once keeps its typeface with no network at all.

   Rubik is under the SIL Open Font License 1.1 — see fonts/OFL.txt. */

/* latin */

/* latin-ext */

/* hebrew */

/* Family Points — one stylesheet, light + dark, LTR + RTL.
   Spacing uses logical properties so the Hebrew layout mirrors for free. */

:root {
  --bg: #f6f5fb;
  --surface: #ffffff;
  --surface-2: #f1effa;
  --line: #e3e0f0;
  --ink: #1d1b32;
  --ink-soft: #5c5878;
  --brand: #6b4dfb;
  --brand-ink: #ffffff;
  --brand-soft: #ece7ff;
  --accent: #ff8a3d;
  --good: #16a06a;
  --good-soft: #e2f6ee;
  --bad: #e0413f;
  --bad-soft: #fde8e7;
  --warn: #d99400;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 8px 28px rgba(35, 25, 80, .08);
  --shadow-sm: 0 2px 8px rgba(35, 25, 80, .06);
  /* Rubik covers Latin and Hebrew in one family, so the app has the same voice
     in all three languages. It arrives from a stylesheet in index.html; if that
     never loads — offline, a home-screen launch with no signal — everything
     after it here is the fallback and nothing about the layout changes. */
  --font: "Rubik", "Segoe UI", system-ui, -apple-system, "Noto Sans Hebrew", "Helvetica Neue", Arial, sans-serif;
}

/* Dark mode has three states to cover: the viewer's system preference, and an
   explicit light or dark choice stamped on the root element by whatever hosts
   the page. CSS cannot share one declaration block across a media query and a
   plain selector, so the tokens are written twice — keep them in step. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14131d;
    --surface: #1e1c2b;
    --surface-2: #262338;
    --line: #322e47;
    --ink: #f2f0fb;
    --ink-soft: #a49fc0;
    --brand: #8f76ff;
    --brand-soft: #2c2547;
    --good: #3fcf94;
    --good-soft: #16352a;
    --bad: #ff6b68;
    --bad-soft: #3a1e20;
    --warn: #f0b429;
    --shadow: 0 8px 28px rgba(0, 0, 0, .4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
    --bg: #14131d;
    --surface: #1e1c2b;
    --surface-2: #262338;
    --line: #322e47;
    --ink: #f2f0fb;
    --ink-soft: #a49fc0;
    --brand: #8f76ff;
    --brand-soft: #2c2547;
    --good: #3fcf94;
    --good-soft: #16352a;
    --bad: #ff6b68;
    --bad-soft: #3a1e20;
    --warn: #f0b429;
    --shadow: 0 8px 28px rgba(0, 0, 0, .4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
}
body { padding-bottom: 84px; min-height: 100vh; }
body.no-tabs { padding-bottom: 24px; }

h1, h2, h3 { margin: 0 0 .4em; line-height: 1.2; }
h1 { font-size: 1.45rem; letter-spacing: -.01em; }
h2 { font-size: 1.12rem; }
h3 { font-size: .98rem; }
p { line-height: 1.55; margin: .4em 0; }
small { color: var(--ink-soft); }
a { color: var(--brand); }

.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
.muted { color: var(--ink-soft); }
.lead { color: var(--ink-soft); line-height: 1.6; }
.center { text-align: center; }
.hide { display: none !important; }
.mt { margin-top: 16px; }
.mb { margin-bottom: 12px; }

/* ---------- app bar ---------- */
header.bar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
header.bar .wrap { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.brand-mark {
  width: var(--bm, 38px); height: var(--bm, 38px); flex: 0 0 auto;
  display: block; line-height: 0;
}
.brand-mark svg { width: 100%; height: 100%; display: block; }
.bar-title { flex: 1; min-width: 0; }
.bar-title strong { display: block; font-size: .98rem; line-height: 1.2; }
.bar-title small { font-size: .74rem; }
.bar-actions { display: flex; gap: 6px; align-items: center; }
.sync-dot { font-size: .72rem; line-height: 1; }

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin: 12px 0;
  box-shadow: var(--shadow-sm);
}
.card.flush { padding: 0; overflow: hidden; }
.card.hero {
  background: linear-gradient(140deg, var(--brand), #a855f7 65%, var(--accent));
  color: #fff; border: none; box-shadow: var(--shadow);
}
.card.hero .muted, .card.hero small, .card.hero .lead { color: rgba(255, 255, 255, .82); }
.card.good { border-color: var(--good); background: var(--good-soft); }
.eyebrow {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .12em;
  font-weight: 700; color: var(--brand); margin-bottom: 6px;
}
.card.hero .eyebrow { color: rgba(255, 255, 255, .85); }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.row.nowrap { flex-wrap: nowrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: none; border-radius: 13px; padding: 12px 17px;
  font-family: var(--font); font-size: .95rem; font-weight: 700;
  background: var(--brand); color: var(--brand-ink); cursor: pointer;
  transition: transform .06s ease, filter .15s ease;
  min-height: 44px;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: grayscale(.4); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.soft { background: var(--brand-soft); color: var(--brand); }
.btn.good { background: var(--good); color: #fff; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.warn { background: var(--warn); color: #241c00; }
.btn.small { padding: 8px 12px; font-size: .84rem; min-height: 38px; border-radius: 11px; }
.btn.wide { flex: 1; }
.icon-btn {
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 1.05rem; cursor: pointer; padding: 8px; border-radius: 10px;
  min-width: 38px; min-height: 38px;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* ---------- forms ---------- */
.field { margin: 14px 0; }
.field > label, .field-label {
  display: block; font-weight: 700; font-size: .86rem; margin-bottom: 6px;
}
input[type=text], input[type=password], input[type=number], input[type=date],
input[type=tel], select, textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 12px; font-family: var(--font); font-size: 1rem;
  background: var(--surface); color: var(--ink);
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
textarea { min-height: 90px; resize: vertical; }
.hint { font-size: .78rem; color: var(--ink-soft); margin-top: 5px; line-height: 1.45; }
.error-msg {
  background: var(--bad-soft); color: var(--bad); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: .88rem; font-weight: 600; margin: 10px 0;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .grid-2:not(.keep) { grid-template-columns: 1fr; } }
.grid-2.keep { gap: 10px; }

/* segmented control */
.seg { display: flex; border: 1.5px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.seg button {
  flex: 1; border: none; background: var(--surface); color: var(--ink-soft);
  padding: 10px 8px; font-family: var(--font); font-weight: 700; font-size: .85rem; cursor: pointer;
}
.seg button.on { background: var(--brand); color: var(--brand-ink); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 7px 13px; font-size: .85rem; font-weight: 600;
  cursor: pointer; font-family: var(--font);
}
.chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface-2); color: var(--ink-soft);
  border-radius: 999px; padding: 3px 10px; font-size: .74rem; font-weight: 600;
}
.tag.brand { background: var(--brand-soft); color: var(--brand); }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- avatars ---------- */
.avatar {
  width: var(--avs, 44px); height: var(--avs, 44px);
  border-radius: 50%; display: inline-grid; place-items: center;
  background: color-mix(in srgb, var(--av) 26%, var(--surface));
  border: 2px solid var(--av);
  font-size: calc(var(--avs, 44px) * .52); flex: 0 0 auto; line-height: 1;
}
.avatar-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
  gap: 8px; margin: 8px 0;
}
/* There are a lot of characters to choose from, so the grid scrolls on its own
   rather than burying the Save button under it. */
.modal-body .avatar-grid {
  max-height: 232px; overflow-y: auto;
  padding: 6px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.avatar-pick {
  aspect-ratio: 1; border-radius: 50%; font-size: 1.5rem; cursor: pointer;
  border: 2px solid transparent;
  background: color-mix(in srgb, var(--av) 22%, var(--surface));
  display: grid; place-items: center;
}
.avatar-pick.sel { border-color: var(--av); box-shadow: 0 0 0 3px color-mix(in srgb, var(--av) 30%, transparent); }

/* ---------- points ---------- */
.pts { font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.pts.pos { color: var(--good); }
.pts.neg { color: var(--bad); }
.pts.zero { color: var(--ink-soft); }
.pts.big { font-size: 1.6rem; }

/* Tabular figures so a counting number does not jiggle as its digits change,
   and an isolate so a total keeps its own direction inside a Hebrew line. */
.score {
  font-size: 2rem; font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  letter-spacing: -.02em; direction: ltr; unicode-bidi: isolate;
  /* Block, not inline: it used to be a <div>, and the label that follows it on
     a hero card belongs underneath. A flex row blockifies its children anyway,
     so the totals sitting in list rows are unaffected — and a transform needs
     a block box to scale, which the bump animation depends on. */
  display: block; transition: transform .18s cubic-bezier(.2, 1.6, .5, 1);
}
.score.hero { font-size: 3.4rem; letter-spacing: -.035em; }
.score.up { animation: score-up .8s ease-out; }
.score.down { animation: score-down .8s ease-out; }
@keyframes score-up {
  0% { transform: none; }
  22% { transform: scale(1.16) translateY(-3px); }
  60% { transform: scale(1.02); }
  100% { transform: none; }
}
@keyframes score-down {
  0%, 100% { transform: none; }
  30% { transform: scale(.94); }
}
.card.hero .score.up { text-shadow: 0 0 22px rgba(255, 255, 255, .75); }
@media (prefers-reduced-motion: reduce) {
  .score, .score.up, .score.down { animation: none; transition: none; }
}

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list li {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.list li:last-child { border-bottom: none; }
.list li .grow { min-width: 0; }
.list .title { font-weight: 650; font-size: .95rem; }
.list .sub { font-size: .78rem; color: var(--ink-soft); margin-top: 2px; }
.tappable { cursor: pointer; }
.tappable:hover { background: var(--surface-2); }

.rank-badge {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-soft); font-size: .78rem; font-weight: 800; flex: 0 0 auto;
}
.rank-badge.gold { background: #ffd76e; color: #5a4300; }

.meter { height: 10px; border-radius: 999px; background: rgba(125, 120, 160, .25); overflow: hidden; margin: 8px 0; }
.meter-fill { height: 100%; border-radius: 999px; background: var(--brand); transition: width .4s ease; }
.card.hero .meter { background: rgba(0, 0, 0, .22); }
.card.hero .meter-fill { background: #fff; }

.tr-badge {
  border: none; background: var(--brand-soft); color: var(--brand);
  border-radius: 999px; padding: 1px 7px; font-size: .68rem; font-weight: 800;
  cursor: pointer; font-family: var(--font); vertical-align: middle;
  line-height: 1.5; display: inline-block;
}
.tr-badge.pending, .tr-badge.lang { background: var(--surface-2); color: var(--ink-soft); cursor: default; }
.tr-badge:hover { filter: brightness(1.05); }

.empty { text-align: center; padding: 30px 18px; color: var(--ink-soft); }
.empty-ic {
  font-size: 1.7rem; line-height: 1; display: grid; place-items: center;
  width: 58px; height: 58px; margin: 0 auto 12px; border-radius: 18px;
  background: var(--brand-soft);
}
.empty p { margin: 0; font-weight: 650; color: var(--ink); font-size: .95rem; }
.empty .empty-hint {
  margin-top: 5px; font-weight: 400; color: var(--ink-soft);
  font-size: .84rem; line-height: 1.5; max-width: 34ch;
  margin-inline: auto;
}
.empty-act { margin-top: 14px; }

.section-title {
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
  margin: 18px 0 6px; font-size: .82rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft);
}

/* ---------- tabs ---------- */
nav.tabs {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 40;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button {
  flex: 1; border: none; background: none; cursor: pointer;
  padding: 7px 2px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: var(--font); font-size: .66rem; font-weight: 650; color: var(--ink-soft);
}
nav.tabs button .ic { font-size: 1.2rem; line-height: 1; }
nav.tabs button.on { color: var(--brand); background: var(--brand-soft); }
nav.tabs .badge {
  position: absolute; transform: translate(14px, -6px);
  background: var(--bad); color: #fff; border-radius: 999px;
  font-size: .6rem; padding: 1px 5px; font-weight: 800;
}

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 60; display: none; }
#modal.open { display: block; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(20, 16, 40, .55); }
.modal-card {
  position: absolute; inset-inline: 0; bottom: 0; margin: 0 auto;
  max-width: 620px; max-height: 92vh; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow); animation: rise .18s ease-out;
}
@media (min-width: 640px) {
  .modal-card { position: relative; top: 6vh; border-radius: 22px; max-height: 88vh; }
}
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.modal-head h2 { margin: 0; font-size: 1.05rem; }
.modal-body { padding: 16px; }

/* ---------- toast ---------- */
.toast {
  position: fixed; inset-inline: 0; bottom: 96px; margin: 0 auto; width: fit-content;
  max-width: 90%; background: var(--ink); color: var(--bg);
  padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: .88rem;
  opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease;
  transform: translateY(8px); z-index: 70;
}
.toast.show { opacity: 1; transform: none; }
.toast.good { background: var(--good); color: #fff; }
.toast.bad { background: var(--bad); color: #fff; }

/* ---------- setup / login ---------- */
.steps { display: flex; gap: 6px; margin-bottom: 14px; }
.steps span { height: 4px; flex: 1; border-radius: 999px; background: var(--line); }
.steps span.on { background: var(--brand); }
.login-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.kid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.kid-card {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 14px 8px; text-align: center; cursor: pointer; font-family: var(--font);
  color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.kid-card:hover { border-color: var(--kid, var(--brand)); }
.kid-card .nm { font-weight: 700; font-size: .9rem; }
.pin-input { letter-spacing: .5em; text-align: center; font-size: 1.4rem; font-weight: 800; }

.countdown {
  display: flex; align-items: center; gap: 12px; padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}
.countdown:last-child { border-bottom: none; }
.countdown .days { font-size: 1.35rem; font-weight: 800; color: var(--brand); min-width: 44px; text-align: center; }
.countdown.today .days { color: var(--accent); }

.task-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.task-row:last-child { border-bottom: none; }
.task-row.paused { opacity: .55; }
.pts-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: .78rem; }

.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: .88rem; }
.kv:last-child { border-bottom: none; }
.kv .k { color: var(--ink-soft); }

.footer-note { text-align: center; font-size: .74rem; color: var(--ink-soft); padding: 18px 8px 4px; line-height: 1.5; }

/* ---------- a colour of one's own ----------
   Each child carries one colour: the ring round their character, the card at
   the top of their page, the bar that fills as they save up. It is how a young
   child finds their own row before they can read the name in it. */
/* Five across, two down, at a fixed size — a flex row wrapped nine-and-one on
   a phone, which read as a mistake rather than as a palette. */
.tone-row {
  display: grid; grid-template-columns: repeat(5, 40px);
  gap: 12px; margin-top: 6px; justify-content: start;
}
.tone {
  width: 40px; height: 40px; border-radius: 50%; padding: 0; cursor: pointer;
  background: var(--tone); border: 2px solid transparent;
  box-shadow: inset 0 0 0 2px var(--surface);
}
.tone.sel {
  border-color: var(--tone);
  box-shadow: inset 0 0 0 3px var(--surface), 0 0 0 3px color-mix(in srgb, var(--tone) 34%, transparent);
}
.tone:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* The gradient is mixed towards a dark base rather than used neat, so white
   text clears 4.5:1 on the pale end of the palette as surely as on the deep
   end. 68% is the loosest mix at which every tone still does: amber, the
   palest, lands at 4.7:1, and neat it would be 2.9:1. scratchpad contrast.js
   re-measures all ten if these numbers are ever touched. */
.card.hero.kid {
  background: linear-gradient(140deg,
    color-mix(in srgb, var(--kid) 68%, #241a45),
    color-mix(in srgb, var(--kid) 42%, #241a45));
}
.list li.kid-row { border-inline-start: 4px solid var(--kid); padding-inline-start: 10px; }
.meter.kid .meter-fill { background: var(--kid); }
.card.hero.kid .meter-fill { background: #fff; }
/* An inset shadow rather than a border, so the colour follows the card's
   rounded corners instead of squaring them off. */
.card.kid-edge { box-shadow: inset 0 4px 0 var(--kid), var(--shadow-sm); }

/* ---------- the moment something good happens ----------
   Paper thrown at the screen and swept up again: no library, nothing left
   behind, and nothing at all for a reader who asked for less motion. */
#cheer { position: fixed; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; display: none; }
#cheer.on { display: block; }
#cheer .bit {
  position: absolute; top: -28px; left: var(--x); opacity: 0;
  width: 9px; height: 14px; border-radius: 2px; background: var(--c);
  animation: cheer-fall var(--life, 1800ms) cubic-bezier(.35, .1, .7, 1) var(--delay, 0ms) forwards;
}
#cheer .bit.round { width: 10px; height: 10px; border-radius: 50%; }
@keyframes cheer-fall {
  0% { opacity: 1; transform: translate3d(0, 0, 0) rotate(0deg); }
  90% { opacity: 1; }
  100% { opacity: 0; transform: translate3d(var(--drift, 0), 108vh, 0) rotate(var(--spin, 180deg)); }
}

/* A row that just changed, so the eye is told where to look after a re-render. */
.just { animation: just-flash 1.1s ease-out; }
@keyframes just-flash {
  0% { background: var(--brand-soft); }
  100% { background: transparent; }
}

@media (prefers-reduced-motion: reduce) {
  #cheer { display: none !important; }
  .just { animation: none; }
  .modal-card { animation: none; }
}

.brand-mark.center-mark { margin: 0 auto 10px; }

</style>

    var auto = kids.filter(function (k) { return !global.AVATARS.toneHex(k.color); })
      .slice().sort(function (a, b) {
        return String(a.createdAt || "").localeCompare(String(b.createdAt || "")) ||
               String(a.id).localeCompare(String(b.id));
      });
    var i = 0;
    for (var n = 0; n < auto.length; n++) if (auto[n].id === c.id) { i = n; break; }
    return pool[i % pool.length];
  }

  function parent(id) { return byId(state.parents, id); }
  function task(id) { return byId(state.tasks, id); }
  function category(id) { return byId(state.categories, id); }

  /* ---------------- tasks ---------------- */

  function saveTask(data) {
    // A task named by a parent is translated for anyone reading in another
    // language; the built-in ones already have a key for every language.
    if (data.title && !data.titleKey) {
      var previous = data.id ? byId(state.tasks, data.id) : null;
      if (!previous || previous.title !== data.title) {
        delete data.tr;
        stamp(data, "title");
      }
    } else {
      delete data.srcLang;
      delete data.tr;
    }
    if (data.id) {
      var t = byId(state.tasks, data.id);
      if (t) {
        delete t.tr;
        Object.keys(data).forEach(function (k) { t[k] = data[k]; });
      }
    } else {
      data.id = uid("task");
      state.tasks.push(data);
    }
    save();
    return data;
  }

  function saveCategory(id, name, icon) {
    var cat = byId(state.categories, id);
    if (!cat) return null;
    if (cat.key) {                       // a built-in name becomes a custom one
      delete cat.key;
      cat.name = name;
      stamp(cat, "name");
    } else if (cat.name !== name) {
      cat.name = name;
      delete cat.tr;
      stamp(cat, "name");
    }
    cat.icon = icon;
    save();
    return cat;
  }

  function addCategory(name, icon) {
    var cat = stamp({ id: uid("cat"), name: name, icon: icon }, "name");
    state.categories.push(cat);
    save();
    return cat;
  }
  function deleteTask(id) {
    forget(id);
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    state.claims = state.claims.filter(function (c) { return c.taskId !== id; });
    save();
  }
  function tasksForChild(childId, includeInactive) {
    return state.tasks.filter(function (t) {
      if (!t.active && !includeInactive) return false;
      if (t.assign === "all") return true;
      return (t.assignIds || []).indexOf(childId) !== -1;
    });
  }

  function reward(id) { return byId(state.rewards, id); }

  function saveReward(data) {
    if (data.title && !data.titleKey) {
      var previous = data.id ? byId(state.rewards, data.id) : null;
      if (!previous || previous.title !== data.title) {
        delete data.tr;
        stamp(data, "title");
      }
    } else {
      delete data.srcLang;
      delete data.tr;
    }
    data.cost = Math.max(0, num(data.cost));
    if (data.id) {
      var r = byId(state.rewards, data.id);
      if (r) {
        delete r.tr;
        Object.keys(data).forEach(function (k) { r[k] = data[k]; });
      }
    } else {
      data.id = uid("rw");
      state.rewards.push(data);
    }
    save();
    return data;
  }
  function deleteReward(id) {
    forget(id);
    state.rewards = state.rewards.filter(function (r) { return r.id !== id; });
    state.claims = state.claims.filter(function (c) { return c.rewardId !== id; });
    save();
  }
  function rewardsFor(childId, includeInactive) {
    return state.rewards.filter(function (r) {
      if (r.kind !== "child") return false;
      if (!r.active && !includeInactive) return false;
      if (r.assign === "all") return true;
      return (r.assignIds || []).indexOf(childId) !== -1;
    });
  }
  function familyRewards(includeInactive) {
    return state.rewards.filter(function (r) {
      return r.kind === "family" && (r.active || includeInactive);
    }).sort(function (a, b) { return num(a.cost) - num(b.cost); });
  }

  /* ---------------- points ---------------- */

  function record(entry) {
    entry.id = uid("led");
    entry.ts = entry.ts || now();
    state.ledger.push(entry);
    save();
    return entry;
  }

  function awardTask(childId, taskId, outcome, byParentId) {
    var t = task(taskId);
    if (!t) return null;
    var done = outcome === "done";
    var self = 0, group = 0;
    if (t.scope === "personal" || t.scope === "both") self = done ? num(t.onDoneSelf) : num(t.onMissSelf);
    if (t.scope === "group" || t.scope === "both") group = done ? num(t.onDoneGroup) : num(t.onMissGroup);
    return record({
      childId: childId, taskId: taskId, kind: done ? "award" : "penalty",
      self: self, group: group, note: "", by: byParentId || null
    });
  }

  function adjust(childId, self, group, note, byParentId) {
    var entry = {
      childId: childId, taskId: null, kind: "manual",
      self: num(self), group: num(group), note: note || "", by: byParentId || null
    };
    if (entry.note) stamp(entry, "note");
    return record(entry);
  }

  /* Points are whole numbers everywhere — half a point would be meaningless —
     so `num` truncates on purpose. Money and interest rates are not: they need
     `dec`, and using `num` on either quietly loses the cents. */
  function num(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
  function dec(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

  function balance(childId) {
    return state.ledger.reduce(function (sum, l) {
      return l.childId === childId ? sum + num(l.self) : sum;
    }, 0);
  }
  /* A reversal is a row of its own carrying the opposite amounts, so every
     total that simply adds the ledger up already accounts for it. Nothing else
     has to know. */
  function groupTotal() {
    return state.ledger.reduce(function (sum, l) { return sum + num(l.group); }, 0);
  }
  function earnedBetween(childId, fromTs, toTs) {
    return state.ledger.reduce(function (sum, l) {
      if (l.childId !== childId || l.kind === "start") return sum;
      if (l.ts < fromTs || l.ts > toTs) return sum;
      return sum + num(l.self);
    }, 0);
  }

  /* ---------------- weeks, birthdays ---------------- */

  function weekRange(ref) {
    var d = ref ? new Date(ref) : new Date();
    var start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = (start.getDay() - state.settings.weekStart + 7) % 7;
    start.setDate(start.getDate() - diff);
    var end = new Date(start);
    end.setDate(end.getDate() + 7);
    return { start: start, end: end, startTs: start.toISOString(), endTs: end.toISOString() };
  }

  function weekEarned(childId, ref) {
    var w = weekRange(ref);
    return earnedBetween(childId, w.startTs, w.endTs);
  }

  /* Winner of the week: most points earned since the week started.
     Ties break on the overall balance, then on name, so the result is stable. */
  function weekWinner(ref) {
    var rows = state.children.map(function (c) {
      return { child: c, earned: weekEarned(c.id, ref), balance: balance(c.id) };
    }).filter(function (r) { return r.earned > 0; });
    if (!rows.length) return null;
    rows.sort(cmpRows);
    return rows[0];
  }

  function standings() {
    return state.children.map(function (c) {
      return { child: c, balance: balance(c.id), earned: weekEarned(c.id) };
    }).sort(cmpRows);
  }

  function cmpRows(a, b) {
    if (b.earned !== a.earned) return b.earned - a.earned;
    if (b.balance !== a.balance) return b.balance - a.balance;
    return a.child.name.localeCompare(b.child.name);
  }

  function topScorer() {
    var rows = state.children.map(function (c) {
      return { child: c, balance: balance(c.id), earned: weekEarned(c.id) };
    });
    if (!rows.length) return null;
    rows.sort(function (a, b) {
      if (b.balance !== a.balance) return b.balance - a.balance;
      return a.child.name.localeCompare(b.child.name);
    });
    return rows[0];
  }

  function birthdayInfo(c) {
    if (!c.birthday) return null;
    var parts = String(c.birthday).split("-");
    if (parts.length < 3) return null;
    var by = +parts[0], bm = +parts[1] - 1, bd = +parts[2];
    var today = new Date();
    today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var next = new Date(today.getFullYear(), bm, bd);
    if (next < today) next = new Date(today.getFullYear() + 1, bm, bd);
    var days = Math.round((next - today) / 86400000);
    return { date: next, days: days, turning: next.getFullYear() - by, age: today.getFullYear() - by - (next.getFullYear() > today.getFullYear() ? 0 : 1) };
  }

  /* ---------------- claims ---------------- */

  function claimTask(childId, taskId) {
    var open = state.claims.filter(function (c) {
      return c.childId === childId && c.taskId === taskId && c.status === "pending";
    })[0];
    if (open) return open;
    var claim = {
      id: uid("clm"), kind: "task", childId: childId, taskId: taskId, rewardId: null,
      ts: now(), dayKey: dayKey(), status: "pending", decidedBy: null, decidedTs: null
    };
    state.claims.push(claim);
    save();
    return claim;
  }

  function claimReward(childId, rewardId) {
    var open = state.claims.filter(function (c) {
      return c.childId === childId && c.rewardId === rewardId && c.status === "pending";
    })[0];
    if (open) return open;
    var claim = {
      id: uid("clm"), kind: "reward", childId: childId, taskId: null, rewardId: rewardId,
      ts: now(), dayKey: dayKey(), status: "pending", decidedBy: null, decidedTs: null
    };
    state.claims.push(claim);
    save();
    return claim;
  }
  function rewardClaimFor(childId, rewardId) {
    var mine = state.claims.filter(function (c) {
      return c.childId === childId && c.rewardId === rewardId &&
             (c.status === "pending" || c.dayKey === dayKey());
    });
    return mine[mine.length - 1] || null;
  }
  function pendingClaims() {
    return state.claims.filter(function (c) { return c.status === "pending"; })
      .sort(function (a, b) { return a.ts < b.ts ? -1 : 1; });
  }
  function decideClaim(claimId, approve, byParentId) {
    var c = byId(state.claims, claimId);
    if (!c || c.status !== "pending") return null;
    if (approve && c.kind === "reward") {
      // Points may have been spent since the child asked; do not go negative.
      if (!redeem(c.rewardId, c.childId, "", byParentId)) return null;
    }
    if (approve && (c.kind === "deposit" || c.kind === "withdraw")) {
      var moved = c.kind === "deposit"
        ? deposit(c.childId, c.amount, c.note, byParentId, c.cur, c.source)
        : withdraw(c.childId, c.amount, c.note, byParentId, c.cur);
      if (!moved) return null;          // a withdrawal the account cannot cover
      c.moneyId = moved.id;
    }
    c.status = approve ? "approved" : "rejected";
    c.decidedBy = byParentId || null;
    c.decidedTs = now();
    if (approve && c.kind !== "reward" && c.kind !== "deposit" && c.kind !== "withdraw") {
      awardTask(c.childId, c.taskId, "done", byParentId);
    }
    save();
    return c;
  }
  function claimFor(childId, taskId) {
    var today = dayKey();
    var mine = state.claims.filter(function (c) {
      return c.childId === childId && c.taskId === taskId &&
             (c.status === "pending" || c.dayKey === today);
    });
    return mine[mine.length - 1] || null;
  }

  /* ---------------- rewards ---------------- */

  /* The group bank aims at the cheapest family reward it cannot afford yet, so
     the goal moves with the catalogue instead of being one fixed number. */
  function goalProgress() {
    var total = groupTotal();
    var list = familyRewards();
    var unlocked = list.filter(function (r) { return num(r.cost) <= total; });
    var next = list.filter(function (r) { return num(r.cost) > total; })[0] || null;
    var goal = next ? num(next.cost)
             : list.length ? num(list[list.length - 1].cost)
             : num(state.settings.groupGoal) || 1000;
    return {
      total: total, goal: goal, next: next, unlocked: unlocked,
      reached: unlocked.length > 0,
      missing: Math.max(0, goal - total),
      pct: goal > 0 ? Math.max(0, Math.min(100, Math.round(total / goal * 100))) : 100
    };
  }

  /* Spending points on a reward. Family rewards come out of the group bank,
     child rewards out of that child's own balance; neither may go negative. */
  function redeem(rewardId, childId, note, byParentId) {
    var r = reward(rewardId);
    if (!r) return null;
    var cost = num(r.cost);
    var family = r.kind === "family";
    if (family && groupTotal() < cost) return null;
    if (!family && (!childId || balance(childId) < cost)) return null;

    var entry = {
      id: uid("red"), ts: now(), date: dayKey(), rewardId: r.id, kind: r.kind,
      title: r.titleKey ? "" : r.title, titleKey: r.titleKey || "",
      icon: r.icon, cost: cost, childId: childId || null, note: note || "",
      by: byParentId || null, srcLang: r.srcLang, tr: r.tr ? clone(r.tr) : undefined
    };
    if (entry.note) stamp(entry, "note");
    state.redemptions.unshift(entry);
    record({
      childId: family ? null : childId, taskId: null, kind: "reward",
      self: family ? 0 : -cost, group: family ? -cost : 0,
      note: note || "", rewardId: r.id, by: byParentId || null
    });
    save();
    return entry;
  }

  function recordMovieNight(winnerId, movie, note, byParentId) {
    var entry = {
      id: uid("mov"), ts: now(), date: dayKey(),
      winnerId: winnerId, movie: movie, note: note || "", by: byParentId || null
    };
    state.movieNights.unshift(entry);
    save();
    return entry;
  }
  function movieNightToday() {
    var today = dayKey();
    return state.movieNights.filter(function (m) { return m.date === today; })[0] || null;
  }
  function isMovieDay() {
    return new Date().getDay() === num(state.settings.movieDay);
  }

  /* ---------------- child content ---------------- */

  function addListItem(childId, field, text) {
    var c = child(childId);
    if (!c || !text) return null;
    if (!c[field]) c[field] = [];
    var item = stamp({ id: uid(field), text: text, ts: now() }, "text");
    c[field].unshift(item);
    save();
    return item;
  }
  function updateListItem(childId, field, itemId, text) {
    var c = child(childId);
    if (!c || !c[field] || !text) return null;
    var item = byId(c[field], itemId);
    if (!item || item.text === text) return item;
    item.text = text;
    item.editedAt = now();
    delete item.tr;
    stamp(item, "text");
    save();
    return item;
  }

  function removeListItem(childId, field, itemId) {
    var c = child(childId);
    if (!c || !c[field]) return;
    forget(itemId);
    c[field] = c[field].filter(function (i) { return i.id !== itemId; });
    save();
  }
  function moveListItem(childId, field, itemId, dir) {
    var c = child(childId);
    if (!c || !c[field]) return;
    var list = c[field];
    var i = list.findIndex(function (x) { return x.id === itemId; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    save();
  }


  /* ================= the Bank of Mum and Dad =================

     Real money a child has handed a parent to look after, kept in its own
     append-only ledger beside the points one. The two never mix: points are
     earned and spent inside the app, money is a record of what a parent is
     actually holding. The one bridge between them is `convert`, and it is the
     parent who sets the rate.

     Everything a child does here is a request. Approving it is what moves
     money, exactly as with chores and rewards. */

  function moneyLedger() { return (state.money = state.money || []); }
  function depositList() { return (state.deposits = state.deposits || []); }

  var CURRENCIES = ["ILS", "EUR"];

  /* Where money paid in came from. Kept as a short list rather than free text
     so a year of entries can be read back at a glance — the note beside it is
     still there for anything this does not cover. */
  var SOURCES = [
    { id: "allowance",    key: "src.allowance",    icon: "\u{1F4B0}" },
    { id: "gift",         key: "src.gift",         icon: "\u{1F381}" },
    { id: "birthday",     key: "src.birthday",     icon: "\u{1F382}" },
    { id: "holiday",      key: "src.holiday",      icon: "\u{1F38A}" },
    { id: "grandparents", key: "src.grandparents", icon: "\u{1F475}" },
    { id: "work",         key: "src.work",         icon: "\u{1F9F9}" },
    { id: "sold",         key: "src.sold",         icon: "\u{1F3F7}\uFE0F" },
    { id: "saved",        key: "src.saved",        icon: "\u{1F437}" },
    { id: "other",        key: "src.other",        icon: "\u2728" }
  ];
  function source(id) { return byId(SOURCES, id); }

  /* The currency a family works in by default. Money is not held in it alone:
     every entry and every deposit carries its own, so a child who is handed
     euros gets a euro account beside the shekel one rather than a number in the
     wrong units. */
  function currency() { return (state.settings && state.settings.currency) || "ILS"; }
  function curOf(x) { return (x && x.cur) || currency(); }

  /* Which accounts a child actually has: the family default always, plus any
     other currency they have been given or put away. */
  function currenciesFor(childId) {
    var out = [currency()];
    moneyLedger().forEach(function (m) {
      if (m.childId === childId && m.cur && out.indexOf(m.cur) === -1) out.push(m.cur);
    });
    depositList().forEach(function (d) {
      if (d.childId === childId && d.cur && out.indexOf(d.cur) === -1) out.push(d.cur);
    });
    return out;
  }

  /* Money is held to the cent so a rate like 137 points to the euro cannot
     leak fractions into a balance nobody can hand over. */
  function money(v) { return Math.round(dec(v) * 100) / 100; }

  function moneyRecord(entry) {
    entry.id = entry.id || uid("mny");
    entry.ts = entry.ts || now();
    entry.amount = money(entry.amount);
    moneyLedger().push(entry);
    save();
    return entry;
  }

  /* A balance is what is on hand — money inside an open deposit is locked away
     and is reported separately, so a child can see both. */
  function cashBalance(childId, cur) {
    cur = cur || currency();
    return money(moneyLedger().reduce(function (sum, m) {
      return m.childId === childId && curOf(m) === cur && !m.void ? sum + dec(m.amount) : sum;
    }, 0));
  }
  function lockedBalance(childId, cur) {
    cur = cur || currency();
    return money(depositList().reduce(function (sum, d) {
      return d.childId === childId && curOf(d) === cur && d.status === "open" ? sum + dec(d.amount) : sum;
    }, 0));
  }
  function moneyTotal(childId, cur) { return money(cashBalance(childId, cur) + lockedBalance(childId, cur)); }

  function moneyFor(childId, cur) {
    return moneyLedger().filter(function (m) {
      return m.childId === childId && (!cur || curOf(m) === cur);
    }).slice().sort(function (a, b) { return a.ts < b.ts ? 1 : -1; });
  }

  /* ---- what a parent does directly ---- */

  function deposit(childId, amount, note, byParentId, cur, src) {
    var v = money(Math.abs(dec(amount)));
    if (!v) return null;
    var entry = { childId: childId, kind: "deposit", amount: v, cur: cur || currency(),
                  source: source(src) ? src : "", note: note || "", by: byParentId || null };
    if (entry.note) stamp(entry, "note");
    return moneyRecord(entry);
  }

  function withdraw(childId, amount, note, byParentId, cur) {
    cur = cur || currency();
    var v = money(Math.abs(dec(amount)));
    if (!v) return null;
    if (v > cashBalance(childId, cur)) return null;   // never let an account go under
    var entry = { childId: childId, kind: "withdraw", amount: -v, cur: cur,
                  note: note || "", by: byParentId || null };
    if (entry.note) stamp(entry, "note");
    return moneyRecord(entry);
  }

  /* ---- points into money ----
     `pointsPerUnit` is how many points buy one euro or one shekel. Zero or
     blank means the family has not opened that door, and the button is not
     offered at all. */
  function rateTable() {
    var r = state.settings.pointsPerUnit;
    /* It used to be a single number for a single family currency. */
    if (typeof r === "number") {
      r = {}; r[currency()] = Math.max(0, Math.round(state.settings.pointsPerUnit));
      state.settings.pointsPerUnit = r;
    }
    return (state.settings.pointsPerUnit = r || {});
  }
  function conversionRate(cur) { return Math.max(0, Math.round(num(rateTable()[cur || currency()]))); }
  function setConversionRate(cur, points) {
    rateTable()[cur || currency()] = Math.max(0, Math.round(num(points)));
    save();
  }
  function pointsToMoney(points, cur) {
    var rate = conversionRate(cur);
    return rate ? money(num(points) / rate) : 0;
  }
  function convert(childId, points, byParentId, cur) {
    cur = cur || currency();
    var rate = conversionRate(cur);
    var p = Math.abs(Math.round(num(points)));
    if (!rate || !p) return null;
    if (p > balance(childId)) return null;
    var value = pointsToMoney(p, cur);
    if (!value) return null;
    /* Two entries, one act: the points leave the points ledger and the money
       arrives in the money ledger, each carrying the other's id so the pair can
       be undone together. */
    var cash = moneyRecord({ childId: childId, kind: "convert", amount: value, cur: cur,
                             points: p, note: "", by: byParentId || null });
    var spent = record({ childId: childId, taskId: null, kind: "convert",
                         self: -p, group: 0, note: "", by: byParentId || null, moneyId: cash.id });
    cash.ledgerId = spent.id;
    save();
    return { cash: cash, points: spent };
  }

  /* ---- deposit products ----
     A family writes its own: a term in days, a yearly rate, and whether the
     money can be taken out before the term is up. A year at 5% with the door
     locked, or a day at 0.5% with the door always open. */
  /* The stored list, for writing to. */
  function typeList() { return (state.settings.depositTypes = state.settings.depositTypes || []); }

  /* What a reader gets: shortest term first, so the list reads as the ladder it
     is meant to be rather than in the order somebody happened to add them. A
     sorted copy, so the order on screen never rewrites what is stored and sets
     off a sync. */
  function depositTypes(cur) {
    return typeList()
      .filter(function (d) { return !cur || curOf(d) === cur; })
      .slice()
      .sort(function (a, b) {
        return num(a.termDays) - num(b.termDays) || dec(a.ratePct) - dec(b.ratePct);
      });
  }
  function depositType(id) { return byId(depositTypes(), id); }

  function saveDepositType(data) {
    var list = typeList();
    var existing = data.id ? byId(list, data.id) : null;
    var type = existing || { id: uid("dpt") };
    type.name = data.name || "";
    type.cur = CURRENCIES.indexOf(data.cur) === -1 ? currency() : data.cur;
    type.termDays = Math.max(1, Math.round(num(data.termDays)) || 1);
    type.ratePct = Math.max(0, dec(data.ratePct));

      '<div class="kid-grid">' + s.children.map(function (c) {
        return '<button class="kid-card" data-act="login.child" data-id="' + c.id +
          '" style="--kid:' + S.childColor(c) + '">' +
          U.childAvatar(c, 56) + '<span class="nm">' + U.name(c) + "</span>" +
          (c.pin ? '<span class="tag">🔒</span>' : "") + "</button>";
      }).join("") + "</div>";
  }

  U.on("login.tab", function (d) { loginTab = d.tab; loginError = ""; global.App.refresh(); });
  U.on("login.lang", function (d) {
    global.I18N.setLang(d.lang);
    var s = global.Store.get();
    s.settings.lang = d.lang;
    global.Store.save();
    global.App.refresh();
  });
  U.on("login.parent", function (d, form) {
    var user = U.el("#lUser", form).value;
    var pass = U.el("#lPass", form).value;
    var p = global.Store.findParent(user);
    if (!p || !global.Store.checkSecret(p.secret, pass)) {
      loginError = t("auth.badLogin");
      return global.App.refresh();
    }
    loginError = "";
    global.Store.setSession("parent", p.id);
    global.App.applyUserLang();
    global.App.go({ screen: "parent", tab: "dashboard" });
    U.toast(t("auth.welcomeBack", { name: global.Store.nameOf(p) }), "good");
  });
  U.on("login.child", function (d) {
    var c = global.Store.child(d.id);
    if (!c) return;
    if (!c.pin) return enterAsChild(c);
    pinChildId = c.id;
    U.modal(global.Store.nameOf(c),
      '<form data-act="login.pin">' +
        '<p class="lead center">' + esc(t("auth.enterPin")) + "</p>" +
        '<div class="center">' + U.childAvatar(c, 64) + "</div>" +
        '<div class="field"><input id="pinBox" type="tel" inputmode="numeric" maxlength="4" class="pin-input" autocomplete="off"></div>' +
        '<button class="btn block" type="submit">' + esc(t("common.login")) + "</button>" +
      "</form>",
      function (body) { var i = U.el("#pinBox", body); if (i) i.focus(); });
  });
  U.on("login.pin", function (d, form) {
    var c = global.Store.child(pinChildId);
    // A PIN is stored as digits only, so read it back the same way: a keyboard
    // that slips in a space or a direction mark must not fail a correct code.
    var val = U.el("#pinBox", form).value.replace(/\D/g, "");
    if (!c || !global.Store.checkSecret(c.pin, val)) {
      U.toast(t("auth.badPin"), "bad");
      return;

    U.closeModal();
    enterAsChild(c);

    global.App.applyUserLang();
    global.App.go({ screen: "child", tab: "me" });
    U.toast(t("auth.welcomeBack", { name: global.Store.nameOf(c) }), "good");

  global.Setup = { render: render, renderLogin: renderLogin, reset: reset };

/* ==== js/parent.js ==== */
/* Parent (admin) screens: dashboard, tasks, kids, approvals, settings. */
(function (global) {
  "use strict";

  var t = function (k, p) { return global.I18N.t(k, p); };
  var esc = function (s) { return global.UI.esc(s); };
  var U = global.UI, S = global.Store;

  var showInactive = false;
  var taskDraft = null;
  var awardCtx = null;

  function me() { return S.parent(global.App.session().id); }

  function render(tab, params) {
    if (tab === "dashboard") return dashboard();
    if (tab === "tasks") return tasksTab();
    if (tab === "rewards") return rewardsTab();
    if (tab === "kids") return params && params.childId ? childDetail(params.childId) : kidsTab();
    if (tab === "approvals") return approvalsTab();

  }

  /* ================= dashboard ================= */

  function dashboard() {
    var s = S.get();
    var gp = S.goalProgress();
    var rows = S.standings();
    var pending = S.pendingClaims();

    var html = '<div class="wrap">';

    html += bankCard(gp);

    if (pending.length) {
      html += '<div class="card tappable" data-act="p.goApprovals">' +
        '<div class="row between"><strong>🔔 ' + esc(t("dash.pending", { n: U.iso(pending.length) })) + "</strong><span>→</span></div></div>";
    }

    html += movieCard();

    html += '<div class="section-title">' + esc(t("dash.standings")) + "</div>";
    html += '<div class="card flush">' + (rows.length
      ? '<ul class="list">' + rows.map(function (r, i) {
          return '<li class="tappable kid-row" data-act="p.openChild" data-id="' + r.child.id +
            '" style="--kid:' + S.childColor(r.child) + '">' +
            '<span class="rank-badge' + (i === 0 && r.earned > 0 ? " gold" : "") + '">' + (i + 1) + "</span>" +
            U.childAvatar(r.child, 40) +
            '<div class="grow"><div class="title">' + U.name(r.child) + "</div>" +
            '<div class="sub">' + esc(t("dash.earnedThisWeek", { n: U.signed(r.earned) })) + "</div></div>" +
            U.scoreEl("dash:" + r.child.id, r.balance, { style: "font-size:1.15rem" }) + "</li>";
        }).join("") + "</ul>"
      : U.emptyState(t("common.empty"), "🧒", t("empty.kids"),

    html += birthdaysCard();
    html += activityCard();
    html += "</div>";
    return html;
  }

  function movieCard() {
    var s = S.get();
    var winner = S.weekWinner();
    var todays = S.movieNightToday();
    var isDay = S.isMovieDay();
    // whatever is already shown as tonight's pick should not repeat in history
    var history = s.movieNights.filter(function (m) {
      return !todays || m.id !== todays.id;
    }).slice(0, 3);

    if (!isDay && !history.length && !todays) return "";

    var body = "";
    if (todays) {
      body = "<p><strong>🍿 " + esc(todays.movie) + "</strong><br><small>" +
        esc(t("movie.pickedBy", { name: nameOf(todays.winnerId) })) + "</small></p>";
    } else if (isDay && winner) {
      body = "<p><strong>" + U.name(winner.child) + "</strong> · " + esc(weeklyPrize()) + "</p>" +
        '<button class="btn block" data-act="p.movie">' + esc(t("movie.record")) + "</button>";
    } else if (isDay) {
      body = '<p class="lead">' + esc(t("movie.noWinner")) + "</p>";
    }

    var past = history.length
      ? '<div class="section-title" style="margin-top:14px">' + esc(t("movie.history")) + "</div>" +
        history.map(function (m) {
          return '<div class="kv"><span class="k">' + esc(U.fmtDate(m.ts)) + "</span><span>" +
            esc(m.movie) + " · " + esc(nameOf(m.winnerId)) + "</span></div>";
        }).join("")
      : "";

    return '<div class="card">' +
      '<div class="eyebrow">' + esc(weeklyPrize()) + (isDay ? " · " + esc(t("movie.tonight")) : "") + "</div>" +
      body + past + "</div>";
  }

  /* The weekly winner's prize is a family decision, so the label is editable
     and "picks tonight's film" is only the default. */
  function weeklyPrize() {
    var custom = (S.get().settings.weeklyPrize || "").trim();
    return custom || t("movie.prizeDefault");
  }

  function birthdaysCard() {
    var s = S.get();
    var rows = s.children.map(function (c) { return { child: c, bd: S.birthdayInfo(c) }; })
      .filter(function (r) { return r.bd; })
      .sort(function (a, b) { return a.bd.days - b.bd.days; });
    if (!rows.length) return "";
    return '<div class="section-title">' + esc(t("dash.birthdays")) + "</div>" +
      '<div class="card">' + rows.map(function (r) {
        var label = r.bd.days === 0 ? t("dash.birthdayToday")
                  : r.bd.days === 1 ? t("dash.tomorrow")
                  : t("dash.daysLeft", { n: r.bd.days });
        return '<div class="countdown' + (r.bd.days === 0 ? " today" : "") + '">' +
          '<span class="days">' + (r.bd.days === 0 ? "🎂" : r.bd.days) + "</span>" +
          U.childAvatar(r.child, 36) +
          '<div class="grow"><div class="title">' + U.name(r.child) + "</div>" +
          '<div class="sub">' + esc(label) + " · " + esc(t("dash.turns", { n: r.bd.turning })) + "</div></div></div>";
      }).join("") + "</div>";
  }

  function activityCard() {
    var s = S.get();
    var rows = s.ledger.slice().reverse().filter(function (l) { return l.kind !== "start"; }).slice(0, 8);
    if (!rows.length) return "";
    return '<div class="section-title">' + esc(t("dash.activity")) + "</div>" +
      '<div class="card flush"><ul class="list">' + rows.map(function (l) {
        return "<li>" + (l.childId ? U.childAvatar(S.child(l.childId), 34) : '<span class="rank-badge">👨‍👩‍👧</span>') +
          '<div class="grow"><div class="title">' + ledgerLabelHtml(l) + "</div>" +
          '<div class="sub">' + esc(l.childId ? nameOf(l.childId) : t("rewards.family")) + " · " + esc(U.relTime(l.ts)) + "</div></div>" +
          '<div class="pts-cell">' + (l.self ? U.points(l.self) : "") +
          (l.group ? '<small>' + esc(t("tasks.groupPts")) + " " + U.points(l.group) + "</small>" : "") + "</div></li>";
      }).join("") + "</ul></div>";
  }

  function ledgerLabel(l) {
    if (l.kind === "award" || l.kind === "penalty") {
      var task = S.task(l.taskId);
      return (task ? U.taskTitle(task) : t(l.kind === "award" ? "ledger.award" : "ledger.penalty"));
    }
    if (l.kind === "reward" || l.kind === "redeem") {
      var rw = S.reward(l.rewardId);
      return (rw ? U.keyedTitle(rw) : t("ledger.reward")) + (l.note ? " · " + U.trValue(l, "note") : "");
    }
    if (l.kind === "start") return t("ledger.start");
    return l.note || t("ledger.manual");
  }
  function ledgerLabelHtml(l) {
    if (l.kind === "award" || l.kind === "penalty") {
      var task = S.task(l.taskId);
      return task ? U.taskTitleHtml(task) : esc(t(l.kind === "award" ? "ledger.award" : "ledger.penalty"));
    }
    if (l.kind === "reward" || l.kind === "redeem") {
      var rw = S.reward(l.rewardId);
      return (rw ? U.keyedTitleHtml(rw) : esc(t("ledger.reward"))) + (l.note ? " · " + U.trHtml(l, "note") : "");
    }
    if (l.kind === "start") return esc(t("ledger.start"));
    return l.note ? U.trHtml(l, "note") : esc(t("ledger.manual"));
  }
  function nameOf(childId) { var c = S.child(childId); return c ? c.name : "—"; }

  /* ================= tasks ================= */

  function tasksTab() {
    var s = S.get();
    var html = '<div class="wrap">' +
      '<div class="row between"><h1>' + esc(t("tasks.title")) + "</h1>" +
      '<button class="btn small" data-act="p.taskNew">＋ ' + esc(t("tasks.add")) + "</button></div>" +
      '<label class="row tight" style="font-size:.85rem;color:var(--ink-soft)">' +
        '<input type="checkbox" style="width:auto" ' + (showInactive ? "checked" : "") +
        ' data-act="p.toggleInactive"> ' + esc(t("tasks.showInactive")) + "</label>";

    s.categories.forEach(function (cat) {
      var list = s.tasks.filter(function (t2) {
        return t2.categoryId === cat.id && (showInactive || t2.active);
      });
      if (!list.length) return;
      html += '<div class="section-title">' + cat.icon + " " + U.categoryNameHtml(cat) + "</div>" +
        '<div class="card flush">' + list.map(taskRow).join("") + "</div>";
    });

    var orphans = s.tasks.filter(function (t2) {
      return !S.category(t2.categoryId) && (showInactive || t2.active);
    });
    if (orphans.length) {
      html += '<div class="section-title">' + esc(t("cat.other")) + "</div>" +
        '<div class="card flush">' + orphans.map(taskRow).join("") + "</div>";
    }

      html += U.emptyState(t("tasks.empty"), "📋", t("empty.tasks"),
        '<button class="btn small" data-act="p.taskNew">＋ ' + esc(t("tasks.add")) + "</button>");
    }
    return html + "</div>";
  }

  function taskRow(task) {
    var scopeTag = task.scope === "both" ? t("tasks.scopeBoth")
                 : task.scope === "group" ? t("tasks.scopeGroup") : t("tasks.scopePersonal");
    var assignTag = task.assign === "all" ? t("tasks.assignAll")
      : (task.assignIds || []).map(nameOf).join(", ");
    var pts = "";
    if (task.scope !== "group") {
      pts += '<div class="sub">' + esc(t("tasks.selfPts")) + " " +
        U.points(task.onDoneSelf) + " / " + U.points(task.onMissSelf) + "</div>";
    }
    if (task.scope !== "personal") {
      pts += '<div class="sub">' + esc(t("tasks.groupPts")) + " " +
        U.points(task.onDoneGroup) + " / " + U.points(task.onMissGroup) + "</div>";
    }

    return '<div class="task-row' + (task.active ? "" : " paused") + '">' +
      '<div class="grow">' +
        '<div class="title">' + U.taskTitleHtml(task) + "</div>" +
        '<div class="sub">' + esc(scopeTag) + " · " + esc(assignTag) + " · " + esc(t("tasks.repeat" + cap(task.repeat))) +
        (task.active ? "" : " · " + esc(t("tasks.inactive"))) + "</div>" +
        pts +
      "</div>" +
      '<div class="row tight nowrap">' +
        '<button class="btn small good" data-act="p.award" data-id="' + task.id + '" data-outcome="done">✓</button>' +
        '<button class="btn small danger" data-act="p.award" data-id="' + task.id + '" data-outcome="missed">✗</button>' +
        '<button class="icon-btn" data-act="p.taskEdit" data-id="' + task.id + '">✏️</button>' +
      "</div></div>";

  function cap(s) { return String(s || "once").charAt(0).toUpperCase() + String(s || "once").slice(1); }

  function taskEditor(task) {

      scope: "personal", onDoneSelf: 10, onMissSelf: -5, onDoneGroup: 0, onMissGroup: 0,

    };

  function taskEditorBody() {

          ["daily", "weekly", "once"].map(function (r) {

          }).join("") + "</select></div>" +
      "</div>" +
      '<div class="field"><span class="field-label">' + esc(t("tasks.scope")) + "</span>" +

        }).join("") + "</div></div>" +
      (withSelf ? '<div class="field"><span class="field-label">' + esc(t("tasks.selfPts")) + "</span>" +

        "</div>" +
        (d.assign === "some" ? '<div class="chips">' + s.children.map(function (c) {
          var on = (d.assignIds || []).indexOf(c.id) !== -1;

        }).join("") + "</div>" : "") +
      "</div>" +

        esc(t("tasks.active")) + "</label>" +

        (d.id ? '<button type="button" class="btn danger small" data-act="p.taskDelete" data-id="' + d.id + '">🗑️</button>' : "") +
        '<button class="btn grow" type="submit">' + esc(t("common.save")) + "</button>" +
      "</div></form>";
  }

  function captureTask() {
    var v = function (id) { var n = U.el("#" + id); return n ? n.value : null; };
    if (v("tTitle") !== null) {
      taskDraft.title = v("tTitle").trim();
      if (taskDraft.titleKey && taskDraft.title !== t(taskDraft.titleKey)) taskDraft.titleKey = "";
    }
    if (v("tCat") !== null) taskDraft.categoryId = v("tCat");
    if (v("tRep") !== null) taskDraft.repeat = v("tRep");
    if (v("tDoneSelf") !== null) taskDraft.onDoneSelf = S.num(v("tDoneSelf"));
    if (v("tMissSelf") !== null) taskDraft.onMissSelf = S.num(v("tMissSelf"));
    if (v("tDoneGroup") !== null) taskDraft.onDoneGroup = S.num(v("tDoneGroup"));
    if (v("tMissGroup") !== null) taskDraft.onMissGroup = S.num(v("tMissGroup"));
    var a = U.el("#tActive");
    if (a) taskDraft.active = a.checked;

  function redrawTaskEditor() {
    captureTask();
    var body = U.el(".modal-body");

  }

  /* ================= rewards ================= */

      '<div class="row between"><h1>' + esc(t("rewards.title")) + "</h1>" +

    html += '<div class="section-title">' + esc(t("rewards.family")) + "</div>" +
      '<div class="card flush">' + (family.length
        ? family.map(function (r) { return rewardRow(r, gp); }).join("")
        : U.emptyState(t("rewards.empty"), "🎁", t("empty.rewards"),
            '<button class="btn small" data-act="p.rewardNew">＋ ' + esc(t("rewards.add")) + "</button>")) + "</div>" +
      '<p class="hint">' + esc(t("rewards.familyHint")) + "</p>";

    html += '<div class="section-title">' + esc(t("rewards.child")) + "</div>" +
      '<div class="card flush">' + (kidPrizes.length

  function bankCard(gp) {
    return '<div class="card hero">' +
      '<div class="eyebrow">' + esc(t("dash.groupBank")) + "</div>" +
      '<div class="row between nowrap"><div class="score">' + gp.total + "</div>" +
      '<div class="tag" style="background:rgba(255,255,255,.2);color:#fff">' +

      "</div></div>" +

  function captureReward() {
    var v = function (id) { var n = U.el("#" + id); return n ? n.value : null; };

      rewardDraft.title = v("rTitle").trim();

  function listCard(child, field, title, hint, addLabel, ordered) {

    return '<div class="section-title">' + esc(title) + "</div>" +
      '<div class="card">' +
        '<small>' + esc(hint) + "</small>" +
        (items.length
          ? '<ul class="list" style="margin-top:8px">' + items.map(function (it, i) {

                  '" data-item="' + it.id + '">🗑️</button></li>';

      "</div>";

          '<div class="field"><label for="cnBday">' + esc(t("setup.birthday")) + "</label>" +

        (isNew ? '<p class="hint">' + esc(t("kids.willStartWith", { n: U.iso(S.num(S.get().settings.startPoints)) })) + "</p>" : "") +

  var editingNames = {}, editingNameLang = "en";
  var editingAvatar = "k1";
  var editingColor = "";
  var editingLang = "en";
  function nextFreeAvatar() {
    var used = S.get().children.map(function (c) { return c.avatar; });
    var free = global.AVATARS.kids.filter(function (a) { return used.indexOf(a.id) === -1; })[0];
    return free ? free.id : "k1";
  }
  function nextFreeColor() {
    var used = S.get().children.map(function (c) { return S.childColor(c); });
    var free = global.AVATARS.tones.filter(function (tone) { return used.indexOf(tone.hex) === -1; })[0];
    return free ? free.id : global.AVATARS.tones[0].id;
  }


  /* ================= the bank =================
     A parent sees every child's account, because a parent is the one actually
     holding the money. */

    var s = S.get();
    var html = '<div class="wrap"><h1>' + esc(t("bank.title")) + "</h1>";

      return html + U.emptyState(t("bank.noMoney"), "\u{1F3E6}", t("empty.kids")) + "</div>";
    }

    html += '<div class="card flush"><ul class="list">' + s.children.map(function (c) {
      var lines = S.currenciesFor(c.id).map(function (cur) {
        var locked = S.lockedBalance(c.id, cur);
        return U.cash(S.cashBalance(c.id, cur), { plain: true, currency: cur }) +
          (locked ? " <small>+" + U.cash(locked, { plain: true, currency: cur }) + " " +
            esc(t("bank.locked")) + "</small>" : "");
      });
      return '<li class="kid-row" style="--kid:' + S.childColor(c) + '">' +

        '<div class="sub">' + lines.join(" · ") + "</div></div>" +
        '<div class="row tight nowrap">' +

          '<button class="btn small ghost" data-act="p.bankOut" data-id="' + c.id + '">－</button>' +
          '<button class="btn small soft" data-act="p.bankChild" data-id="' + c.id + '">→</button>' +
        "</div></li>";

    '<p class="hint">' + esc(t("bank.childOnly")) + "</p>";

    html += depositTypesCard();

      S.currencies.map(typesForCurrency).join("") +
      '<p class="hint">' + esc(t("bank.depositTypesHint")) + "</p>" +
      '<p class="hint">' + esc(t("bank.ratesNote")) + "</p>" +
      '<button class="btn ghost small block" data-act="p.typesReset">\u21BA ' +

              '<button class="icon-btn" data-act="p.typeEdit" data-id="' + d.id + '">✏️</button>' +

            "</div>";

  /* "1 ימים" and "1 dagen" are wrong in both languages, so a single day gets
     its own wording rather than a number slotted into a plural. */
  function termText(days) {
    return S.num(days) === 1 ? t("bank.termDay") : t("bank.termDays", { n: U.iso(days) });
  }
  function leftText(days) {
    return days === 1 ? t("bank.maturesIn1") : t("bank.maturesIn", { n: U.iso(days) });
  }

  function typeName(d) { return d.nameKey && !d.name ? esc(t(d.nameKey)) : U.trHtml(d, "name"); }

  function bankSettingsCard() {
    var s = S.get();
    return '<div class="section-title">' + esc(t("bank.settings")) + "</div>" +
      '<div class="card"><form data-act="p.bankSettings">' +
        '<div class="field"><span class="field-label">' + esc(t("bank.defaultCurrency")) + "</span>" +
          '<div class="chips">' + S.currencies.map(function (code) {
            return '<button type="button" class="chip' + (S.currency() === code ? " on" : "") +

          '<div class="hint">' + esc(t("bank.defaultCurrencyHint")) + "</div></div>" +
        '<div class="field"><span class="field-label">' + esc(t("bank.rateTitle")) + "</span>" +

              '<label for="bRate-' + code + '" style="min-width:4.5em;margin:0">' +
                U.currencySymbol(code) + " 1 =</label>" +
              '<input class="grow" id="bRate-' + code + '" type="number" min="0" step="1" value="' +

          '<div class="hint">' + esc(t("bank.rateHintMulti")) + "</div></div>" +
        '<button class="btn block" type="submit">' + esc(t("common.save")) + "</button>" +
      "</form></div>";
