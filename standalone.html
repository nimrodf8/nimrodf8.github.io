  /* One child's account, in full. */
  function bankChild(childId) {
    var c = S.child(childId);
    if (!c) return bankTab();
    return '<div class="wrap">' +
      '<button class="btn ghost small mb" data-act="p.bankBack">← ' + esc(t("common.back")) + "</button>" +
      accountCard(c, false) +
      depositsCard(c, false) +
      moneyHistoryCard(c, true) +
      "</div>";
  }

  /* Shared with the child's own screen: `asChild` decides whether the buttons
     move money or only ask for it. */
  /* One card per account. The family's everyday currency is always the first,
     even at zero; another appears only once a child has actually been given
     money in it. */
  function accountCard(c, asChild) {
    var saving = (c.savingsNote || "").trim();
    var head = asChild ? "" :
      '<div class="center" style="margin-bottom:10px">' + U.childAvatar(c, 64) +
      "<h2 style=\"margin-top:8px\">" + U.name(c) + "</h2></div>";
    var note = saving ? '<p class="center" style="margin-top:10px">\u{1F3AF} ' +
      U.trHtml(c, "savingsNote") + "</p>" : "";

    return head + S.currenciesFor(c.id).map(function (cur, i) {
      var locked = S.lockedBalance(c.id, cur);
      return '<div class="card hero kid center" style="--kid:' + S.childColor(c) + '">' +
        '<div class="eyebrow">' + esc(t("bank.cash")) +
          (i ? " · " + esc(t("bank.otherAccount", { c: cur })) : "") + "</div>" +
        U.scoreEl("cash:" + c.id + ":" + cur, S.cashBalance(c.id, cur),
                  { cls: "hero", money: true, currency: cur }) +
        (locked
          ? '<div class="row gap mt" style="justify-content:center">' +
              '<span class="tag" style="background:rgba(255,255,255,.22);color:#fff">' +
                esc(t("bank.locked")) + " " + U.cash(locked, { plain: true, currency: cur }) + "</span>" +
              '<span class="tag" style="background:rgba(255,255,255,.22);color:#fff">' +
                esc(t("bank.total")) + " " + U.cash(S.moneyTotal(c.id, cur), { plain: true, currency: cur }) + "</span>" +
            "</div>"
          : "") +
        (i === 0 ? note : "") +
        '<div class="row gap mt" style="justify-content:center">' +
          (asChild
            ? '<button class="btn good small" data-act="c.bankAsk" data-kind="deposit" data-cur="' + cur + '">' +
                esc(t("bank.requestDeposit")) + "</button>" +
              '<button class="btn ghost small" data-act="c.bankAsk" data-kind="withdraw" data-cur="' + cur + '">' +
                esc(t("bank.requestWithdraw")) + "</button>"
            : '<button class="btn good small" data-act="p.bankIn" data-id="' + c.id + '" data-cur="' + cur + '">＋ ' +
                esc(t("bank.deposit")) + "</button>" +
              '<button class="btn ghost small" data-act="p.bankOut" data-id="' + c.id + '" data-cur="' + cur + '">－ ' +
                esc(t("bank.withdraw")) + "</button>") +
        "</div>" +
      "</div>";
    }).join("");
  }

  function depositsCard(c, asChild) {
    var all = S.deposits(c.id);
    var open = all.filter(function (d) { return d.status === "open"; });
    var done = all.filter(function (d) { return d.status !== "open"; });
    /* Offered only where the child has money in a currency that has a product
       to put it in — otherwise the button leads to an empty dialog. */
    var canOpen = S.currenciesFor(c.id).some(function (cur) {
      return S.cashBalance(c.id, cur) > 0 &&
        S.depositTypes(cur).some(function (x) { return x.active !== false; });
    });

    var html = '<div class="section-title">' + esc(t("bank.deposits")) +
      (canOpen
        ? '<button class="btn small" data-act="' + (asChild ? "c" : "p") + '.depNew" data-id="' + c.id + '">＋ ' +
          esc(t("bank.openDeposit")) + "</button>"
        : "") + "</div>";

    if (!all.length) {
      return html + U.emptyState(t("bank.noDeposits"), "\u{1F3E6}", t("bank.noDepositsHint"));
    }
    html += '<div class="card flush">' + open.map(function (d) { return depositRow(d, asChild); }).join("");
    if (done.length) {
      html += '<div class="section-title" style="margin:10px 14px 4px">' + esc(t("bank.closedDeposits")) + "</div>" +
        done.slice(0, 8).map(function (d) { return depositRow(d, asChild); }).join("");
    }
    return html + "</div>";
  }

  function depositRow(d, asChild) {
    var cur = S.curOf(d);
    var type = S.depositType(d.typeId);
    var isOpen = d.status === "open";
    var ready = isOpen && S.matured(d);
    var left = Math.max(0, Math.ceil(
      (new Date(d.maturesTs).getTime() - Date.now()) / 86400000));
    var earns = isOpen ? S.interestOn(d, d.maturesTs) : S.money(d.interestPaid);

    return '<div class="task-row' + (isOpen ? "" : " paused") + '">' +
      '<span class="rank-badge">' + (ready ? "✅" : isOpen ? "⏳" : d.status === "broken" ? "✂️" : "\u{1F4B0}") + "</span>" +
      /* The product may be gone — a parent can delete one, and the suggested
         ladder replaces the lot. The deposit copied its own terms when it was
         opened, so name it from those rather than falling back to a word that
         says nothing. */
      '<div class="grow"><div class="title">' +
        (type ? typeName(type) : esc(termText(d.termDays))) + " · " +
        U.cash(d.amount, { plain: true, currency: cur }) + "</div>" +
        '<div class="sub">' + esc(t("bank.ratePct", { n: U.iso(d.ratePct) })) + " · " +
          esc(isOpen
            ? (ready ? t("bank.maturedNow") : leftText(left)) + " · " +
              t("bank.willEarn", { v: U.cash(earns, { plain: true, currency: cur }) })
            : t("bank.status." + d.status) +
              (earns ? " · " + t("bank.earned", { v: U.cash(earns, { plain: true, currency: cur }) }) : "")) +
        "</div></div>" +
      (isOpen
        ? (ready
            ? '<button class="btn small good" data-act="' + (asChild ? "c" : "p") + '.depClose" data-id="' + d.id + '">' +
              esc(t("bank.close")) + "</button>"
            : d.earlyExit
              ? '<button class="btn small ghost" data-act="' + (asChild ? "c" : "p") + '.depBreak" data-id="' + d.id + '">' +
                esc(t("bank.breakEarly")) + "</button>"
              : '<span class="tag" title="' + esc(t("bank.cannotBreak")) + '">\u{1F512}</span>')
        : "") +
      "</div>";
  }

  function moneyHistoryCard(c, canUndo) {
    var rows = S.moneyFor(c.id);
    return '<div class="section-title">' + esc(t("bank.history")) + "</div>" +
      '<div class="card flush">' + (rows.length
        ? '<ul class="list">' + rows.slice(0, 40).map(function (m) {
            return moneyRow(m, canUndo);
          }).join("") + "</ul>"
        : U.emptyState(t("bank.noHistory"), "\u{1F4B6}", t("empty.history"))) + "</div>";
  }

  function moneyRow(m, canUndo) {
    var undone = !!m.reversedBy;
    var kind = esc(t("kind." + m.kind));
    var src = S.source(m.source);
    /* Headline, in order of what actually says the most: the reason somebody
       typed, else where the money came from, else the kind of movement. */
    var head = m.note ? U.trHtml(m, "note")
             : src ? src.icon + " " + esc(t(src.key))
             : kind;
    var under = [];
    if (m.note && src) under.push(src.icon + " " + esc(t(src.key)));
    if (m.note || src) under.push(kind);
    under.push(esc(U.fmtDateTime(m.ts)));
    if (m.reverses) under.push(esc(t("undo.entry")));
    return '<li' + (undone ? ' class="paused"' : "") + '>' +
      '<div class="grow"><div class="title"' + (undone ? ' style="text-decoration:line-through"' : "") + ">" +
        head + "</div>" +
      '<div class="sub">' + under.join(" · ") + "</div></div>" +
      U.cash(m.amount, { sign: true, currency: S.curOf(m) }) +
      (canUndo && S.canReverse(m)
        ? '<button class="icon-btn" data-act="p.undo" data-id="' + m.id + '" title="' + esc(t("undo.do")) + '">↩️</button>'
        : "") +
      "</li>";
  }

  /* ================= approvals ================= */

  function approvalsTab() {
    var pending = S.pendingClaims();
    var html = '<div class="wrap"><h1>' + esc(t("appr.title")) + "</h1>";
    if (!pending.length) return html + U.emptyState(t("appr.empty"), "✅", t("empty.approvals")) + "</div>";

    html += '<div class="card flush"><ul class="list">' + pending.map(function (cl) {
      var c = S.child(cl.childId);
      if (!c) return "";
      /* A money request has no task or reward behind it — the amount and the
         reason a child typed are the whole thing. */
      if (cl.kind === "deposit" || cl.kind === "withdraw") return moneyClaimRow(cl, c);

      var isReward = cl.kind === "reward";
      var item = isReward ? S.reward(cl.rewardId) : S.task(cl.taskId);
      if (!item) return "";
      var cost = isReward ? S.num(item.cost) : 0;
      var afford = !isReward || S.balance(c.id) >= cost;

      var value = isReward
        ? U.points(-cost) + ' <small>' + esc(t("rewards.balanceAfter", { n: U.iso(S.balance(c.id) - cost) })) + "</small>"
        : (item.scope !== "group" ? U.points(item.onDoneSelf) : "") +
          (item.scope !== "personal" ? " <small>" + esc(t("tasks.groupPts")) + "</small> " + U.points(item.onDoneGroup) : "");

      return "<li>" + U.childAvatar(c, 40) +
        '<div class="grow"><div class="title">' + (isReward ? (item.icon || "🎁") + " " : "") + U.keyedTitleHtml(item) + "</div>" +
        '<div class="sub" title="' + esc(t("appr.claimedAt", { when: U.fmtDateTime(cl.ts) })) + '">' +
          U.name(c) + " · " +
          esc(isReward ? t("appr.wantsReward") : t("appr.claimedAt", { when: U.relTime(cl.ts) })) + "</div>" +
        '<div class="sub">' + value +
          (afford ? "" : ' <span class="tag bad">' + esc(t("rewards.short", { n: U.iso(cost - S.balance(c.id)) })) + "</span>") +
        "</div></div>" +
        '<div class="row tight nowrap">' +
          '<button class="btn small good" data-act="p.claim" data-id="' + cl.id + '" data-ok="1"' +
            (afford ? "" : " disabled") + ">✓</button>" +
          '<button class="btn small ghost" data-act="p.claim" data-id="' + cl.id + '" data-ok="0">✗</button>' +
        "</div></li>";
    }).join("") + "</ul></div>";

    return html + "</div>";
  }

  function moneyClaimRow(cl, c) {
    var out = cl.kind === "withdraw";
    var cur = S.curOf(cl);
    /* Against the account the child actually asked from: a euro request has
       nothing to do with what is in their shekel account. A child can still ask
       for more than is there, since money may have moved since — the button is
       refused rather than hidden, so a parent can see what was asked. */
    var covered = !out || S.cashBalance(c.id, cur) >= S.money(cl.amount);
    return "<li>" + U.childAvatar(c, 40) +
      '<div class="grow"><div class="title">' +
        esc(t(out ? "bank.pendingWithdraw" : "bank.pendingDeposit")) +
        (S.source(cl.source) ? " · " + S.source(cl.source).icon + " " + esc(t(S.source(cl.source).key)) : "") +
        (cl.note ? " · " + U.trHtml(cl, "note") : "") + "</div>" +
      '<div class="sub" title="' + esc(t("child.requestedAt", { when: U.fmtDateTime(cl.ts) })) + '">' +
        U.name(c) + " · " + esc(U.relTime(cl.ts)) + "</div>" +
      '<div class="sub">' + U.cash(out ? -cl.amount : cl.amount, { sign: true, currency: cur }) +
        (covered ? "" : ' <span class="tag bad">' + esc(t("bank.tooMuch")) + "</span>") + "</div></div>" +
      '<div class="row tight nowrap">' +
        '<button class="btn small good" data-act="p.claim" data-id="' + cl.id + '" data-ok="1"' +
          (covered ? "" : " disabled") + ">✓</button>" +
        '<button class="btn small ghost" data-act="p.claim" data-id="' + cl.id + '" data-ok="0">✗</button>' +
      "</div></li>";
  }

  /* ================= family settings ================= */

  function familyTab() {
    var s = S.get();
    var html = '<div class="wrap"><h1>' + esc(t("family.title")) + "</h1>";

    var mine = me();
    html += '<form data-act="p.settingsSave" class="card">' +
      U.nameField({ field: "sName", label: t("setup.familyName"),
                    names: familyNames(), lang: familyNameLang, action: "p.familyNameLang" }) +
      '<div class="field"><span class="field-label">' + esc(t("tr.yourLang")) + "</span>" +
        langChips(mine.lang || s.settings.lang, "p.myLang") +
        '<div class="hint">' + esc(t("tr.userLangHint")) + "</div></div>" +
      '<div class="field"><span class="field-label">' + esc(t("tr.defaultLang")) + "</span>" +
        langChips(s.settings.lang, "p.lang") + "</div>" +
      '<div class="field"><label for="sStart">' + esc(t("family.startPoints")) + "</label>" +
        '<input id="sStart" type="number" min="0" step="10" value="' + S.num(s.settings.startPoints) + '">' +
        '<div class="hint">' + esc(t("family.startPointsHint")) + "</div></div>" +
      '<div class="field"><label for="sPrize">' + esc(t("family.weeklyPrize")) + "</label>" +
        '<input id="sPrize" type="text" value="' + esc(s.settings.weeklyPrize || "") +
        '" placeholder="' + esc(t("movie.prizeDefault")) + '">' +
        '<div class="hint">' + esc(t("family.weeklyPrizeHint")) + "</div></div>" +
      '<div class="grid-2">' +
        '<div class="field"><label for="sWeek">' + esc(t("family.weekStart")) + "</label><select id=\"sWeek\">" +
          [0, 1, 2, 3, 4, 5, 6].map(function (d) {
            return '<option value="' + d + '"' + (d === S.num(s.settings.weekStart) ? " selected" : "") + ">" + esc(U.weekdayName(d)) + "</option>";
          }).join("") + "</select></div>" +
        '<div class="field"><label for="sMovie">' + esc(t("family.movieDay")) + "</label><select id=\"sMovie\">" +
          [0, 1, 2, 3, 4, 5, 6].map(function (d) {
            return '<option value="' + d + '"' + (d === S.num(s.settings.movieDay) ? " selected" : "") + ">" + esc(U.weekdayName(d)) + "</option>";
          }).join("") + '</select><div class="hint">' + esc(t("family.movieDayHint")) + "</div></div>" +
      "</div>" +
      '<button class="btn block" type="submit">' + esc(t("common.save")) + "</button></form>";

    html += '<div class="section-title">' + esc(t("family.parents")) +
      '<button class="btn small soft" data-act="p.parentNew">＋</button></div>' +
      '<div class="card flush"><ul class="list">' + s.parents.map(function (p) {
        return "<li>" + U.avatar(p.avatar, 40) +
          '<div class="grow"><div class="title">' + U.name(p) + "</div>" +
          '<div class="sub">' + esc(p.username) + " · " + esc(t("lang." + (p.lang || s.settings.lang))) + "</div></div>" +
          '<button class="icon-btn" data-act="p.parentEdit" data-id="' + p.id + '">✏️</button>' +
          (s.parents.length > 1 ? '<button class="icon-btn" data-act="p.parentDelete" data-id="' + p.id + '">🗑️</button>' : "") +
          "</li>";
      }).join("") + "</ul></div>";

    html += '<div class="section-title">' + esc(t("family.categories")) +
      '<button class="btn small soft" data-act="p.catNew">＋</button></div>' +
      '<div class="card flush"><ul class="list">' + s.categories.map(function (c) {
        return "<li><span class=\"rank-badge\">" + c.icon + "</span>" +
          '<div class="grow"><div class="title">' + U.categoryNameHtml(c) + "</div>" +
          '<div class="sub">' + s.tasks.filter(function (t2) { return t2.categoryId === c.id; }).length + " " + esc(t("tasks.title")) + "</div></div>" +
          '<button class="icon-btn" data-act="p.catEdit" data-id="' + c.id + '">✏️</button>' +
          '<button class="icon-btn" data-act="p.catDelete" data-id="' + c.id + '">🗑️</button></li>';
      }).join("") + "</ul></div>";

    html += syncCard();
    html += translationCard();

    html += '<div class="section-title">' + esc(t("family.data")) + "</div>" +
      '<div class="card stack">' +
        '<button class="btn ghost block" data-act="p.export">⬇️ ' + esc(t("family.export")) + "</button>" +
        '<button class="btn ghost block" data-act="p.import">⬆️ ' + esc(t("family.import")) + "</button>" +
        '<button class="btn danger block" data-act="p.reset">🗑️ ' + esc(t("family.reset")) + "</button>" +
        '<small>' + esc(t("family.aboutText")) + "</small>" +
      "</div>";

    return html + "</div>";
  }

  /* The family's own name, written per language, edited in settings. */
  var familyNameLang = "en", familyNamesDraft = null;
  function familyNames() {
    var set = S.get().settings;
    if (!familyNamesDraft) {
      familyNamesDraft = S.clone(set.familyNames || {});
      familyNameLang = global.I18N.lang;
      if (set.familyName && !Object.keys(familyNamesDraft).length) {
        familyNamesDraft[familyNameLang] = set.familyName;
      }
    }
    return familyNamesDraft;
  }

  function langChips(active, action, extra) {
    return '<div class="chips">' + global.I18N.langs.map(function (l) {
      return '<button type="button" class="chip' + (l.code === active ? " on" : "") +
        '" data-act="' + action + '" data-lang="' + l.code + '"' + (extra || "") + ">" +
        l.flag + " " + esc(l.label) + "</button>";
    }).join("") + "</div>";
  }

  function syncCard() {
    var st = global.Sync.status();
    var line = !st.connected ? t("sync.off") : t("sync." + (st.state === "off" ? "idle" : st.state));
    var dot = !st.connected ? "⚪"
            : st.state === "syncing" ? "🔄"
            : st.state === "offline" ? "🟠"
            : st.state === "error" ? "🔴" : "🟢";

    var body = '<small>' + esc(t("sync.hint")) + "</small>" +
      '<div class="kv"><span class="k">' + esc(t("common.status")) + "</span><span>" +
        dot + " " + esc(line) + "</span></div>";

    if (st.connected) {
      body += '<div class="kv"><span class="k">' + esc(t("sync.lastSync", { when: "" }).replace("{when}", "")) +
        "</span><span>" + esc(st.lastSyncAt ? U.fmtDateTime(st.lastSyncAt) : t("sync.never")) + "</span></div>" +
        '<div class="row gap mt">' +
          '<button class="btn grow" data-act="p.syncInvite">🔗 ' + esc(t("sync.invite")) + "</button>" +
          '<button class="btn ghost" data-act="p.syncNow">' + esc(t("sync.now")) + "</button>" +
        "</div>" +
        '<button class="btn ghost block mt" data-act="p.syncOff">' + esc(t("sync.disconnect")) + "</button>";
    } else {
      body += '<button class="btn block mt" data-act="p.syncOn">☁️ ' + esc(t("sync.connect")) + "</button>" +
        '<button class="btn ghost block mt" data-act="app.join">' + esc(t("sync.join")) + "</button>";
    }

    return '<div class="section-title">' + esc(t("sync.title")) + "</div>" +
      '<div class="card">' + body + '<div class="hint">' + esc(t("sync.privacy")) + "</div></div>";
  }

  function translationCard() {
    var s = S.get();
    var on = s.settings.translate !== false;
    var st = global.Translate.status();
    var line = !st.supported ? t("tr.unsupported")
             : st.state === "working" ? t("tr.working")
             : st.state === "needs-download" ? t("tr.prepare")
             : t("tr.ready");

    return '<div class="section-title">' + esc(t("tr.title")) + "</div>" +
      '<div class="card">' +
        '<small>' + esc(t("tr.hint")) + "</small>" +
        '<label class="row tight mt"><input type="checkbox" style="width:auto"' + (on ? " checked" : "") +
          ' data-act="p.trToggle"> ' + esc(t("tr.enabled")) + "</label>" +
        '<div class="kv"><span class="k">' + esc(t("common.status")) + "</span><span>" +
          (st.supported ? "" : "⚠️ ") + esc(line) + "</span></div>" +
        (st.supported && on
          ? '<button class="btn ghost block mt" data-act="p.trPrepare">⬇️ ' + esc(t("tr.prepare")) + "</button>"
          : "") +
        '<div class="hint">' + esc(t("tr.privacy")) + "</div>" +
      "</div>";
  }

  /* ================= actions ================= */

  U.on("p.goApprovals", function () { global.App.go({ tab: "approvals" }); });
  U.on("p.openChild", function (d) { global.App.go({ tab: "kids", params: { childId: d.id } }); });
  U.on("p.backKids", function () { global.App.go({ tab: "kids", params: {} }); });
  U.on("p.toggleInactive", function (d, node) { showInactive = node.checked; global.App.refresh(); });

  U.on("p.taskNew", function () { taskEditor(null); });
  U.on("p.taskEdit", function (d) { taskEditor(S.task(d.id)); });
  U.on("p.taskScope", function (d) { taskDraft.scope = d.scope; redrawTaskEditor(); });
  U.on("p.taskAssign", function (d) { taskDraft.assign = d.mode; redrawTaskEditor(); });
  U.on("p.taskChild", function (d) {
    captureTask();
    var ids = taskDraft.assignIds || [];
    var i = ids.indexOf(d.id);
    if (i === -1) ids.push(d.id); else ids.splice(i, 1);
    taskDraft.assignIds = ids;
    redrawTaskEditor();
  });
  U.on("p.taskSave", function () {
    captureTask();
    if (!taskDraft.title) { U.toast(t("common.required"), "bad"); return; }
    if (taskDraft.assign === "some" && !(taskDraft.assignIds || []).length) taskDraft.assign = "all";
    // A renamed seed task keeps the literal title instead of the translation key.
    if (taskDraft.titleKey && taskDraft.title !== t(taskDraft.titleKey)) taskDraft.titleKey = "";
    if (taskDraft.titleKey) taskDraft.title = "";
    S.saveTask(taskDraft);
    U.closeModal();
    U.toast(t("common.saved"), "good");
    global.App.refresh();
  });
  U.on("p.taskDelete", function (d) {
    U.confirmDialog(t("tasks.deleteConfirm"), function () {
      S.deleteTask(d.id);
      U.toast(t("common.saved"), "good");
      global.App.refresh();
    });
  });

  U.on("p.award", function (d) {
    var task = S.task(d.id);
    if (!task) return;
    var kids = S.get().children.filter(function (c) {
      return task.assign === "all" || (task.assignIds || []).indexOf(c.id) !== -1;
    });
    if (!kids.length) return U.toast(t("common.empty"), "bad");
    if (kids.length === 1) return applyAward(kids[0].id, task, d.outcome);
    awardCtx = { taskId: task.id, outcome: d.outcome };
    U.modal(t("tasks.pickChild"),
      '<p class="lead">' + esc(U.taskTitle(task)) + " · " +
        esc(d.outcome === "done" ? t("tasks.markDone") : t("tasks.markMissed")) + "</p>" +
      '<div class="kid-grid">' + kids.map(function (c) {
        return '<button class="kid-card" data-act="p.awardPick" data-id="' + c.id + '">' +

    box.select();
    box.setSelectionRange(0, box.value.length);
    var done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    if (!done && global.navigator.clipboard) {
      return global.navigator.clipboard.writeText(box.value)
        .then(function () { U.toast(t("family.copied"), "good"); })
        .catch(function () { U.toast(t("common.required"), "bad"); });

  /* Saving a file works differently depending on where the app is running. On
     an ordinary page a link does it; inside a viewer that mediates saves, the
     viewer has to be asked and is free to say no. Either way the backup is
     also on screen as text, so nothing is lost if a save is unavailable. */
  function saveBackupFile(filename, data) {
    var host = global.claude;
    if (host && typeof host.use === "function") {
      return host.use("downloads").then(function (downloads) {
        if (!downloads) return U.toast(t("family.exportHint"), "");
        return downloads.save({ filename: filename, data: data })
          .then(function () { U.toast(t("common.saved"), "good"); })
          .catch(function (err) {
            if (err && err.code === "declined") return;   // the viewer said no
            U.toast(t("family.exportHint"), "bad");
          });
      }).catch(function () { U.toast(t("family.exportHint"), "bad"); });
    }
    try {
      var blob = new Blob([data], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) {
      U.toast(t("family.exportHint"), "bad");
    }
  }

        '<small>' + esc(t("common.points")) + "</small>" +
        '<div class="row gap mt" style="justify-content:center">' +
          '<span class="tag" style="background:rgba(255,255,255,.22);color:#fff">' +
            esc(t("dash.earnedThisWeek", { n: U.signed(S.weekEarned(c.id)) })) + "</span>" +
        "</div>" +
      "</div>";

    html += goalCard(c);

    if (bd) {
      var label = bd.days === 0 ? t("dash.birthdayToday")
                : bd.days === 1 ? t("dash.tomorrow")
                : t("dash.daysLeft", { n: U.iso(bd.days) });
      html += '<div class="card"><div class="eyebrow">' + esc(t("dash.birthdays")) + "</div>" +
        '<div class="row between"><strong style="font-size:1.1rem">🎂 ' + esc(label) + "</strong>" +
        '<span class="tag brand">' + esc(t("dash.turns", { n: U.iso(bd.turning) })) + "</span></div></div>";
    }

    var winner = S.weekWinner();
    if (winner && winner.child.id === c.id && S.isMovieDay()) {
      var todays = S.movieNightToday();
      var prize = (S.get().settings.weeklyPrize || "").trim() || t("movie.prizeDefault");
      html += '<div class="card good"><div class="eyebrow">' + esc(prize) + "</div>" +
        "<p><strong>🍿 " + esc(todays ? todays.movie : prize) + "</strong></p></div>";
    }

    html += '<div class="section-title">' + esc(t("dash.activity")) + "</div>" +
      '<div class="card flush">' + (recent.length
        ? '<ul class="list">' + recent.map(function (l) {
            var task = S.task(l.taskId);
            var label2 = task ? U.taskTitleHtml(task)
              : l.kind === "start" ? esc(t("ledger.start"))
              : l.note ? U.trHtml(l, "note") : esc(t("ledger.manual"));
            return "<li><div class=\"grow\"><div class=\"title\">" + label2 + "</div>" +
              '<div class="sub">' + esc(U.fmtDateTime(l.ts)) + "</div></div>" +
              U.points(l.self) + "</li>";
          }).join("") + "</ul>"
        : U.emptyState(t("kids.noHistory"), "📈", t("empty.history"))) + "</div>";

    return html + "</div>";
  }

  /* ================= my tasks ================= */

  function tasksTab(c) {
    var s = S.get();
    var mine = S.tasksForChild(c.id);
    var html = '<div class="wrap"><h1>' + esc(t("tasks.mine")) + "</h1>";
    if (!mine.length) return html + U.emptyState(t("tasks.noneForChild"), "📋", t("empty.tasksChild")) + "</div>";

    s.categories.forEach(function (cat) {
      var list = mine.filter(function (task) { return task.categoryId === cat.id; });
      if (!list.length) return;
      html += '<div class="section-title">' + cat.icon + " " + U.categoryNameHtml(cat) + "</div>" +
        '<div class="card flush">' + list.map(function (task) { return taskRow(c, task); }).join("") + "</div>";
    });
    var orphans = mine.filter(function (task) { return !S.category(task.categoryId); });
    if (orphans.length) {
      html += '<div class="section-title">' + esc(t("cat.other")) + "</div>" +
        '<div class="card flush">' + orphans.map(function (task) { return taskRow(c, task); }).join("") + "</div>";
    }
    return html + "</div>";
  }

  function taskRow(c, task) {
    var claim = S.claimFor(c.id, task.id);
    var status = "";
    if (claim && claim.status === "pending") {
      status = '<span class="tag" title="' + esc(t("child.reportedAt", { when: U.fmtDateTime(claim.ts) })) +
        '">⏳ ' + esc(t("tasks.claimed")) + "</span>";
    }
    else if (claim && claim.status === "approved") status = '<span class="tag good">✓ ' + esc(t("tasks.doneToday")) + "</span>";
    else if (claim && claim.status === "rejected") status = '<span class="tag bad">✗ ' + esc(t("appr.rejected")) + "</span>";

    var reward = [];
    if (task.scope !== "group") reward.push(U.points(task.onDoneSelf));
    if (task.scope !== "personal") reward.push('<small>' + esc(t("nav.group")) + "</small> " + U.points(task.onDoneGroup));

    return '<div class="task-row" data-task-row="' + task.id + '">' +
      '<div class="grow"><div class="title">' + U.taskTitleHtml(task) + "</div>" +
        '<div class="sub">' + reward.join(" · ") +
        (S.num(task.onMissSelf) < 0 ? " · <small>" + esc(t("tasks.onMiss")) + " " + U.points(task.onMissSelf) + "</small>" : "") +
        "</div>" + (status ? '<div class="sub">' + status + "</div>" : "") + "</div>" +
      (claim && claim.status === "pending"
        ? '<button class="btn small ghost" disabled>⏳</button>'
        : '<button class="btn small good" data-act="c.claim" data-id="' + task.id + '">' + esc(t("tasks.iDidIt")) + "</button>") +
      "</div>";
  }

  /* ================= rewards ================= */

  function rewardsTab(c) {
    var balance = S.balance(c.id);
    var mine = S.rewardsFor(c.id).sort(function (a, b) { return S.num(a.cost) - S.num(b.cost); });
    var gp = S.goalProgress();

    var html = '<div class="wrap"><h1>' + esc(t("rewards.title")) + "</h1>" +
      '<div class="card hero kid center" style="--kid:' + S.childColor(c) + '">' +
        U.scoreEl("rewards:" + c.id, balance, { cls: "hero" }) +
        '<small>' + esc(t("common.points")) + "</small></div>";

    html += '<div class="section-title">' + esc(t("rewards.child")) + "</div>";
    html += mine.length
      ? '<div class="card flush">' + mine.map(function (r) { return rewardRow(c, r, balance); }).join("") + "</div>"
      : U.emptyState(t("rewards.noneForChild"), "🎁", t("empty.rewardsChild"));

    html += '<div class="section-title">' + esc(t("rewards.family")) + "</div>" +
      '<div class="card">' +
        '<div class="row between nowrap"><strong>' + esc(t("dash.groupBank")) + "</strong>" +
        U.scoreEl("bank", gp.total, { style: "font-size:1.2rem" }) + "</div>" +
        U.progressBar(gp.pct) +
        '<small>' + esc(gp.next
          ? t("rewards.nextGoal", { name: U.keyedTitle(gp.next) }) + " · " + t("rewards.short", { n: U.iso(gp.missing) })
          : t("rewards.unlockedCount", { n: U.iso(gp.unlocked.length) })) + "</small>" +
        (gp.unlocked.length
          ? '<ul class="list" style="margin-top:8px">' + gp.unlocked.map(function (r) {
              return "<li><span class=\"rank-badge\">" + (r.icon || "🎁") + "</span>" +
                '<div class="grow"><div class="title">' + U.keyedTitleHtml(r) + "</div></div>" +
                '<span class="tag good">' + esc(t("rewards.unlocked")) + "</span></li>";
            }).join("") + "</ul>"
          : "") +
      "</div>";

    return html + "</div>";
  }

  function rewardRow(c, r, balance) {
    var cost = S.num(r.cost);
    var claim = S.rewardClaimFor(c.id, r.id);
    var short = cost - balance;
    var status = "";
    if (claim && claim.status === "pending") {
      status = '<span class="tag" title="' + esc(t("child.requestedAt", { when: U.fmtDateTime(claim.ts) })) +
        '">⏳ ' + esc(t("rewards.requested")) + "</span>";
    }
    else if (claim && claim.status === "approved") status = '<span class="tag good">✓ ' + esc(t("common.done")) + "</span>";
    else if (claim && claim.status === "rejected") status = '<span class="tag bad">✗ ' + esc(t("appr.rejected")) + "</span>";

    return '<div class="task-row' + (short > 0 ? " paused" : "") + '">' +
      '<span class="rank-badge" style="font-size:1.1rem">' + (r.icon || "🎁") + "</span>" +
      '<div class="grow"><div class="title">' + U.keyedTitleHtml(r) + "</div>" +
        '<div class="sub">' + U.points(-cost) + " · " +
          esc(short > 0 ? t("rewards.short", { n: U.iso(short) }) : t("rewards.affordable")) + "</div>" +
        (status ? '<div class="sub">' + status + "</div>" : "") +
      "</div>" +
      (claim && claim.status === "pending"
        ? '<button class="btn small ghost" disabled>⏳</button>'
        : '<button class="btn small' + (short > 0 ? " ghost" : " good") + '" data-act="c.wantReward" data-id="' + r.id + '"' +
          (short > 0 ? " disabled" : "") + ">" + esc(t("rewards.want")) + "</button>") +
      "</div>";
  }

  /* ================= group ================= */

  function groupTab(c) {
    var s = S.get();
    var gp = S.goalProgress();
    var top = S.topScorer();

    var html = '<div class="wrap">' +
      '<div class="card hero">' +
        '<div class="eyebrow">' + esc(t("dash.groupBank")) + "</div>" +
        '<div class="row between nowrap">' + U.scoreEl("bankTop", gp.total) +
        '<div class="tag" style="background:rgba(255,255,255,.2);color:#fff">' + esc(t("dash.goal", { n: U.iso(gp.goal) })) + "</div></div>" +
        U.progressBar(gp.pct) +
        (gp.reached
          ? "<p>🎉 " + esc(t("rewards.unlockedCount", { n: U.iso(gp.unlocked.length) })) + "</p>" +
            (top ? "<small>" + esc(t("rewards.chooser", { name: top.child.id === c.id ? t("common.you") : S.nameOf(top.child) })) + "</small>" : "")
          : "<small>" + esc(gp.next
              ? t("rewards.nextGoal", { name: U.keyedTitle(gp.next) }) + " · " + t("rewards.short", { n: U.iso(gp.missing) })
              : t("rewards.short", { n: U.iso(gp.missing) })) + "</small>") +
      "</div>";

    html += '<div class="section-title">' + esc(t("movie.history")) + "</div>" +
      '<div class="card">' + (s.movieNights.length
        ? s.movieNights.slice(0, 8).map(function (m) {
            return '<div class="kv"><span class="k">' + esc(U.fmtDate(m.ts)) + "</span><span>🍿 " +
              esc(m.movie) + " · " + esc(nameOf(m.winnerId)) + "</span></div>";
          }).join("")
        : U.emptyState(t("movie.empty"), "🍿", t("empty.movie"))) + "</div>";

    html += '<div class="section-title">' + esc(t("rewards.history")) + "</div>" +
      '<div class="card">' + (s.redemptions.length
        ? s.redemptions.slice(0, 8).map(function (r) {
            return '<div class="kv"><span class="k">' + esc(U.fmtDate(r.ts)) + "</span><span>" +
              (r.icon || "🎁") + " " + U.keyedTitleHtml(r) +
              (r.note ? " · " + U.trHtml(r, "note") : "") +
              (r.childId ? " · " + esc(nameOf(r.childId)) : "") + "</span></div>";
          }).join("")
        : U.emptyState(t("common.empty"), "🎁", t("empty.redemptions"))) + "</div>";

    return html + "</div>";
  }

  function nameOf(id) { var c = S.child(id); return c ? c.name : "—"; }

  /* ================= notes ================= */

  function notesTab(c) {
    return '<div class="wrap"><h1>' + esc(t("nav.notes")) + "</h1>" +
      listCard(c, "notes", "📝 " + t("kids.notes"), t("kids.notesHint"), t("kids.addNote"), false, true) +
      listCard(c, "gifts", "🎁 " + t("kids.gifts"), t("kids.giftsHint"), t("kids.addGift"), false, false) +
      listCard(c, "outings", "🎡 " + t("kids.outings"), t("kids.outingsHint"), t("kids.addOuting"), true, false) +
      "</div>";
  }

  function listCard(child, field, title, hint, addLabel, ordered, multiline) {
    var items = child[field] || [];
    return '<div class="section-title">' + esc(title) + "</div>" +
      '<div class="card">' +
        '<small>' + esc(hint) + "</small>" +
        '<form data-act="c.itemAdd" data-field="' + field + '" class="row tight nowrap mt">' +
          (multiline
            ? '<textarea name="text" class="grow" placeholder="' + esc(addLabel) + '" style="min-height:64px"></textarea>'
            : '<input type="text" name="text" class="grow" placeholder="' + esc(addLabel) + '">') +
          '<button class="btn small" type="submit">＋</button>' +
        "</form>" +
        (items.length
          ? '<ul class="list" style="margin-top:10px">' + items.map(function (it, i) {
              return "<li>" + (ordered ? '<span class="rank-badge">' + (i + 1) + "</span>" : "") +
                '<div class="grow"><div class="title" style="white-space:pre-wrap">' + U.trHtml(it, "text") + "</div>" +
                '<div class="sub">' + esc(U.fmtDate(it.ts)) + "</div></div></li>";
            }).join("") + "</ul>"
          : U.emptyState(t("common.empty"), "✏️", t("empty.list"))) +
        '<div class="hint">' + esc(t("child.readOnly")) + "</div>" +
      "</div>";
  }

  /* ================= actions ================= */

  U.on("c.claim", function (d) {
    var c = me();
    S.claimTask(c.id, d.id);
    U.toast(t("tasks.claimSent"), "good");
    global.App.refresh();
    /* No confetti here: nothing has been earned yet, only reported. The row
       lights up instead, so the child can see which one they just sent. */
    U.flash('[data-task-row="' + d.id + '"]');
  });
  U.on("c.itemAdd", function (d, form) {
    var input = form.querySelector('[name="text"]');
    var text = input.value.trim();
    if (!text) return;
    S.addListItem(me().id, d.field, text);
    input.value = "";
    global.App.refresh();
  });
  U.on("c.wantReward", function (d) {
    var c = me();
    var r = S.reward(d.id);
    if (!r) return;
    if (S.balance(c.id) < S.num(r.cost)) {
      return U.toast(t("rewards.short", { n: U.iso(S.num(r.cost) - S.balance(c.id)) }), "bad");
    }
    S.claimReward(c.id, r.id);
    U.toast(t("tasks.claimSent"), "good");
    global.App.refresh();
  });


  /* ================= my money =================
     A child sees their own account and nobody else's. Every button here asks a
     parent rather than moving anything: the money is really in a parent's
     pocket, and the app only keeps the record straight. */

  function bankTab(c) {
    var P = global.ParentView;
    var waiting = S.moneyRequests(c.id).filter(function (r) { return r.status === "pending"; });

    var html = '<div class="wrap"><h1>' + esc(t("bank.mine")) + "</h1>" +
      P.accountCard(c, true) +
      '<p class="hint">' + esc(t("bank.requestHint")) + "</p>";

    if (waiting.length) {
      html += '<div class="card flush"><ul class="list">' + waiting.map(function (r) {
        return '<li><span class="rank-badge">⏳</span>' +
          '<div class="grow"><div class="title">' +
            esc(t(r.kind === "deposit" ? "bank.pendingDeposit" : "bank.pendingWithdraw")) +
            (r.note ? " · " + U.trHtml(r, "note") : "") + "</div>" +
          '<div class="sub" title="' + esc(t("child.requestedAt", { when: U.fmtDateTime(r.ts) })) + '">' +
            esc(U.fmtDateTime(r.ts)) + "</div></div>" +
          U.cash(r.kind === "deposit" ? r.amount : -r.amount,
                 { sign: true, currency: S.curOf(r) }) + "</li>";
      }).join("") + "</ul></div>";
    }

    /* Only offered when a parent has set a rate. */
    var canConvert = S.currencies.filter(function (cur) { return S.conversionRate(cur) > 0; });
    if (canConvert.length && S.balance(c.id) > 0) {
      html += '<div class="card"><div class="eyebrow">' + esc(t("bank.rateTitle")) + "</div>" +
        canConvert.map(function (cur) {
          return '<div class="row between nowrap" style="margin-bottom:6px"><span>' +
            esc(t("bank.convertWorth", {
              p: U.iso(S.conversionRate(cur)), v: U.cash(1, { plain: true, currency: cur })
            })) + "</span>" +
            '<button class="btn small soft" data-act="c.convert" data-cur="' + cur + '">' +
              esc(t("bank.convert")) + "</button></div>";
        }).join("") + "</div>";
    }

    html += savingNoteRow(c);
    html += P.depositsCard(c, true);
    html += P.moneyHistoryCard(c, false);
    return html + "</div>";
  }

  /* A single line rather than a card of its own: it lives in the child's
     settings now, where a parent edits it too, and this is just the child's own
     way in. */
  function savingNoteRow(c) {
    return '<div class="card"><form data-act="c.savingNote" class="row tight nowrap">' +
        '<span title="' + esc(t("bank.savingFor")) + '">\u{1F3AF}</span>' +
        '<input type="text" name="text" class="grow" value="' + esc(c.savingsNote || "") +
          '" placeholder="' + esc(t("bank.savingForShort")) + '">' +
        '<button class="btn small" type="submit">' + esc(t("common.save")) + "</button>" +
      "</form></div>";
  }

  /* The bar on the child's own page: one reward, chosen by a parent, filling
     up as the child earns. */
  function goalCard(c) {
    var g = S.childGoal(c.id);
    if (!g) return "";
    return '<div class="card"><div class="eyebrow">' + esc(t("goal.title")) + "</div>" +
      '<div class="row between nowrap"><strong>' + (g.reward.icon || "🎁") + " " +
        U.keyedTitleHtml(g.reward) + "</strong>" +
        '<span class="tag' + (g.reached ? " good" : "") + '">' +
          esc(g.reached ? t("goal.reached") : t("goal.toGo", { n: U.iso(g.missing) })) + "</span></div>" +
      '<div class="meter kid" style="--kid:' + S.childColor(c) + '">' +
        '<div class="meter-fill" style="width:' + g.pct + '%"></div></div>' +
      "<small>" + S.num(g.have) + " / " + g.cost + "</small></div>";
  }

  /* ---- actions ---- */

  U.on("c.bankAsk", function (d) {
    var c = me();
    var out = d.kind === "withdraw";
    var cur = d.cur || S.currency();
    U.modal(t(out ? "bank.requestWithdraw" : "bank.requestDeposit") + " · " + U.currencySymbol(cur) + " " + cur,
      '<p class="hint">' + esc(t("bank.requestHint")) + "</p>" +
      '<form data-act="c.bankAskSave" data-kind="' + d.kind + '" data-cur="' + cur + '">' +
        (out ? '<p class="lead">' + esc(t("bank.cash")) + " " +
               U.cash(S.cashBalance(c.id, cur), { plain: true, currency: cur }) + "</p>" : "") +
        '<div class="field"><label for="rAmount">' + esc(t("bank.amount")) + " (" + U.currencySymbol(cur) + ")</label>" +
          '<input id="rAmount" type="number" min="0.01" step="0.01" inputmode="decimal"></div>' +
        (out ? "" : global.ParentView.sourceChips("c.moveSrc", "")) +
        '<div class="field"><label for="rNote">' + esc(t("bank.reason")) + "</label>" +
          '<input id="rNote" type="text">' +
          '<div class="hint">' + esc(t("bank.reasonHint")) + "</div></div>" +
        '<button class="btn block" type="submit">' + esc(t("bank.request")) + "</button>" +
      "</form>",
      function (body) { var box = U.el("#rAmount", body); if (box) box.focus(); });
  });
  U.on("c.bankAskSave", function (d, form) {
    var amount = S.money(U.el("#rAmount", form).value);
    if (!amount || amount <= 0) return U.toast(t("bank.amount"), "bad");
    var cur = d.cur || S.currency();
    if (d.kind === "withdraw" && amount > S.cashBalance(me().id, cur)) return U.toast(t("bank.tooMuch"), "bad");
    S.requestMoney(me().id, d.kind, amount, U.el("#rNote", form).value.trim(), cur,
                   (U.el("#srcPick", form) || {}).value || "");
    U.closeModal();
    U.toast(t("bank.requestSent"), "good");
    global.App.refresh();
  });

  U.on("c.savingNote", function (d, form) {
    var text = form.querySelector('[name="text"]').value.trim();
    S.setSavingsNote(me().id, text);
    U.toast(t("common.saved"), "good");
    global.App.refresh();
  });

  /* A child may open a deposit on their own: the money is already theirs and
     already with the parent, so nothing changes hands — it only stops being
     spendable for a while. Breaking one early is theirs to decide too. */
  U.on("c.depNew", function (d) { global.ParentView.openDepositDialog(me().id, true); });
  U.on("c.depCur", function (d) { global.ParentView.openDepositDialog(me().id, true, d.code); });
  U.on("c.depSave", function (d, form) {
    var typeId = (form.querySelector('input[name="dtype"]:checked') || {}).value;
    var amount = S.money(U.el("#dAmount", form).value);
    if (!S.openDeposit(me().id, typeId, amount, null)) return U.toast(t("bank.tooMuch"), "bad");
    U.closeModal();
    U.toast(t("common.saved"), "good");
    global.App.refresh();
  });
  U.on("c.depClose", function (d) { global.ParentView.closeDepositNow(d.id, true); });
  U.on("c.depBreak", function (d) {
    U.confirmDialog(t("bank.breakWarn"), function () { global.ParentView.closeDepositNow(d.id, true); });
  });

  U.on("c.convert", function (d) {
    var c = me(), cur = d.cur || S.currency(), rate = S.conversionRate(cur);
    if (!rate) return U.toast(t("bank.convertOff"), "bad");
    U.modal(t("bank.convert") + " · " + U.currencySymbol(cur) + " " + cur,
      '<p class="lead">' + esc(t("bank.convertWorth", {
        p: U.iso(rate), v: U.cash(1, { plain: true, currency: cur })
      })) + "</p>" +
      '<form data-act="c.convertSave" data-cur="' + cur + '">' +
        '<div class="field"><label for="cvPoints">' + esc(t("bank.convertPoints")) + "</label>" +
          '<input id="cvPoints" type="number" min="1" step="1" max="' + S.balance(c.id) + '" value="' + rate + '">' +
          '<div class="hint" id="cvWorth"></div></div>' +
        '<button class="btn block" type="submit">' + esc(t("bank.convert")) + "</button>" +
      "</form>",
      function (body) {
        var box = U.el("#cvPoints", body), out = U.el("#cvWorth", body);
        var show = function () {
          out.textContent = t("bank.convertWorth", {
            p: U.iso(S.num(box.value)),
            v: U.cash(S.pointsToMoney(box.value, cur), { plain: true, currency: cur })
          });
        };
        box.addEventListener("input", show);
        show();
      });
  });
  U.on("c.convertSave", function (d, form) {
    var points = S.num(U.el("#cvPoints", form).value);
    var c = me();
    if (!S.convert(c.id, points, null, d.cur)) {
      return U.toast(t("rewards.short", { n: U.iso(points - S.balance(c.id)) }), "bad");
    }
    U.closeModal();
    U.toast(t("bank.converted"), "good");
    global.App.refresh();
    U.celebrate({ color: S.childColor(c) });
  });

  global.ChildView = { render: render };
})(window);

/* ==== js/app.js ==== */
/* Router, chrome and boot. */
(function (global) {
  "use strict";

  var t = function (k, p) { return global.I18N.t(k, p); };
  var esc = function (s) { return global.UI.esc(s); };
  var U = global.UI, S = global.Store;

  var view = { screen: "login", tab: "dashboard", params: {} };

  var PARENT_TABS = [
    { id: "dashboard", icon: "🏠", key: "nav.dashboard" },
    { id: "tasks", icon: "📋", key: "nav.tasks" },
    { id: "rewards", icon: "🎁", key: "nav.rewards" },
    { id: "kids", icon: "🧒", key: "nav.kids" },
    { id: "bank", icon: "\u{1F3E6}", key: "nav.bank" },
    { id: "approvals", icon: "✅", key: "nav.approvals" },
    { id: "family", icon: "⚙️", key: "nav.family" }
  ];
  var CHILD_TABS = [
    { id: "me", icon: "⭐", key: "nav.me" },
    { id: "tasks", icon: "📋", key: "nav.tasks" },
    { id: "rewards", icon: "🎁", key: "nav.rewards" },
    { id: "bank", icon: "\u{1F3E6}", key: "nav.bank" },
    { id: "group", icon: "👨‍👩‍👧", key: "nav.group" },
    { id: "notes", icon: "📝", key: "nav.notes" }
  ];

  function session() { return S.getSession() || {}; }

  function resolveScreen() {
    if (!S.exists()) return "setup";
    var s = session();
    if (s.kind === "parent" && S.parent(s.id)) return "parent";
    if (s.kind === "child" && S.child(s.id)) return "child";
    return "login";
  }

  function go(patch) {
    Object.keys(patch).forEach(function (k) { view[k] = patch[k]; });
    if (patch.tab && !patch.params) view.params = {};
    refresh();
    global.scrollTo(0, 0);
  }

  function refresh() {
    var screen = view.screen === "setup" && !S.exists() ? "setup" : resolveScreen();
    view.screen = screen;

    var tabs = screen === "parent" ? PARENT_TABS : screen === "child" ? CHILD_TABS : null;
    if (tabs && !tabs.some(function (x) { return x.id === view.tab; })) view.tab = tabs[0].id;

    U.el("#header").innerHTML = header(screen);
    U.el("#view").innerHTML =
      screen === "setup" ? global.Setup.render()
      : screen === "login" ? global.Setup.renderLogin()
      : screen === "parent" ? global.ParentView.render(view.tab, view.params)
      : global.ChildView.render(view.tab);
    U.el("#tabs").innerHTML = tabs ? tabBar(tabs) : "";
    document.body.classList.toggle("no-tabs", !tabs);
    /* Last, so it runs against the markup that just landed: any balance that
       moved since this reader last saw it counts up to its new value. */
    U.animateScores();
  }

  function header(screen) {
    var s = S.exists() ? S.get() : null;
    var who = "";
    if (screen === "parent") {
      var p = S.parent(session().id);
      if (p) who = U.avatar(p.avatar, 34);
    } else if (screen === "child") {
      var c = S.child(session().id);
      if (c) who = U.childAvatar(c, 34);
    }
    var title = (s && S.familyName()) || t("app.name");
    var sub = screen === "parent" ? S.nameOf(S.parent(session().id))
            : screen === "child" ? S.nameOf(S.child(session().id))
            : t("app.tagline");

    return '<div class="wrap">' +
      U.brandMark(38) +
      '<div class="bar-title"><strong>' + esc(title) + "</strong><small>" + esc(sub || "") + "</small></div>" +
      '<div class="bar-actions">' +
        (global.Sync.connected()
          ? '<span id="syncDot" class="sync-dot" title="' + esc(t("sync.title")) + '">' + syncDot() + "</span>"
          : "") +
        '<button class="icon-btn" data-act="app.lang" aria-label="' + esc(t("common.language")) + '">🌐</button>' +
        (screen === "parent" || screen === "child"
          ? who + '<button class="icon-btn" data-act="app.logout" aria-label="' + esc(t("common.logout")) + '">⏻</button>'
          : "") +
      "</div></div>";
  }

  function syncDot() {
    var st = global.Sync.status();
    if (!st.connected) return "";
    return st.state === "syncing" ? "🔄" : st.state === "offline" ? "🟠" : st.state === "error" ? "🔴" : "🟢";
  }

  function tabBar(tabs) {
    var pending = S.pendingClaims().length;
    return tabs.map(function (tab) {
      var badge = tab.id === "approvals" && pending ? '<span class="badge">' + pending + "</span>" : "";
      return '<button class="' + (view.tab === tab.id ? "on" : "") + '" data-act="app.tab" data-tab="' + tab.id + '">' +
        '<span class="ic">' + tab.icon + "</span>" + badge +
        "<span>" + esc(t(tab.key)) + "</span></button>";
    }).join("");
  }

  U.on("app.tab", function (d) { go({ tab: d.tab, params: {} }); });
  /* The sign-out button sits next to the language button in a small row at the
     top, which is easy to catch with a thumb. Nothing is lost by signing out,
     but on a child's phone it means finding a parent to type a PIN again, so it
     asks first. */
  U.on("app.logout", function () {
    var s = session();
    var user = s.kind === "parent" ? S.parent(s.id) : s.kind === "child" ? S.child(s.id) : null;
    var ask = user ? t("common.logoutConfirm", { name: S.nameOf(user) })
                   : t("common.logoutConfirmPlain");
    U.confirmDialog(ask, function () {
      U.forgetScores();
      S.clearSession();
      go({ screen: "login", tab: "dashboard", params: {} });
    }, { title: t("common.logout"), yes: t("common.logout"), cancel: t("common.stay") });
  });
  U.on("app.lang", function () {
    var signedIn = view.screen === "parent" || view.screen === "child";
    U.modal(signedIn ? t("tr.yourLang") : t("common.language"),
      '<div class="stack">' + global.I18N.langs.map(function (l) {
        return '<button class="btn ' + (l.code === global.I18N.lang ? "" : "ghost") +
          ' block" data-act="app.langPick" data-lang="' + l.code + '">' + l.flag + " " + esc(l.label) + "</button>";
      }).join("") + "</div>" +
      (signedIn ? '<p class="hint">' + esc(t("tr.userLangHint")) + "</p>" : ""));
  });
  /* Language is a personal setting: it changes what this account sees and
     leaves everyone else alone. Before anyone is signed in there is no account
     to attach it to, so it moves the family default instead. */
  U.on("app.langPick", function (d) {
    var s = session();
    if ((view.screen === "parent" || view.screen === "child") && s.id) {
      S.setUserLang(s.kind, s.id, d.lang);
    } else if (S.exists()) {
      S.get().settings.lang = d.lang;
      S.save();
    }
    global.I18N.setLang(d.lang);
    U.closeModal();
    refresh();
  });

  /* The language of whoever is signed in wins over the family default. */
  function applyUserLang() {
    if (!S.exists()) return;
    var s = session();
    var user = s.kind === "parent" ? S.parent(s.id) : s.kind === "child" ? S.child(s.id) : null;
    global.I18N.setLang((user && user.lang) || S.get().settings.lang || guessLang());
  }

  /* Joining a family from an invite link. Peek first so the person can see
     whose family they are about to join, since joining replaces this device. */
  function joinDialog(prefill) {
    U.modal(t("sync.join"),
      '<p class="hint">' + esc(t("sync.joinHint")) + "</p>" +
      '<textarea id="joinBox" style="min-height:80px;font-family:ui-monospace,monospace;font-size:.75rem">' +
        esc(prefill || "") + "</textarea>" +
      '<button class="btn block mt" data-act="app.joinGo">' + esc(t("sync.joinBtn")) + "</button>");
  }
  U.on("app.join", function () { joinDialog(""); });
  U.on("app.joinGo", function () {
    var box = U.el("#joinBox");
    if (!box) return;
    var text = box.value;
    U.toast(t("sync.syncing"));
    global.Sync.peek(text).then(function (res) {
      var set = (res && res.doc && res.doc.settings) || {};
      var name = (set.familyNames && set.familyNames[global.I18N.lang]) || set.familyName || t("app.name");
      U.confirmDialog(t("sync.joinReplace", { name: name }), function () {
        global.Sync.join(text).then(function () {
          applyUserLang();
          S.clearSession();
          go({ screen: "login", tab: "dashboard", params: {} });
          U.toast(t("sync.joined", { name: name }), "good");
        }).catch(function () { U.toast(t("sync.joinBad"), "bad"); });
      });
    }).catch(function () { U.toast(t("sync.joinBad"), "bad"); });
  });

  /* An invite link opened in a browser carries the family in its hash. */
  function invitationInUrl() {
    var hash = global.location.hash || "";
    if (hash.indexOf("#join=") !== 0) return null;
    var parsed = global.Sync.parseInvite(hash);
    if (!parsed) return null;
    try { global.history.replaceState(null, "", global.location.pathname + global.location.search); }
    catch (e) { global.location.hash = ""; }
    return hash;
  }

  function guessLang() {
    var nav = (global.navigator.language || "en").slice(0, 2).toLowerCase();
    return ["en", "nl", "he"].indexOf(nav) !== -1 ? nav : "en";
  }

  function boot() {
    S.load();
    if (S.exists()) S.settleMatured();
    var s = S.get();
    global.I18N.setLang(s && s.settings.lang ? s.settings.lang : guessLang());
    applyUserLang();
    view.screen = resolveScreen();
    view.tab = view.screen === "child" ? "me" : "dashboard";
    refresh();

    global.Sync.start();
    global.Sync.onChange(function () {
      var badge = U.el("#syncDot");
      if (badge) badge.textContent = syncDot();
      /* A deposit opened on another phone can come to term while this one is
         open; the ids are derived from the deposit, so whoever settles it
         first wins and the other simply merges the same row. */
      if (S.exists() && S.settleMatured()) refresh();
    });

    var invitation = invitationInUrl();
    if (invitation) joinDialog(invitation);
  }

  global.App = {
    go: go, refresh: refresh, session: session, boot: boot,
    applyUserLang: applyUserLang,
    get view() { return view; }
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(window);

</script>
</body>
</html>
