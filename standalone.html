<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6b4dfb">
<meta name="description" content="Family chores, points and rewards — English, Nederlands, עברית.">
<title>Family Points</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>
/* Family Points — one stylesheet, light + dark, LTR + RTL.
   Spacing uses logical properties so the Hebrew layout mirrors for free. */

:root {
  --bg: #f6f5fb;
  --surface: #ffffff;
  --surface-2: #f1effa;
  --line: #e3e0f0;
  --ink: #1d1b32;
  --ink-soft: #5c5878;
  --brand: #6b4dfb;
  --brand-ink: #ffffff;
  --brand-soft: #ece7ff;
  --accent: #ff8a3d;
  --good: #16a06a;
  --good-soft: #e2f6ee;
  --bad: #e0413f;
  --bad-soft: #fde8e7;
  --warn: #d99400;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 8px 28px rgba(35, 25, 80, .08);
  --shadow-sm: 0 2px 8px rgba(35, 25, 80, .06);
  --font: "Segoe UI", system-ui, -apple-system, "Noto Sans Hebrew", "Helvetica Neue", Arial, sans-serif;
}

/* Dark mode has three states to cover: the viewer's system preference, and an
   explicit light or dark choice stamped on the root element by whatever hosts
   the page. CSS cannot share one declaration block across a media query and a
   plain selector, so the tokens are written twice — keep them in step. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14131d;
    --surface: #1e1c2b;
    --surface-2: #262338;
    --line: #322e47;
    --ink: #f2f0fb;
    --ink-soft: #a49fc0;
    --brand: #8f76ff;
    --brand-soft: #2c2547;
    --good: #3fcf94;
    --good-soft: #16352a;
    --bad: #ff6b68;
    --bad-soft: #3a1e20;
    --warn: #f0b429;
    --shadow: 0 8px 28px rgba(0, 0, 0, .4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
    --bg: #14131d;
    --surface: #1e1c2b;
    --surface-2: #262338;
    --line: #322e47;
    --ink: #f2f0fb;
    --ink-soft: #a49fc0;
    --brand: #8f76ff;
    --brand-soft: #2c2547;
    --good: #3fcf94;
    --good-soft: #16352a;
    --bad: #ff6b68;
    --bad-soft: #3a1e20;
    --warn: #f0b429;
    --shadow: 0 8px 28px rgba(0, 0, 0, .4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
}
body { padding-bottom: 84px; min-height: 100vh; }
body.no-tabs { padding-bottom: 24px; }

h1, h2, h3 { margin: 0 0 .4em; line-height: 1.2; }
h1 { font-size: 1.45rem; letter-spacing: -.01em; }
h2 { font-size: 1.12rem; }
h3 { font-size: .98rem; }
p { line-height: 1.55; margin: .4em 0; }
small { color: var(--ink-soft); }
a { color: var(--brand); }

.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
.muted { color: var(--ink-soft); }
.lead { color: var(--ink-soft); line-height: 1.6; }
.center { text-align: center; }
.hide { display: none !important; }
.mt { margin-top: 16px; }
.mb { margin-bottom: 12px; }

/* ---------- app bar ---------- */
header.bar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
header.bar .wrap { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex: 0 0 auto;
  background: linear-gradient(140deg, var(--brand), var(--accent));
  display: grid; place-items: center; font-size: 1.15rem;
}
.bar-title { flex: 1; min-width: 0; }
.bar-title strong { display: block; font-size: .98rem; line-height: 1.2; }
.bar-title small { font-size: .74rem; }
.bar-actions { display: flex; gap: 6px; align-items: center; }
.sync-dot { font-size: .72rem; line-height: 1; }

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin: 12px 0;
  box-shadow: var(--shadow-sm);
}
.card.flush { padding: 0; overflow: hidden; }
.card.hero {
  background: linear-gradient(140deg, var(--brand), #a855f7 65%, var(--accent));
  color: #fff; border: none; box-shadow: var(--shadow);
}
.card.hero .muted, .card.hero small, .card.hero .lead { color: rgba(255, 255, 255, .82); }
.card.good { border-color: var(--good); background: var(--good-soft); }
.eyebrow {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .12em;
  font-weight: 700; color: var(--brand); margin-bottom: 6px;
}
.card.hero .eyebrow { color: rgba(255, 255, 255, .85); }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.row.nowrap { flex-wrap: nowrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: none; border-radius: 13px; padding: 12px 17px;
  font-family: var(--font); font-size: .95rem; font-weight: 700;
  background: var(--brand); color: var(--brand-ink); cursor: pointer;
  transition: transform .06s ease, filter .15s ease;
  min-height: 44px;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: grayscale(.4); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.soft { background: var(--brand-soft); color: var(--brand); }
.btn.good { background: var(--good); color: #fff; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.warn { background: var(--warn); color: #241c00; }
.btn.small { padding: 8px 12px; font-size: .84rem; min-height: 38px; border-radius: 11px; }
.btn.wide { flex: 1; }
.icon-btn {
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 1.05rem; cursor: pointer; padding: 8px; border-radius: 10px;
  min-width: 38px; min-height: 38px;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* ---------- forms ---------- */
.field { margin: 14px 0; }
.field > label, .field-label {
  display: block; font-weight: 700; font-size: .86rem; margin-bottom: 6px;
}
input[type=text], input[type=password], input[type=number], input[type=date],
input[type=tel], select, textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 12px; font-family: var(--font); font-size: 1rem;
  background: var(--surface); color: var(--ink);
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
textarea { min-height: 90px; resize: vertical; }
.hint { font-size: .78rem; color: var(--ink-soft); margin-top: 5px; line-height: 1.45; }
.error-msg {
  background: var(--bad-soft); color: var(--bad); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: .88rem; font-weight: 600; margin: 10px 0;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .grid-2:not(.keep) { grid-template-columns: 1fr; } }
.grid-2.keep { gap: 10px; }

/* segmented control */
.seg { display: flex; border: 1.5px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.seg button {
  flex: 1; border: none; background: var(--surface); color: var(--ink-soft);
  padding: 10px 8px; font-family: var(--font); font-weight: 700; font-size: .85rem; cursor: pointer;
}
.seg button.on { background: var(--brand); color: var(--brand-ink); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 7px 13px; font-size: .85rem; font-weight: 600;
  cursor: pointer; font-family: var(--font);
}
.chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface-2); color: var(--ink-soft);
  border-radius: 999px; padding: 3px 10px; font-size: .74rem; font-weight: 600;
}
.tag.brand { background: var(--brand-soft); color: var(--brand); }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- avatars ---------- */
.avatar {
  width: var(--avs, 44px); height: var(--avs, 44px);
  border-radius: 50%; display: inline-grid; place-items: center;
  background: color-mix(in srgb, var(--av) 26%, var(--surface));
  border: 2px solid var(--av);
  font-size: calc(var(--avs, 44px) * .52); flex: 0 0 auto; line-height: 1;
}
.avatar-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
  gap: 8px; margin: 8px 0;
}
/* There are a lot of characters to choose from, so the grid scrolls on its own
   rather than burying the Save button under it. */
.modal-body .avatar-grid {
  max-height: 232px; overflow-y: auto;
  padding: 6px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.avatar-pick {
  aspect-ratio: 1; border-radius: 50%; font-size: 1.5rem; cursor: pointer;
  border: 2px solid transparent;
  background: color-mix(in srgb, var(--av) 22%, var(--surface));
  display: grid; place-items: center;
}
.avatar-pick.sel { border-color: var(--av); box-shadow: 0 0 0 3px color-mix(in srgb, var(--av) 30%, transparent); }

/* ---------- points ---------- */
.pts { font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.pts.pos { color: var(--good); }
.pts.neg { color: var(--bad); }
.pts.zero { color: var(--ink-soft); }
.pts.big { font-size: 1.6rem; }
.score { font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list li {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.list li:last-child { border-bottom: none; }
.list li .grow { min-width: 0; }
.list .title { font-weight: 650; font-size: .95rem; }
.list .sub { font-size: .78rem; color: var(--ink-soft); margin-top: 2px; }
.tappable { cursor: pointer; }
.tappable:hover { background: var(--surface-2); }

.rank-badge {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-soft); font-size: .78rem; font-weight: 800; flex: 0 0 auto;
}
.rank-badge.gold { background: #ffd76e; color: #5a4300; }

.meter { height: 10px; border-radius: 999px; background: rgba(125, 120, 160, .25); overflow: hidden; margin: 8px 0; }
.meter-fill { height: 100%; border-radius: 999px; background: var(--brand); transition: width .4s ease; }
.card.hero .meter { background: rgba(0, 0, 0, .22); }
.card.hero .meter-fill { background: #fff; }

.tr-badge {
  border: none; background: var(--brand-soft); color: var(--brand);
  border-radius: 999px; padding: 1px 7px; font-size: .68rem; font-weight: 800;
  cursor: pointer; font-family: var(--font); vertical-align: middle;
  line-height: 1.5; display: inline-block;
}
.tr-badge.pending, .tr-badge.lang { background: var(--surface-2); color: var(--ink-soft); cursor: default; }
.tr-badge:hover { filter: brightness(1.05); }

.empty { text-align: center; padding: 26px 14px; color: var(--ink-soft); }
.empty-ic { font-size: 2rem; display: block; margin-bottom: 8px; }

.section-title {
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
  margin: 18px 0 6px; font-size: .82rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft);
}

/* ---------- tabs ---------- */
nav.tabs {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 40;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button {
  flex: 1; border: none; background: none; cursor: pointer;
  padding: 7px 2px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: var(--font); font-size: .66rem; font-weight: 650; color: var(--ink-soft);
}
nav.tabs button .ic { font-size: 1.2rem; line-height: 1; }
nav.tabs button.on { color: var(--brand); background: var(--brand-soft); }
nav.tabs .badge {
  position: absolute; transform: translate(14px, -6px);
  background: var(--bad); color: #fff; border-radius: 999px;
  font-size: .6rem; padding: 1px 5px; font-weight: 800;
}

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 60; display: none; }
#modal.open { display: block; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(20, 16, 40, .55); }
.modal-card {
  position: absolute; inset-inline: 0; bottom: 0; margin: 0 auto;
  max-width: 620px; max-height: 92vh; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow); animation: rise .18s ease-out;
}
@media (min-width: 640px) {
  .modal-card { position: relative; top: 6vh; border-radius: 22px; max-height: 88vh; }
}
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.modal-head h2 { margin: 0; font-size: 1.05rem; }
.modal-body { padding: 16px; }

/* ---------- toast ---------- */
.toast {
  position: fixed; inset-inline: 0; bottom: 96px; margin: 0 auto; width: fit-content;
  max-width: 90%; background: var(--ink); color: var(--bg);
  padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: .88rem;
  opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease;
  transform: translateY(8px); z-index: 70;
}
.toast.show { opacity: 1; transform: none; }
.toast.good { background: var(--good); color: #fff; }
.toast.bad { background: var(--bad); color: #fff; }

/* ---------- setup / login ---------- */
.steps { display: flex; gap: 6px; margin-bottom: 14px; }
.steps span { height: 4px; flex: 1; border-radius: 999px; background: var(--line); }
.steps span.on { background: var(--brand); }
.login-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.kid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.kid-card {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 14px 8px; text-align: center; cursor: pointer; font-family: var(--font);
  color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.kid-card:hover { border-color: var(--brand); }
.kid-card .nm { font-weight: 700; font-size: .9rem; }
.pin-input { letter-spacing: .5em; text-align: center; font-size: 1.4rem; font-weight: 800; }

.countdown {
  display: flex; align-items: center; gap: 12px; padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}
.countdown:last-child { border-bottom: none; }
.countdown .days { font-size: 1.35rem; font-weight: 800; color: var(--brand); min-width: 44px; text-align: center; }
.countdown.today .days { color: var(--accent); }

.task-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.task-row:last-child { border-bottom: none; }
.task-row.paused { opacity: .55; }
.pts-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: .78rem; }

.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: .88rem; }
.kv:last-child { border-bottom: none; }
.kv .k { color: var(--ink-soft); }

.footer-note { text-align: center; font-size: .74rem; color: var(--ink-soft); padding: 18px 8px 4px; line-height: 1.5; }

</style>
</head>
<body>

<header class="bar" id="header"></header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>

<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <div class="wrap"><div class="card">This app needs JavaScript to run.</div></div>
</noscript>

      ["seed.makeBed",     "cat_tidy",     "personal", 10,  -5,   0,  0, "daily"],
      ["seed.tidyRoom",    "cat_tidy",     "personal", 15, -10,   0,  0, "weekly"],
      ["seed.laundry",     "cat_tidy",     "personal",  0,  -5,   0,  0, "daily"],
      ["seed.brushTeeth",  "cat_tidy",     "personal",  0, -10,   0,  0, "daily"],
      ["seed.clearTable",  "cat_cleaning", "both",     15,  -5,  10,  0, "daily"],
      ["seed.helpCook",    "cat_cleaning", "both",     20,   0,  10,  0, "weekly"],
      ["seed.homework",    "cat_school",   "personal", 20, -20,   0,  0, "daily"],
      ["seed.read20",      "cat_school",   "personal", 15,   0,   0,  0, "daily"],
      ["seed.dutch15",     "cat_dutch",    "both",     25,   0,  10,  0, "daily"],
      ["seed.familyGame",  "cat_play",     "both",     10,   0,  10,  0, "weekly"]
    ];
    return t.map(function (r) {
      return {
        id: uid("task"),
        titleKey: r[0],
        title: "",
        categoryId: r[1],
        scope: r[2],
        onDoneSelf: r[3],
        onMissSelf: r[4],
        onDoneGroup: r[5],
        onMissGroup: r[6],
        repeat: r[7],
        assign: "all",
        assignIds: [],
        active: true
      };
    });
  }

  /* Starting points for the family to edit — a reward list is personal, so
     these are examples that can be renamed, repriced or deleted outright. */
  function defaultRewards() {
    var seeds = [
      ["reward.screen",    "🎮", "child",  150],
      ["reward.treat",     "🍦", "child",  100],
      ["reward.latenight", "🌙", "child",  200],
      ["reward.dinner",    "🍽️", "child",  250],
      ["reward.friend",    "🧑‍🤝‍🧑", "child",  400],
      ["reward.present",   "🎁", "child",  500],
      ["reward.pizza",     "🍕", "family", 400],
      ["reward.cinema",    "🎬", "family", 800],
      ["reward.outing",    "🎡", "family", 1000]
    ];
    return seeds.map(function (r) {
      return {
        id: uid("rw"), titleKey: r[0], title: "", icon: r[1],
        kind: r[2], cost: r[3], assign: "all", assignIds: [], active: true
      };
    });
  }

  function emptyState(lang) {
    return {
      version: 1,
      createdAt: now(),
      settings: {
        familyName: "",
        lang: lang || "en",
        startPoints: START_POINTS,
        groupGoal: 1000,
        weekStart: 0,
        movieDay: 6,
        translate: true
      },
      parents: [],
      children: [],
      categories: defaultCategories(),
      tasks: [],
      rewards: [],
      ledger: [],
      claims: [],
      movieNights: [],
      redemptions: [],
      deleted: {},
      savedAt: now()
    };
  }

  /* ---------------- persistence ---------------- */

  function load() {
    try {
      var raw = global.localStorage.getItem(KEY);
      state = raw ? JSON.parse(raw) : null;
    } catch (e) { state = null; }
    if (state) migrate(state);
    return state;
  }
  var saveHooks = [];
  function onSave(fn) { saveHooks.push(fn); }

  function save() {
    state.savedAt = now();
    try { global.localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { /* quota or private mode — the UI stays usable for this session */ }
    saveHooks.forEach(function (fn) { try { fn(state); } catch (e) {} });
    return state;
  }

  /* Deleting has to be remembered, not just done: another device still holds
     the thing, and without a record of the deletion a merge would bring it
     back. The id is enough — what it pointed at is already gone. */
  function forget(id) {
    if (!id) return;
    if (!state.deleted) state.deleted = {};
    state.deleted[id] = now();
  }
  function migrate(s) {
    if (!s.claims) s.claims = [];
    if (!s.movieNights) s.movieNights = [];
    if (!s.rewards) s.rewards = defaultRewards();
    if (!s.redemptions) s.redemptions = [];
    if (!s.deleted) s.deleted = {};
    if (!s.savedAt) s.savedAt = s.createdAt || now();
    s.claims.forEach(function (c) { if (!c.kind) c.kind = "task"; });
    /* Family outings used to be the only reward, driven by one goal number.
       They become entries in the rewards catalogue so they can be edited. */
    if (s.outings) {
      s.outings.forEach(function (o) {
        s.redemptions.push({
          id: o.id, ts: o.ts, date: o.date, kind: "family", rewardId: null,
          title: o.label, cost: o.spent, childId: o.chooserId, by: o.by, note: o.note || "",
          srcLang: o.srcLang, tr: o.tr
        });
      });
      delete s.outings;
    }
    if (!s.categories || !s.categories.length) s.categories = defaultCategories();
    if (s.settings && s.settings.movieDay === undefined) s.settings.movieDay = 6;
    if (s.settings && s.settings.weekStart === undefined) s.settings.weekStart = 0;
    if (s.settings && s.settings.translate === undefined) s.settings.translate = true;
    var fallback = (s.settings && s.settings.lang) || "en";
    (s.parents || []).concat(s.children || []).forEach(function (u) {
      if (!u.lang) u.lang = fallback;
    });
  }

  function setUserLang(kind, id, lang) {
    var user = kind === "parent" ? parent(id) : child(id);
    if (!user) return null;
    user.lang = lang;
    save();
    return user;
  }
  function exists() { return !!state; }
  function get() { return state; }
  function replace(next) {
    state = next; migrate(state); save(); return state;
  }
  function wipe() {
    try {
      global.localStorage.removeItem(KEY);
      global.localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
    state = null;
  }

  /* ---------------- setup ---------------- */

  function createFamily(opts) {
    state = emptyState(opts.lang);
    state.settings.familyName = opts.familyName || "";
    state.settings.familyNames = opts.familyNames || {};
    if (opts.startPoints) state.settings.startPoints = opts.startPoints;

    var parent = addParentRecord(opts.parent.name, opts.parent.username, opts.parent.password,
                                 opts.parent.avatar, state.settings.lang);
    if (opts.parent.names) parent.names = opts.parent.names;
    (opts.children || []).forEach(function (c) { addChild(c, parent.id); });
    if (opts.seedTasks !== false) {
      state.tasks = defaultTasks();
      state.rewards = defaultRewards();
    }
    save();
    return state;
  }

  function addParentRecord(name, username, password, avatar, lang) {
    var p = {
      id: uid("par"),
      name: name,
      username: String(username || "").trim().toLowerCase(),
      avatar: avatar || "p1",
      names: {},
      lang: lang || authorLang(),
      secret: makeSecret(password),
      createdAt: now()
    };
    state.parents.push(p);
    return p;
  }
  function addParent(name, username, password, avatar) {
    if (findParent(username)) return null;
    var p = addParentRecord(name, username, password, avatar);
    save();
    return p;
  }
  function findParent(username) {
    var u = String(username || "").trim().toLowerCase();
    return state.parents.filter(function (p) { return p.username === u; })[0] || null;
  }
  function removeParent(id) {
    if (state.parents.length <= 1) return false;
    forget(id);
    state.parents = state.parents.filter(function (p) { return p.id !== id; });
    save();
    return true;
  }
  /* Editing a parent. A username has to stay unique, so a clash is reported
     rather than quietly overwriting whoever holds it. */
  function updateParent(id, patch) {
    var p = parent(id);
    if (!p) return null;
    if (patch.username !== undefined) {
      var wanted = String(patch.username || "").trim().toLowerCase();
      if (!wanted) return null;
      var holder = findParent(wanted);
      if (holder && holder.id !== id) return false;
      patch.username = wanted;
    }
    Object.keys(patch).forEach(function (k) { p[k] = patch[k]; });
    save();
    return p;
  }

  function setParentPassword(id, password) {
    var p = byId(state.parents, id);
    if (!p) return false;
    p.secret = makeSecret(password);
    save();
    return true;
  }

  function addChild(data, byParentId) {
    var c = {
      id: uid("kid"),
      name: data.name,
      avatar: data.avatar || "k1",
      names: data.names || {},
      lang: data.lang || state.settings.lang,
      birthday: data.birthday || "",
      pin: data.pin ? makeSecret(String(data.pin)) : null,
      notes: [],
      gifts: [],
      outings: [],
      createdAt: now()
    };
    state.children.push(c);
    state.ledger.push({
      id: uid("led"), ts: now(), childId: c.id, kind: "start",
      self: state.settings.startPoints, group: 0, note: "", by: byParentId || null
    });
    save();
    return c;
  }
  function removeChild(id) {
    forget(id);
    (child(id) || { notes: [] }).notes.concat((child(id) || {}).gifts || [], (child(id) || {}).outings || [])
      .forEach(function (i) { forget(i.id); });
    state.ledger.forEach(function (l) { if (l.childId === id) forget(l.id); });
    state.children = state.children.filter(function (c) { return c.id !== id; });
    state.ledger = state.ledger.filter(function (l) { return l.childId !== id; });
    state.claims = state.claims.filter(function (c) { return c.childId !== id; });
    save();
  }
  function updateChild(id, patch) {
    var c = byId(state.children, id);
    if (!c) return null;
    Object.keys(patch).forEach(function (k) { c[k] = patch[k]; });
    save();
    return c;
  }
  function setChildPin(id, pin) {
    var c = byId(state.children, id);
    if (!c) return;
    c.pin = pin ? makeSecret(String(pin)) : null;
    save();
  }

  /* The language a piece of text was written in, so a reader in another
     language can be shown a translation of it. */
  function authorLang() {
    return global.I18N ? global.I18N.lang : "en";
  }
  function stamp(owner, field) {
    owner.srcLang = authorLang();
    if (global.Translate && global.Translate.detect) {
      global.Translate.detect(owner[field], owner.srcLang, function (lang) {
        if (lang && lang !== owner.srcLang) { owner.srcLang = lang; save(); }
      });
    }
    return owner;
  }

  /* Names of people and of the family are never translated — a person's name
     is not a phrase. What a family can do instead is write the name once per
     language, so "משפחת כהן" and "Familie Cohen" are the same family seen from
     two languages. `name` is the fallback for a language nobody filled in. */
  function pickName(names, fallback) {
    var lang = global.I18N ? global.I18N.lang : "en";
    var home = state && state.settings ? state.settings.lang : "en";
    if (!names) return fallback || "";
    // the reader's language, then the family's own, then whatever was written
    if (names[lang]) return names[lang];
    if (names[home]) return names[home];
    if (fallback) return fallback;
    var written = Object.keys(names).map(function (k) { return names[k]; }).filter(Boolean);
    return written[0] || "";
  }
  function nameOf(entity) {
    if (!entity) return "";
    return pickName(entity.names, entity.name);
  }
  function setName(entity, lang, value) {
    if (!entity) return entity;
    value = String(value || "").trim();
    if (!entity.names) entity.names = {};
    if (value) entity.names[lang] = value; else delete entity.names[lang];
    if (!entity.name) entity.name = value;
    return entity;
  }
  function familyName() {
    var set = state && state.settings;
    return set ? pickName(set.familyNames, set.familyName) : "";
  }

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function child(id) { return byId(state.children, id); }
  function parent(id) { return byId(state.parents, id); }
  function task(id) { return byId(state.tasks, id); }
  function category(id) { return byId(state.categories, id); }

  /* ---------------- tasks ---------------- */

  function saveTask(data) {
    // A task named by a parent is translated for anyone reading in another
    // language; the built-in ones already have a key for every language.
    if (data.title && !data.titleKey) {
      var previous = data.id ? byId(state.tasks, data.id) : null;
      if (!previous || previous.title !== data.title) {
        delete data.tr;
        stamp(data, "title");
      }
    } else {
      delete data.srcLang;
      delete data.tr;
    }
    if (data.id) {
      var t = byId(state.tasks, data.id);
      if (t) {
        delete t.tr;
        Object.keys(data).forEach(function (k) { t[k] = data[k]; });
      }
    } else {
      data.id = uid("task");
      state.tasks.push(data);
    }
    save();
    return data;
  }

  function saveCategory(id, name, icon) {
    var cat = byId(state.categories, id);
    if (!cat) return null;
    if (cat.key) {                       // a built-in name becomes a custom one
      delete cat.key;
      cat.name = name;
      stamp(cat, "name");
    } else if (cat.name !== name) {
      cat.name = name;
      delete cat.tr;
      stamp(cat, "name");
    }
    cat.icon = icon;
    save();
    return cat;
  }

  function addCategory(name, icon) {
    var cat = stamp({ id: uid("cat"), name: name, icon: icon }, "name");
    state.categories.push(cat);
    save();
    return cat;
  }
  function deleteTask(id) {
    forget(id);
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    state.claims = state.claims.filter(function (c) { return c.taskId !== id; });
    save();
  }
  function tasksForChild(childId, includeInactive) {
    return state.tasks.filter(function (t) {
      if (!t.active && !includeInactive) return false;
      if (t.assign === "all") return true;
      return (t.assignIds || []).indexOf(childId) !== -1;
    });
  }

  function reward(id) { return byId(state.rewards, id); }

  function saveReward(data) {
    if (data.title && !data.titleKey) {
      var previous = data.id ? byId(state.rewards, data.id) : null;
      if (!previous || previous.title !== data.title) {
        delete data.tr;
        stamp(data, "title");
      }
    } else {
      delete data.srcLang;
      delete data.tr;
    }
    data.cost = Math.max(0, num(data.cost));
    if (data.id) {
      var r = byId(state.rewards, data.id);
      if (r) {
        delete r.tr;
        Object.keys(data).forEach(function (k) { r[k] = data[k]; });
      }
    } else {
      data.id = uid("rw");
      state.rewards.push(data);
    }
    save();
    return data;
  }
  function deleteReward(id) {
    forget(id);
    state.rewards = state.rewards.filter(function (r) { return r.id !== id; });
    state.claims = state.claims.filter(function (c) { return c.rewardId !== id; });
    save();
  }
  function rewardsFor(childId, includeInactive) {
    return state.rewards.filter(function (r) {
      if (r.kind !== "child") return false;
      if (!r.active && !includeInactive) return false;
      if (r.assign === "all") return true;
      return (r.assignIds || []).indexOf(childId) !== -1;
    });
  }
  function familyRewards(includeInactive) {
    return state.rewards.filter(function (r) {
      return r.kind === "family" && (r.active || includeInactive);
    }).sort(function (a, b) { return num(a.cost) - num(b.cost); });
  }

  /* ---------------- points ---------------- */

  function record(entry) {
    entry.id = uid("led");
    entry.ts = entry.ts || now();
    state.ledger.push(entry);
    save();
    return entry;
  }

  function awardTask(childId, taskId, outcome, byParentId) {
    var t = task(taskId);
    if (!t) return null;
    var done = outcome === "done";
    var self = 0, group = 0;
    if (t.scope === "personal" || t.scope === "both") self = done ? num(t.onDoneSelf) : num(t.onMissSelf);
    if (t.scope === "group" || t.scope === "both") group = done ? num(t.onDoneGroup) : num(t.onMissGroup);
    return record({
      childId: childId, taskId: taskId, kind: done ? "award" : "penalty",
      self: self, group: group, note: "", by: byParentId || null
    });
  }

  function adjust(childId, self, group, note, byParentId) {
    var entry = {
      childId: childId, taskId: null, kind: "manual",
      self: num(self), group: num(group), note: note || "", by: byParentId || null
    };
    if (entry.note) stamp(entry, "note");
    return record(entry);
  }

  function num(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }

  function balance(childId) {
    return state.ledger.reduce(function (sum, l) {
      return l.childId === childId ? sum + num(l.self) : sum;
    }, 0);
  }
  function groupTotal() {
    return state.ledger.reduce(function (sum, l) { return sum + num(l.group); }, 0);
  }
  function earnedBetween(childId, fromTs, toTs) {
    return state.ledger.reduce(function (sum, l) {
      if (l.childId !== childId || l.kind === "start") return sum;
      if (l.ts < fromTs || l.ts > toTs) return sum;
      return sum + num(l.self);
    }, 0);
  }

  /* ---------------- weeks, birthdays ---------------- */

  function weekRange(ref) {
    var d = ref ? new Date(ref) : new Date();
    var start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = (start.getDay() - state.settings.weekStart + 7) % 7;
    start.setDate(start.getDate() - diff);
    var end = new Date(start);
    end.setDate(end.getDate() + 7);
    return { start: start, end: end, startTs: start.toISOString(), endTs: end.toISOString() };
  }

  function weekEarned(childId, ref) {
    var w = weekRange(ref);
    return earnedBetween(childId, w.startTs, w.endTs);
  }

  /* Winner of the week: most points earned since the week started.
     Ties break on the overall balance, then on name, so the result is stable. */
  function weekWinner(ref) {
    var rows = state.children.map(function (c) {
      return { child: c, earned: weekEarned(c.id, ref), balance: balance(c.id) };
    }).filter(function (r) { return r.earned > 0; });
    if (!rows.length) return null;
    rows.sort(cmpRows);
    return rows[0];
  }

  function standings() {
    return state.children.map(function (c) {
      return { child: c, balance: balance(c.id), earned: weekEarned(c.id) };
    }).sort(cmpRows);
  }

  function cmpRows(a, b) {
    if (b.earned !== a.earned) return b.earned - a.earned;
    if (b.balance !== a.balance) return b.balance - a.balance;
    return a.child.name.localeCompare(b.child.name);
  }

  function topScorer() {
    var rows = state.children.map(function (c) {
      return { child: c, balance: balance(c.id), earned: weekEarned(c.id) };
    });
    if (!rows.length) return null;
    rows.sort(function (a, b) {
      if (b.balance !== a.balance) return b.balance - a.balance;
      return a.child.name.localeCompare(b.child.name);
    });
    return rows[0];
  }

  function birthdayInfo(c) {
    if (!c.birthday) return null;
    var parts = String(c.birthday).split("-");
    if (parts.length < 3) return null;
    var by = +parts[0], bm = +parts[1] - 1, bd = +parts[2];
    var today = new Date();
    today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var next = new Date(today.getFullYear(), bm, bd);
    if (next < today) next = new Date(today.getFullYear() + 1, bm, bd);
    var days = Math.round((next - today) / 86400000);
    return { date: next, days: days, turning: next.getFullYear() - by, age: today.getFullYear() - by - (next.getFullYear() > today.getFullYear() ? 0 : 1) };
  }

  /* ---------------- claims ---------------- */

  function claimTask(childId, taskId) {
    var open = state.claims.filter(function (c) {
      return c.childId === childId && c.taskId === taskId && c.status === "pending";
    })[0];
    if (open) return open;
    var claim = {
      id: uid("clm"), kind: "task", childId: childId, taskId: taskId, rewardId: null,
      ts: now(), dayKey: dayKey(), status: "pending", decidedBy: null, decidedTs: null
    };
    state.claims.push(claim);
    save();
    return claim;
  }

  function claimReward(childId, rewardId) {
    var open = state.claims.filter(function (c) {
      return c.childId === childId && c.rewardId === rewardId && c.status === "pending";
    })[0];
    if (open) return open;
    var claim = {
      id: uid("clm"), kind: "reward", childId: childId, taskId: null, rewardId: rewardId,
      ts: now(), dayKey: dayKey(), status: "pending", decidedBy: null, decidedTs: null
    };
    state.claims.push(claim);
    save();
    return claim;
  }
  function rewardClaimFor(childId, rewardId) {
    var mine = state.claims.filter(function (c) {
      return c.childId === childId && c.rewardId === rewardId &&
             (c.status === "pending" || c.dayKey === dayKey());
    });
    return mine[mine.length - 1] || null;
  }
  function pendingClaims() {
    return state.claims.filter(function (c) { return c.status === "pending"; })
      .sort(function (a, b) { return a.ts < b.ts ? -1 : 1; });
  }
  function decideClaim(claimId, approve, byParentId) {
    var c = byId(state.claims, claimId);
    if (!c || c.status !== "pending") return null;
    if (approve && c.kind === "reward") {
      // Points may have been spent since the child asked; do not go negative.
      if (!redeem(c.rewardId, c.childId, "", byParentId)) return null;
    }
    c.status = approve ? "approved" : "rejected";
    c.decidedBy = byParentId || null;
    c.decidedTs = now();
    if (approve && c.kind !== "reward") awardTask(c.childId, c.taskId, "done", byParentId);
    save();
    return c;
  }
  function claimFor(childId, taskId) {
    var today = dayKey();
    var mine = state.claims.filter(function (c) {
      return c.childId === childId && c.taskId === taskId &&
             (c.status === "pending" || c.dayKey === today);
    });
    return mine[mine.length - 1] || null;
  }

  /* ---------------- rewards ---------------- */

  /* The group bank aims at the cheapest family reward it cannot afford yet, so
     the goal moves with the catalogue instead of being one fixed number. */
  function goalProgress() {
    var total = groupTotal();
    var list = familyRewards();
    var unlocked = list.filter(function (r) { return num(r.cost) <= total; });
    var next = list.filter(function (r) { return num(r.cost) > total; })[0] || null;
    var goal = next ? num(next.cost)
             : list.length ? num(list[list.length - 1].cost)
             : num(state.settings.groupGoal) || 1000;
    return {
      total: total, goal: goal, next: next, unlocked: unlocked,
      reached: unlocked.length > 0,
      missing: Math.max(0, goal - total),
      pct: goal > 0 ? Math.max(0, Math.min(100, Math.round(total / goal * 100))) : 100
    };
  }

  /* Spending points on a reward. Family rewards come out of the group bank,
     child rewards out of that child's own balance; neither may go negative. */
  function redeem(rewardId, childId, note, byParentId) {
    var r = reward(rewardId);
    if (!r) return null;
    var cost = num(r.cost);
    var family = r.kind === "family";
    if (family && groupTotal() < cost) return null;

      if (p.password.length < 4) return t("setup.errPassShort");
      if (p.password !== p.password2) return t("setup.errPass2");
    } else if (step === 3) {
      if (!draft.children.length) return t("setup.errChildren");
    }
    return "";
  }

  /* Changing the language here also changes which spelling of the family name
     you are writing — the name in the box follows the language, and the one you
     were writing is kept. */
  U.on("setup.lang", function (d) {
    capture();                       // keep what was typed for the old language
    draft.lang = d.lang;
    draft.parent.nameLang = d.lang;  // every name field follows the language
    draft.childForm.nameLang = d.lang;
    global.I18N.setLang(d.lang);
    global.App.refresh();
  });
  U.on("setup.childNameLang", function (d, node) {
    capture();
    draft.childForm.nameLang = U.switchNameLang(node.dataset.field, draft.childForm.names,
                                                draft.childForm.nameLang, d.lang);
  });
  U.on("setup.parentAvatar", function (d) {
    capture(); draft.parent.avatar = d.avatar; global.App.refresh();
  });
  U.on("setup.parentNameLang", function (d, node) {
    capture();
    draft.parent.nameLang = U.switchNameLang(node.dataset.field, draft.parent.names,
                                             draft.parent.nameLang, d.lang);
  });
  U.on("setup.childAvatar", function (d) {
    capture(); draft.childForm.avatar = d.avatar; global.App.refresh();
  });
  U.on("setup.addChild", function () {
    capture();
    var f = draft.childForm;
    var name = f.names[f.nameLang] || firstName(f.names);
    if (!name) { error = t("setup.errChildName"); return global.App.refresh(); }
    if (f.pin && f.pin.length !== 4) { error = t("setup.errPin"); return global.App.refresh(); }
    draft.children.push({ name: name, names: JSON.parse(JSON.stringify(f.names)),
                          avatar: f.avatar, birthday: f.birthday, pin: f.pin, lang: draft.lang });
    var used = draft.children.map(function (c) { return c.avatar; });
    var free = global.AVATARS.kids.filter(function (a) { return used.indexOf(a.id) === -1; })[0];
    draft.childForm = { names: {}, nameLang: draft.lang, avatar: free ? free.id : "k1", birthday: "", pin: "" };
    error = "";
    global.App.refresh();
  });
  U.on("setup.removeChild", function (d) {
    capture();
    draft.children.splice(+d.i, 1);
    global.App.refresh();
  });
  U.on("setup.next", function () {
    capture();
    error = validateStep();
    if (!error) step = Math.min(STEPS, step + 1);
    global.App.refresh();
  });
  U.on("setup.back", function () {
    capture(); error = ""; step = Math.max(1, step - 1); global.App.refresh();
  });
  U.on("setup.create", function () {
    global.Store.createFamily({
      lang: draft.lang,
      familyName: draft.familyNames[draft.lang] || firstName(draft.familyNames),
      familyNames: draft.familyNames,
      startPoints: draft.startPoints,
      parent: {
        name: draft.parent.names[draft.lang] || firstName(draft.parent.names),
        names: draft.parent.names,
        username: draft.parent.username,
        password: draft.parent.password,
        avatar: draft.parent.avatar
      },
      children: draft.children
    });
    var parent = global.Store.get().parents[0];
    global.Store.setSession("parent", parent.id);
    reset();
    global.App.go({ screen: "parent", tab: "dashboard" });
    U.toast(t("auth.welcomeBack", { name: global.Store.nameOf(parent) }), "good");
  });

  /* ---------------- sign in ---------------- */

  var loginTab = "parent";
  var loginError = "";
  var pinChildId = null;

  function renderLogin() {
    var s = global.Store.get();
    return '<div class="wrap">' +
      '<div class="card center" style="padding-block:26px">' +
        '<div class="brand-mark" style="margin:0 auto 10px;width:52px;height:52px;font-size:1.5rem">🏆</div>' +
        "<h1>" + U.familyName() + "</h1>" +
        '<p class="lead">' + esc(t("app.tagline")) + "</p>" +
      "</div>" +
      '<div class="card">' +
        '<div class="seg mb">' +
          '<button class="' + (loginTab === "parent" ? "on" : "") + '" data-act="login.tab" data-tab="parent">' + esc(t("auth.parentTab")) + "</button>" +
          '<button class="' + (loginTab === "child" ? "on" : "") + '" data-act="login.tab" data-tab="child">' + esc(t("auth.childTab")) + "</button>" +
        "</div>" +
        (loginError ? '<div class="error-msg">' + esc(loginError) + "</div>" : "") +
        (loginTab === "parent" ? parentLoginForm() : childLoginGrid(s)) +
      "</div>" +
      '<div class="center">' +
        '<button class="btn ghost small" data-act="app.join">🔗 ' + esc(t("setup.joinFamily")) + "</button> " +
        '<button class="btn ghost small" data-act="app.restore">⬆️ ' + esc(t("setup.restore")) + "</button></div>" +
      '<div class="center"><div class="chips" style="justify-content:center">' +
        global.I18N.langs.map(function (l) {
          return '<button type="button" class="chip' + (l.code === global.I18N.lang ? " on" : "") +
            '" data-act="login.lang" data-lang="' + l.code + '">' + l.flag + " " + esc(l.label) + "</button>";
        }).join("") + "</div></div>" +
    "</div>";
  }

  function parentLoginForm() {
    return '<form data-act="login.parent">' +
      '<div class="field"><label for="lUser">' + esc(t("setup.username")) + "</label>" +
        '<input id="lUser" type="text" autocomplete="username" autocapitalize="none"></div>' +
      '<div class="field"><label for="lPass">' + esc(t("setup.password")) + "</label>" +
        '<input id="lPass" type="password" autocomplete="current-password"></div>' +
      '<button class="btn block" type="submit">' + esc(t("auth.signIn")) + "</button>" +
    "</form>";
  }

  function childLoginGrid(s) {
    if (!s.children.length) return U.emptyState(t("auth.noKids"), "🧒");
    return '<p class="lead">' + esc(t("auth.pickChild")) + "</p>" +
      '<div class="kid-grid">' + s.children.map(function (c) {
        return '<button class="kid-card" data-act="login.child" data-id="' + c.id + '">' +
          U.avatar(c.avatar, 56) + '<span class="nm">' + U.name(c) + "</span>" +
          (c.pin ? '<span class="tag">🔒</span>' : "") + "</button>";
      }).join("") + "</div>";
  }

  U.on("login.tab", function (d) { loginTab = d.tab; loginError = ""; global.App.refresh(); });
  U.on("login.lang", function (d) {
    global.I18N.setLang(d.lang);
    var s = global.Store.get();
    s.settings.lang = d.lang;
    global.Store.save();
    global.App.refresh();
  });
  U.on("login.parent", function (d, form) {
    var user = U.el("#lUser", form).value;
    var pass = U.el("#lPass", form).value;
    var p = global.Store.findParent(user);
    if (!p || !global.Store.checkSecret(p.secret, pass)) {
      loginError = t("auth.badLogin");
      return global.App.refresh();
    }
    loginError = "";
    global.Store.setSession("parent", p.id);
    global.App.applyUserLang();
    global.App.go({ screen: "parent", tab: "dashboard" });
    U.toast(t("auth.welcomeBack", { name: global.Store.nameOf(p) }), "good");
  });
  U.on("login.child", function (d) {
    var c = global.Store.child(d.id);
    if (!c) return;
    if (!c.pin) return enterAsChild(c);
    pinChildId = c.id;
    U.modal(global.Store.nameOf(c),
      '<form data-act="login.pin">' +
        '<p class="lead center">' + esc(t("auth.enterPin")) + "</p>" +
        '<div class="center">' + U.avatar(c.avatar, 64) + "</div>" +

      "</form>",
      function (body) { var i = U.el("#pinBox", body); if (i) i.focus(); });
  });
  U.on("login.pin", function (d, form) {
    var c = global.Store.child(pinChildId);
    var val = U.el("#pinBox", form).value;
    if (!c || !global.Store.checkSecret(c.pin, val)) {
      U.toast(t("auth.badPin"), "bad");
      return;
    }
    U.closeModal();
    enterAsChild(c);
  });

  function enterAsChild(c) {
    loginError = "";
    global.Store.setSession("child", c.id);
    global.App.applyUserLang();
    global.App.go({ screen: "child", tab: "me" });
    U.toast(t("auth.welcomeBack", { name: global.Store.nameOf(c) }), "good");

  global.Setup = { render: render, renderLogin: renderLogin, reset: reset };
})(window);

/* ==== js/parent.js ==== */
/* Parent (admin) screens: dashboard, tasks, kids, approvals, settings. */
(function (global) {
  "use strict";

  }

  /* ================= dashboard ================= */

  function dashboard() {
    var s = S.get();
    var gp = S.goalProgress();
    var rows = S.standings();
    var pending = S.pendingClaims();

    var html = '<div class="wrap">';

    html += bankCard(gp);

    if (pending.length) {
      html += '<div class="card tappable" data-act="p.goApprovals">' +
        '<div class="row between"><strong>🔔 ' + esc(t("dash.pending", { n: U.iso(pending.length) })) + "</strong><span>→</span></div></div>";
    }

    html += movieCard();

    html += '<div class="section-title">' + esc(t("dash.standings")) + "</div>";
    html += '<div class="card flush">' + (rows.length
      ? '<ul class="list">' + rows.map(function (r, i) {
          return '<li class="tappable" data-act="p.openChild" data-id="' + r.child.id + '">' +
            '<span class="rank-badge' + (i === 0 && r.earned > 0 ? " gold" : "") + '">' + (i + 1) + "</span>" +
            U.avatar(r.child.avatar, 40) +
            '<div class="grow"><div class="title">' + U.name(r.child) + "</div>" +
            '<div class="sub">' + esc(t("dash.earnedThisWeek", { n: U.signed(r.earned) })) + "</div></div>" +
            '<strong class="score" style="font-size:1.15rem">' + r.balance + "</strong></li>";
        }).join("") + "</ul>"
      : U.emptyState(t("common.empty"), "🧒")) + "</div>";

    html += birthdaysCard();
    html += activityCard();
    html += "</div>";
    return html;
  }

  function movieCard() {
    var s = S.get();
    var winner = S.weekWinner();
    var todays = S.movieNightToday();
    var isDay = S.isMovieDay();
    // whatever is already shown as tonight's pick should not repeat in history
    var history = s.movieNights.filter(function (m) {
      return !todays || m.id !== todays.id;
    }).slice(0, 3);

    if (!isDay && !history.length && !todays) return "";

    var body = "";
    if (todays) {
      body = "<p><strong>🍿 " + esc(todays.movie) + "</strong><br><small>" +
        esc(t("movie.pickedBy", { name: nameOf(todays.winnerId) })) + "</small></p>";
    } else if (isDay && winner) {
      body = "<p><strong>" + U.name(winner.child) + "</strong> · " + esc(weeklyPrize()) + "</p>" +
        '<button class="btn block" data-act="p.movie">' + esc(t("movie.record")) + "</button>";
    } else if (isDay) {
      body = '<p class="lead">' + esc(t("movie.noWinner")) + "</p>";
    }

    var past = history.length
      ? '<div class="section-title" style="margin-top:14px">' + esc(t("movie.history")) + "</div>" +
        history.map(function (m) {
          return '<div class="kv"><span class="k">' + esc(U.fmtDate(m.ts)) + "</span><span>" +
            esc(m.movie) + " · " + esc(nameOf(m.winnerId)) + "</span></div>";
        }).join("")
      : "";

    return '<div class="card">' +
      '<div class="eyebrow">' + esc(weeklyPrize()) + (isDay ? " · " + esc(t("movie.tonight")) : "") + "</div>" +
      body + past + "</div>";
  }

  /* The weekly winner's prize is a family decision, so the label is editable
     and "picks tonight's film" is only the default. */
  function weeklyPrize() {
    var custom = (S.get().settings.weeklyPrize || "").trim();
    return custom || t("movie.prizeDefault");
  }

  function birthdaysCard() {
    var s = S.get();
    var rows = s.children.map(function (c) { return { child: c, bd: S.birthdayInfo(c) }; })
      .filter(function (r) { return r.bd; })
      .sort(function (a, b) { return a.bd.days - b.bd.days; });
    if (!rows.length) return "";
    return '<div class="section-title">' + esc(t("dash.birthdays")) + "</div>" +
      '<div class="card">' + rows.map(function (r) {
        var label = r.bd.days === 0 ? t("dash.birthdayToday")
                  : r.bd.days === 1 ? t("dash.tomorrow")
                  : t("dash.daysLeft", { n: r.bd.days });
        return '<div class="countdown' + (r.bd.days === 0 ? " today" : "") + '">' +
          '<span class="days">' + (r.bd.days === 0 ? "🎂" : r.bd.days) + "</span>" +
          U.avatar(r.child.avatar, 36) +
          '<div class="grow"><div class="title">' + U.name(r.child) + "</div>" +
          '<div class="sub">' + esc(label) + " · " + esc(t("dash.turns", { n: r.bd.turning })) + "</div></div></div>";
      }).join("") + "</div>";
  }

  function activityCard() {
    var s = S.get();

    if (!rows.length) return "";
    return '<div class="section-title">' + esc(t("dash.activity")) + "</div>" +
      '<div class="card flush"><ul class="list">' + rows.map(function (l) {

          '<div class="sub">' + esc(l.childId ? nameOf(l.childId) : t("rewards.family")) + " · " + esc(U.relTime(l.ts)) + "</div></div>" +
          '<div class="pts-cell">' + (l.self ? U.points(l.self) : "") +

  }

  function ledgerLabel(l) {
    if (l.kind === "award" || l.kind === "penalty") {
      var task = S.task(l.taskId);
      return (task ? U.taskTitle(task) : t(l.kind === "award" ? "ledger.award" : "ledger.penalty"));
    }
    if (l.kind === "reward" || l.kind === "redeem") {
      var rw = S.reward(l.rewardId);

    if (l.kind === "start") return t("ledger.start");
    return l.note || t("ledger.manual");
  }
  function ledgerLabelHtml(l) {
    if (l.kind === "award" || l.kind === "penalty") {

  function nameOf(childId) { var c = S.child(childId); return c ? c.name : "—"; }

  /* ================= tasks ================= */

  function tasksTab() {

  function approvalsTab() {
    var pending = S.pendingClaims();
    var html = '<div class="wrap"><h1>' + esc(t("appr.title")) + "</h1>";
    if (!pending.length) return html + U.emptyState(t("appr.empty"), "✅") + "</div>";

    html += '<div class="card flush"><ul class="list">' + pending.map(function (cl) {
      var c = S.child(cl.childId);
      if (!c) return "";
      var isReward = cl.kind === "reward";
      var item = isReward ? S.reward(cl.rewardId) : S.task(cl.taskId);
      if (!item) return "";
      var cost = isReward ? S.num(item.cost) : 0;
      var afford = !isReward || S.balance(c.id) >= cost;

      var value = isReward
        ? U.points(-cost) + ' <small>' + esc(t("rewards.balanceAfter", { n: U.iso(S.balance(c.id) - cost) })) + "</small>"
        : (item.scope !== "group" ? U.points(item.onDoneSelf) : "") +
          (item.scope !== "personal" ? " <small>" + esc(t("tasks.groupPts")) + "</small> " + U.points(item.onDoneGroup) : "");

      return "<li>" + U.avatar(c.avatar, 40) +
        '<div class="grow"><div class="title">' + (isReward ? (item.icon || "🎁") + " " : "") + U.keyedTitleHtml(item) + "</div>" +
        '<div class="sub" title="' + esc(t("appr.claimedAt", { when: U.fmtDateTime(cl.ts) })) + '">' +
          U.name(c) + " · " +
          esc(isReward ? t("appr.wantsReward") : t("appr.claimedAt", { when: U.relTime(cl.ts) })) + "</div>" +
        '<div class="sub">' + value +
          (afford ? "" : ' <span class="tag bad">' + esc(t("rewards.short", { n: U.iso(cost - S.balance(c.id)) })) + "</span>") +
        "</div></div>" +
        '<div class="row tight nowrap">' +
          '<button class="btn small good" data-act="p.claim" data-id="' + cl.id + '" data-ok="1"' +

        "</div></li>";
    }).join("") + "</ul></div>";

    return html + "</div>";
  }

          '<div class="grow"><div class="title">' + U.name(p) + "</div>" +
          '<div class="sub">' + esc(p.username) + " · " + esc(t("lang." + (p.lang || s.settings.lang))) + "</div></div>" +
          '<button class="icon-btn" data-act="p.parentEdit" data-id="' + p.id + '">✏️</button>' +
          (s.parents.length > 1 ? '<button class="icon-btn" data-act="p.parentDelete" data-id="' + p.id + '">🗑️</button>' : "") +
          "</li>";

    html += '<div class="section-title">' + esc(t("family.categories")) +
      '<button class="btn small soft" data-act="p.catNew">＋</button></div>' +
      '<div class="card flush"><ul class="list">' + s.categories.map(function (c) {
        return "<li><span class=\"rank-badge\">" + c.icon + "</span>" +
          '<div class="grow"><div class="title">' + U.categoryNameHtml(c) + "</div>" +
          '<div class="sub">' + s.tasks.filter(function (t2) { return t2.categoryId === c.id; }).length + " " + esc(t("tasks.title")) + "</div></div>" +
          '<button class="icon-btn" data-act="p.catEdit" data-id="' + c.id + '">✏️</button>' +
          '<button class="icon-btn" data-act="p.catDelete" data-id="' + c.id + '">🗑️</button></li>';
      }).join("") + "</ul></div>";

    html += syncCard();
    html += translationCard();

    html += '<div class="section-title">' + esc(t("family.data")) + "</div>" +
      '<div class="card stack">' +
        '<button class="btn ghost block" data-act="p.export">⬇️ ' + esc(t("family.export")) + "</button>" +
        '<button class="btn ghost block" data-act="p.import">⬆️ ' + esc(t("family.import")) + "</button>" +
        '<button class="btn danger block" data-act="p.reset">🗑️ ' + esc(t("family.reset")) + "</button>" +

  /* The family's own name, written per language, edited in settings. */
  var familyNameLang = "en", familyNamesDraft = null;
  function familyNames() {
    var set = S.get().settings;
    if (!familyNamesDraft) {
      familyNamesDraft = S.clone(set.familyNames || {});
      familyNameLang = global.I18N.lang;
      if (set.familyName && !Object.keys(familyNamesDraft).length) {
        familyNamesDraft[familyNameLang] = set.familyName;
      }
    }
    return familyNamesDraft;
  }

  function langChips(active, action, extra) {
    return '<div class="chips">' + global.I18N.langs.map(function (l) {
      return '<button type="button" class="chip' + (l.code === active ? " on" : "") +
        '" data-act="' + action + '" data-lang="' + l.code + '"' + (extra || "") + ">" +
        l.flag + " " + esc(l.label) + "</button>";
    }).join("") + "</div>";
  }

  function syncCard() {
    var st = global.Sync.status();
    var line = !st.connected ? t("sync.off") : t("sync." + (st.state === "off" ? "idle" : st.state));
    var dot = !st.connected ? "⚪"
            : st.state === "syncing" ? "🔄"
            : st.state === "offline" ? "🟠"
            : st.state === "error" ? "🔴" : "🟢";

    var body = '<small>' + esc(t("sync.hint")) + "</small>" +
      '<div class="kv"><span class="k">' + esc(t("common.status")) + "</span><span>" +
        dot + " " + esc(line) + "</span></div>";

    if (st.connected) {
      body += '<div class="kv"><span class="k">' + esc(t("sync.lastSync", { when: "" }).replace("{when}", "")) +
        "</span><span>" + esc(st.lastSyncAt ? U.fmtDateTime(st.lastSyncAt) : t("sync.never")) + "</span></div>" +
        '<div class="row gap mt">' +
          '<button class="btn grow" data-act="p.syncInvite">🔗 ' + esc(t("sync.invite")) + "</button>" +
          '<button class="btn ghost" data-act="p.syncNow">' + esc(t("sync.now")) + "</button>" +
        "</div>" +
        '<button class="btn ghost block mt" data-act="p.syncOff">' + esc(t("sync.disconnect")) + "</button>";
    } else {
      body += '<button class="btn block mt" data-act="p.syncOn">☁️ ' + esc(t("sync.connect")) + "</button>" +
        '<button class="btn ghost block mt" data-act="app.join">' + esc(t("sync.join")) + "</button>";
    }

    return '<div class="section-title">' + esc(t("sync.title")) + "</div>" +
      '<div class="card">' + body + '<div class="hint">' + esc(t("sync.privacy")) + "</div></div>";
  }

  function translationCard() {
    var s = S.get();
    var on = s.settings.translate !== false;
    var st = global.Translate.status();
    var line = !st.supported ? t("tr.unsupported")
             : st.state === "working" ? t("tr.working")
             : st.state === "needs-download" ? t("tr.prepare")
             : t("tr.ready");

    return '<div class="section-title">' + esc(t("tr.title")) + "</div>" +
      '<div class="card">' +
        '<small>' + esc(t("tr.hint")) + "</small>" +
        '<label class="row tight mt"><input type="checkbox" style="width:auto"' + (on ? " checked" : "") +
          ' data-act="p.trToggle"> ' + esc(t("tr.enabled")) + "</label>" +
        '<div class="kv"><span class="k">' + esc(t("common.status")) + "</span><span>" +
          (st.supported ? "" : "⚠️ ") + esc(line) + "</span></div>" +
        (st.supported && on
          ? '<button class="btn ghost block mt" data-act="p.trPrepare">⬇️ ' + esc(t("tr.prepare")) + "</button>"
          : "") +
        '<div class="hint">' + esc(t("tr.privacy")) + "</div>" +
      "</div>";
  }

  /* ================= actions ================= */

  U.on("p.goApprovals", function () { global.App.go({ tab: "approvals" }); });
  U.on("p.openChild", function (d) { global.App.go({ tab: "kids", params: { childId: d.id } }); });
  U.on("p.backKids", function () { global.App.go({ tab: "kids", params: {} }); });
  U.on("p.toggleInactive", function (d, node) { showInactive = node.checked; global.App.refresh(); });

  U.on("p.taskNew", function () { taskEditor(null); });

  U.on("p.taskScope", function (d) { taskDraft.scope = d.scope; redrawTaskEditor(); });
  U.on("p.taskAssign", function (d) { taskDraft.assign = d.mode; redrawTaskEditor(); });
  U.on("p.taskChild", function (d) {
    captureTask();
    var ids = taskDraft.assignIds || [];
    var i = ids.indexOf(d.id);
    if (i === -1) ids.push(d.id); else ids.splice(i, 1);
    taskDraft.assignIds = ids;
    redrawTaskEditor();
  });
  U.on("p.taskSave", function () {
    captureTask();
    if (!taskDraft.title) { U.toast(t("common.required"), "bad"); return; }
    if (taskDraft.assign === "some" && !(taskDraft.assignIds || []).length) taskDraft.assign = "all";
    // A renamed seed task keeps the literal title instead of the translation key.
    if (taskDraft.titleKey && taskDraft.title !== t(taskDraft.titleKey)) taskDraft.titleKey = "";
    if (taskDraft.titleKey) taskDraft.title = "";
    S.saveTask(taskDraft);
    U.closeModal();
    U.toast(t("common.saved"), "good");
    global.App.refresh();
  });
  U.on("p.taskDelete", function (d) {
    U.confirmDialog(t("tasks.deleteConfirm"), function () {
      S.deleteTask(d.id);
      U.toast(t("common.saved"), "good");
      global.App.refresh();
    });
  });

  U.on("p.award", function (d) {
    var task = S.task(d.id);
    if (!task) return;
    var kids = S.get().children.filter(function (c) {
      return task.assign === "all" || (task.assignIds || []).indexOf(c.id) !== -1;
    });
    if (!kids.length) return U.toast(t("common.empty"), "bad");
    if (kids.length === 1) return applyAward(kids[0].id, task, d.outcome);
    awardCtx = { taskId: task.id, outcome: d.outcome };
    U.modal(t("tasks.pickChild"),
      '<p class="lead">' + esc(U.taskTitle(task)) + " · " +
        esc(d.outcome === "done" ? t("tasks.markDone") : t("tasks.markMissed")) + "</p>" +
      '<div class="kid-grid">' + kids.map(function (c) {
        return '<button class="kid-card" data-act="p.awardPick" data-id="' + c.id + '">' +
          U.avatar(c.avatar, 52) + '<span class="nm">' + U.name(c) + "</span></button>";
      }).join("") + "</div>");
  });
  U.on("p.awardPick", function (d) {
    var task = S.task(awardCtx.taskId);
    U.closeModal();
    applyAward(d.id, task, awardCtx.outcome);
  });
  function applyAward(childId, task, outcome) {
    var entry = S.awardTask(childId, task.id, outcome, me().id);
    var c = S.child(childId);
    U.toast(t("tasks.awarded", { name: S.nameOf(c), sign: "", n: U.signed(entry.self) }),
      entry.self >= 0 ? "good" : "bad");
    global.App.refresh();
  }

  U.on("p.adjust", function (d) {
    var c = S.child(d.id);
    var sign = S.num(d.sign) < 0 ? -1 : 1;
    U.modal(t("kids.adjust") + " · " + c.name,
      '<form data-act="p.adjustSave" data-id="' + c.id + '" data-sign="' + sign + '">' +
        '<div class="field"><label for="aAmount">' + esc(t("kids.amount")) + "</label>" +
          '<input id="aAmount" type="number" min="1" value="10"></div>' +
        '<div class="field"><label for="aReason">' + esc(t("kids.reason")) + "</label>" +
          '<input id="aReason" type="text"></div>' +
        '<label class="row tight"><input id="aGroup" type="checkbox" style="width:auto"> ' +
          esc(t("tasks.groupPts")) + "</label>" +
        '<button class="btn block mt" type="submit">' + esc(t("common.save")) + "</button>" +
      "</form>");
  });

    var amount = Math.abs(S.num(U.el("#aAmount", form).value)) * S.num(d.sign);
    var reason = U.el("#aReason", form).value.trim();
    var toGroup = U.el("#aGroup", form).checked;
    S.adjust(d.id, toGroup ? 0 : amount, toGroup ? amount : 0, reason, me().id);

      b.classList.toggle("sel", b.dataset.avatar === d.avatar);
    });
  });
  U.on("p.childSave", function (d, form) {
    var typed = U.el("#cnName", form).value.trim();
    if (typed) editingNames[editingNameLang] = typed; else delete editingNames[editingNameLang];
    var name = editingNames[editingNameLang] ||
      Object.keys(editingNames).map(function (k) { return editingNames[k]; })[0] || "";
    if (!name) return U.toast(t("setup.errChildName"), "bad");
    var birthday = U.el("#cnBday", form).value;
    var pin = U.el("#cnPin", form).value.replace(/\D/g, "");
    if (pin && pin.length !== 4) return U.toast(t("setup.errPin"), "bad");
    if (d.id) {
      S.updateChild(d.id, { name: name, names: S.clone(editingNames), birthday: birthday,
                            avatar: editingAvatar, lang: editingLang });
      if (pin) S.setChildPin(d.id, pin);
    } else {
      S.addChild({ name: name, names: S.clone(editingNames), birthday: birthday,
                   avatar: editingAvatar, pin: pin, lang: editingLang }, me().id);
    }
    U.closeModal();
    U.toast(t("common.saved"), "good");
    global.App.refresh();
  });
  U.on("p.childDelete", function (d) {
    var c = S.child(d.id);
    U.confirmDialog(t("kids.deleteConfirm", { name: S.nameOf(c) }), function () {
      S.removeChild(d.id);
      global.App.go({ tab: "kids", params: {} });
    });
  });

    var input = form.querySelector('input[name="text"]');

    if (!text) return;
    S.addListItem(d.id, d.field, text);
    input.value = "";
    global.App.refresh();
  });
  U.on("p.itemEdit", function (d) {
    var c = S.child(d.id);
    var item = (c[d.field] || []).filter(function (i) { return i.id === d.item; })[0];
    if (!item) return;
    U.modal(t("common.edit"),
      '<form data-act="p.itemSave" data-id="' + d.id + '" data-field="' + d.field + '" data-item="' + d.item + '">' +
        '<div class="field"><textarea name="text">' + esc(item.text) + "</textarea></div>" +
        '<button class="btn block" type="submit">' + esc(t("common.save")) + "</button></form>");
  });

    var text = form.querySelector('[name="text"]').value.trim();
    if (!text) return U.toast(t("common.required"), "bad");
    S.updateListItem(d.id, d.field, d.item, text);
    U.closeModal();
    U.toast(t("common.saved"), "good");
    global.App.refresh();
  });
  U.on("p.itemRemove", function (d) {

    if (rewardDraft.titleKey) rewardDraft.title = "";

  /* Handing over a reward: family ones name the chooser, child ones ask which
     child is spending their points. */
  U.on("p.giveReward", function (d) {
    var r = S.reward(d.id);
    if (!r) return;
    if (r.kind === "family") return familyRedeemModal(r);
    var kids = S.get().children.filter(function (c) {
      return r.assign === "all" || (r.assignIds || []).indexOf(c.id) !== -1;
    });
    if (!kids.length) return U.toast(t("common.empty"), "bad");
    U.modal(U.keyedTitle(r),
      '<p class="lead">' + esc(t("rewards.cost")) + " " + S.num(r.cost) + " " + esc(t("common.points")) + "</p>" +
      '<div class="kid-grid">' + kids.map(function (c) {
        var left = S.balance(c.id) - S.num(r.cost);
        return '<button class="kid-card" data-act="p.giveRewardTo" data-reward="' + r.id + '" data-id="' + c.id + '"' +
          (left < 0 ? " disabled" : "") + ">" +
          U.avatar(c.avatar, 52) + '<span class="nm">' + U.name(c) + "</span>" +
          '<span class="tag">' + (left < 0 ? esc(t("rewards.short", { n: U.iso(-left) }))
                                           : esc(t("rewards.balanceAfter", { n: U.iso(left) }))) + "</span></button>";
      }).join("") + "</div>");
  });
  U.on("p.giveRewardTo", function (d) {
    var r = S.reward(d.reward);
    var c = S.child(d.id);
    if (!S.redeem(r.id, c.id, "", me().id)) return U.toast(t("rewards.tooExpensive", { name: S.nameOf(c) }), "bad");
    U.closeModal();
    U.toast(t("rewards.redeemed", { name: U.keyedTitle(r), n: U.iso(S.num(r.cost)) }), "good");
    global.App.refresh();
  });

    if (gp.unlocked.length === 1) return familyRedeemModal(gp.unlocked[0]);
    U.modal(t("rewards.pick"),
      '<div class="stack">' + gp.unlocked.map(function (r) {
        return '<button class="btn ghost block" data-act="p.giveReward" data-id="' + r.id + '">' +
          (r.icon || "🎁") + " " + esc(U.keyedTitle(r)) + " · " + S.num(r.cost) + "</button>";
      }).join("") + "</div>");

    U.modal(U.keyedTitle(r),
      '<div class="center">' + U.avatar(top.child.avatar, 64) + "</div>" +
      '<p class="lead center">' + esc(t("rewards.chooser", { name: S.nameOf(top.child) })) + "</p>" +
