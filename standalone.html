  U.on("p.export", function () {
    var data = JSON.stringify(S.get(), null, 2);
    U.modal(t("family.export"),
      '<p class="hint">' + esc(t("family.exportHint")) + "</p>" +
      '<textarea id="exportBox" readonly style="min-height:170px;font-family:ui-monospace,monospace;font-size:.72rem">' +
        esc(data) + "</textarea>" +
      '<div class="row gap mt">' +
        '<button class="btn grow" data-act="p.exportCopy">📋 ' + esc(t("family.copy")) + "</button>" +
        '<button class="btn ghost grow" data-act="p.exportFile">⬇️ ' + esc(t("family.download")) + "</button>" +
      "</div>",
      function (body) {
        var box = U.el("#exportBox", body);
        if (box) { box.focus(); box.select(); }
      });
  });
  U.on("p.exportCopy", function () {
    var box = U.el("#exportBox");
    if (!box) return;
    box.select();
    box.setSelectionRange(0, box.value.length);
    var done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    if (!done && global.navigator.clipboard) {
      return global.navigator.clipboard.writeText(box.value)
        .then(function () { U.toast(t("family.copied"), "good"); })
        .catch(function () { U.toast(t("common.required"), "bad"); });
    }
    U.toast(done ? t("family.copied") : t("family.exportHint"), done ? "good" : "");
  });
  U.on("p.exportFile", function () {
    saveBackupFile("family-points-" + S.dayKey() + ".json", JSON.stringify(S.get(), null, 2));
  });

  /* Saving a file works differently depending on where the app is running. On
     an ordinary page a link does it; inside a viewer that mediates saves, the
     viewer has to be asked and is free to say no. Either way the backup is
     also on screen as text, so nothing is lost if a save is unavailable. */
  function saveBackupFile(filename, data) {
    var host = global.claude;
    if (host && typeof host.use === "function") {
      return host.use("downloads").then(function (downloads) {
        if (!downloads) return U.toast(t("family.exportHint"), "");
        return downloads.save({ filename: filename, data: data })
          .then(function () { U.toast(t("common.saved"), "good"); })
          .catch(function (err) {
            if (err && err.code === "declined") return;   // the viewer said no
            U.toast(t("family.exportHint"), "bad");
          });
      }).catch(function () { U.toast(t("family.exportHint"), "bad"); });
    }
    try {
      var blob = new Blob([data], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) {
      U.toast(t("family.exportHint"), "bad");
    }
  }

  /* Restoring is also how a second device joins a family that already exists,
     so the same dialog is reachable before anyone has signed in. */
  function importDialog() {
    U.modal(t("family.import"),
      '<p class="hint">' + esc(t("family.pasteHint")) + "</p>" +
      '<label class="btn ghost block mb" style="cursor:pointer">📂 ' + esc(t("family.pickFile")) +
        '<input type="file" accept="application/json,.json" id="importFile" style="display:none"></label>' +
      '<textarea id="importBox" style="min-height:150px;font-family:ui-monospace,monospace;font-size:.72rem"></textarea>' +
      '<button class="btn block mt" data-act="p.importText">' + esc(t("family.restore")) + "</button>",
      function () { bindImport(); });
  }
  U.on("p.import", importDialog);
  U.on("app.restore", importDialog);
  U.on("p.importText", function () {
    var box = U.el("#importBox");
    if (box) applyBackup(box.value);
  });

  /* One place decides whether a pasted or uploaded blob is really a backup. */
  function applyBackup(raw) {
    var parsed;
    try {
      parsed = JSON.parse(raw);
      if (!parsed || !parsed.settings || !parsed.children || !parsed.ledger) throw new Error("bad");
    } catch (e) {
      return U.toast(t("family.importBad"), "bad");
    }
    S.replace(parsed);
    global.App.applyUserLang();
    U.closeModal();
    U.toast(t("family.importOk"), "good");
    global.App.refresh();
  }

  U.on("p.reset", function () {
    U.confirmDialog(t("family.resetWarn"), function () {
      S.wipe();
      global.Setup.reset();
      global.App.go({ screen: "setup" });
    });
  });

  /* The file input lives inside a <label> in the import dialog. */
  function bindImport() {
    var input = U.el("#importFile");
    if (!input || input._bound) return;
    input._bound = true;
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () { applyBackup(reader.result); };
      reader.onerror = function () { U.toast(t("family.importBad"), "bad"); };
      reader.readAsText(file);
    });
  }

  global.ParentView = { render: render };
})(window);

/* ==== js/child.js ==== */
/* Child screens: own account, own tasks, the group account, own notebook. */
(function (global) {
  "use strict";

  var t = function (k, p) { return global.I18N.t(k, p); };
  var esc = function (s) { return global.UI.esc(s); };
  var U = global.UI, S = global.Store;

  function me() { return S.child(global.App.session().id); }

  function render(tab) {
    var c = me();
    if (!c) { S.clearSession(); return ""; }
    if (tab === "tasks") return tasksTab(c);
    if (tab === "rewards") return rewardsTab(c);
    if (tab === "group") return groupTab(c);
    if (tab === "notes") return notesTab(c);
    return meTab(c);
  }

  /* ================= me ================= */

  function meTab(c) {
    var bd = S.birthdayInfo(c);
    var rank = S.standings().findIndex(function (r) { return r.child.id === c.id; }) + 1;
    var recent = S.get().ledger.filter(function (l) { return l.childId === c.id; }).slice().reverse().slice(0, 8);

    var html = '<div class="wrap">' +
      '<div class="card hero center">' +
        U.avatar(c.avatar, 84) +
        "<h1 style=\"margin-top:10px\">" + U.name(c) + "</h1>" +
        '<div class="score" style="font-size:2.8rem">' + S.balance(c.id) + "</div>" +
        '<small>' + esc(t("common.points")) + "</small>" +
        '<div class="row gap mt" style="justify-content:center">' +
          '<span class="tag" style="background:rgba(255,255,255,.22);color:#fff">' + esc(t("common.rank")) + " " + rank + "</span>" +
          '<span class="tag" style="background:rgba(255,255,255,.22);color:#fff">' +
            esc(t("dash.earnedThisWeek", { n: U.signed(S.weekEarned(c.id)) })) + "</span>" +
        "</div>" +
      "</div>";

    if (bd) {
      var label = bd.days === 0 ? t("dash.birthdayToday")
                : bd.days === 1 ? t("dash.tomorrow")
                : t("dash.daysLeft", { n: U.iso(bd.days) });
      html += '<div class="card"><div class="eyebrow">' + esc(t("dash.birthdays")) + "</div>" +
        '<div class="row between"><strong style="font-size:1.1rem">🎂 ' + esc(label) + "</strong>" +
        '<span class="tag brand">' + esc(t("dash.turns", { n: U.iso(bd.turning) })) + "</span></div></div>";
    }

    var winner = S.weekWinner();
    if (winner && winner.child.id === c.id && S.isMovieDay()) {
      var todays = S.movieNightToday();
      var prize = (S.get().settings.weeklyPrize || "").trim() || t("movie.prizeDefault");
      html += '<div class="card good"><div class="eyebrow">' + esc(prize) + "</div>" +
        "<p><strong>🍿 " + esc(todays ? todays.movie : prize) + "</strong></p></div>";
    }

    html += '<div class="section-title">' + esc(t("dash.activity")) + "</div>" +
      '<div class="card flush">' + (recent.length
        ? '<ul class="list">' + recent.map(function (l) {
            var task = S.task(l.taskId);
            var label2 = task ? U.taskTitleHtml(task)
              : l.kind === "start" ? esc(t("ledger.start"))
              : l.note ? U.trHtml(l, "note") : esc(t("ledger.manual"));
            return "<li><div class=\"grow\"><div class=\"title\">" + label2 + "</div>" +
              '<div class="sub">' + esc(U.fmtDateTime(l.ts)) + "</div></div>" +
              U.points(l.self) + "</li>";
          }).join("") + "</ul>"
        : U.emptyState(t("kids.noHistory"), "📈")) + "</div>";

    return html + "</div>";
  }

  /* ================= my tasks ================= */

  function tasksTab(c) {
    var s = S.get();
    var mine = S.tasksForChild(c.id);
    var html = '<div class="wrap"><h1>' + esc(t("tasks.mine")) + "</h1>";
    if (!mine.length) return html + U.emptyState(t("tasks.noneForChild"), "📋") + "</div>";

    s.categories.forEach(function (cat) {
      var list = mine.filter(function (task) { return task.categoryId === cat.id; });
      if (!list.length) return;
      html += '<div class="section-title">' + cat.icon + " " + U.categoryNameHtml(cat) + "</div>" +
        '<div class="card flush">' + list.map(function (task) { return taskRow(c, task); }).join("") + "</div>";
    });
    var orphans = mine.filter(function (task) { return !S.category(task.categoryId); });
    if (orphans.length) {
      html += '<div class="section-title">' + esc(t("cat.other")) + "</div>" +
        '<div class="card flush">' + orphans.map(function (task) { return taskRow(c, task); }).join("") + "</div>";
    }
    return html + "</div>";
  }

  function taskRow(c, task) {
    var claim = S.claimFor(c.id, task.id);
    var status = "";
    if (claim && claim.status === "pending") {
      status = '<span class="tag" title="' + esc(t("child.reportedAt", { when: U.fmtDateTime(claim.ts) })) +
        '">⏳ ' + esc(t("tasks.claimed")) + "</span>";
    }
    else if (claim && claim.status === "approved") status = '<span class="tag good">✓ ' + esc(t("tasks.doneToday")) + "</span>";
    else if (claim && claim.status === "rejected") status = '<span class="tag bad">✗ ' + esc(t("appr.rejected")) + "</span>";

    var reward = [];
    if (task.scope !== "group") reward.push(U.points(task.onDoneSelf));
    if (task.scope !== "personal") reward.push('<small>' + esc(t("nav.group")) + "</small> " + U.points(task.onDoneGroup));

    return '<div class="task-row">' +
      '<div class="grow"><div class="title">' + U.taskTitleHtml(task) + "</div>" +
        '<div class="sub">' + reward.join(" · ") +
        (S.num(task.onMissSelf) < 0 ? " · <small>" + esc(t("tasks.onMiss")) + " " + U.points(task.onMissSelf) + "</small>" : "") +
        "</div>" + (status ? '<div class="sub">' + status + "</div>" : "") + "</div>" +
      (claim && claim.status === "pending"
        ? '<button class="btn small ghost" disabled>⏳</button>'
        : '<button class="btn small good" data-act="c.claim" data-id="' + task.id + '">' + esc(t("tasks.iDidIt")) + "</button>") +
      "</div>";
  }

  /* ================= rewards ================= */

  function rewardsTab(c) {
    var balance = S.balance(c.id);
    var mine = S.rewardsFor(c.id).sort(function (a, b) { return S.num(a.cost) - S.num(b.cost); });
    var gp = S.goalProgress();

    var html = '<div class="wrap"><h1>' + esc(t("rewards.title")) + "</h1>" +
      '<div class="card hero center">' +
        '<div class="score" style="font-size:2.4rem">' + balance + "</div>" +
        '<small>' + esc(t("common.points")) + "</small></div>";

    html += '<div class="section-title">' + esc(t("rewards.child")) + "</div>";
    html += mine.length
      ? '<div class="card flush">' + mine.map(function (r) { return rewardRow(c, r, balance); }).join("") + "</div>"
      : U.emptyState(t("rewards.noneForChild"), "🎁");

    html += '<div class="section-title">' + esc(t("rewards.family")) + "</div>" +
      '<div class="card">' +
        '<div class="row between nowrap"><strong>' + esc(t("dash.groupBank")) + "</strong>" +
        '<span class="score" style="font-size:1.2rem">' + gp.total + "</span></div>" +
        U.progressBar(gp.pct) +
        '<small>' + esc(gp.next
          ? t("rewards.nextGoal", { name: U.keyedTitle(gp.next) }) + " · " + t("rewards.short", { n: U.iso(gp.missing) })
          : t("rewards.unlockedCount", { n: U.iso(gp.unlocked.length) })) + "</small>" +
        (gp.unlocked.length
          ? '<ul class="list" style="margin-top:8px">' + gp.unlocked.map(function (r) {
              return "<li><span class=\"rank-badge\">" + (r.icon || "🎁") + "</span>" +
                '<div class="grow"><div class="title">' + U.keyedTitleHtml(r) + "</div></div>" +
                '<span class="tag good">' + esc(t("rewards.unlocked")) + "</span></li>";
            }).join("") + "</ul>"
          : "") +
      "</div>";

    return html + "</div>";
  }

  function rewardRow(c, r, balance) {
    var cost = S.num(r.cost);
    var claim = S.rewardClaimFor(c.id, r.id);
    var short = cost - balance;
    var status = "";
    if (claim && claim.status === "pending") {
      status = '<span class="tag" title="' + esc(t("child.requestedAt", { when: U.fmtDateTime(claim.ts) })) +
        '">⏳ ' + esc(t("rewards.requested")) + "</span>";
    }
    else if (claim && claim.status === "approved") status = '<span class="tag good">✓ ' + esc(t("common.done")) + "</span>";
    else if (claim && claim.status === "rejected") status = '<span class="tag bad">✗ ' + esc(t("appr.rejected")) + "</span>";

    return '<div class="task-row' + (short > 0 ? " paused" : "") + '">' +
      '<span class="rank-badge" style="font-size:1.1rem">' + (r.icon || "🎁") + "</span>" +
      '<div class="grow"><div class="title">' + U.keyedTitleHtml(r) + "</div>" +
        '<div class="sub">' + U.points(-cost) + " · " +
          esc(short > 0 ? t("rewards.short", { n: U.iso(short) }) : t("rewards.affordable")) + "</div>" +
        (status ? '<div class="sub">' + status + "</div>" : "") +
      "</div>" +
      (claim && claim.status === "pending"
        ? '<button class="btn small ghost" disabled>⏳</button>'
        : '<button class="btn small' + (short > 0 ? " ghost" : " good") + '" data-act="c.wantReward" data-id="' + r.id + '"' +
          (short > 0 ? " disabled" : "") + ">" + esc(t("rewards.want")) + "</button>") +
      "</div>";
  }

  /* ================= group ================= */

  function groupTab(c) {
    var s = S.get();
    var gp = S.goalProgress();
    var rows = S.standings();
    var top = S.topScorer();

    var html = '<div class="wrap">' +
      '<div class="card hero">' +
        '<div class="eyebrow">' + esc(t("dash.groupBank")) + "</div>" +
        '<div class="row between nowrap"><div class="score">' + gp.total + "</div>" +
        '<div class="tag" style="background:rgba(255,255,255,.2);color:#fff">' + esc(t("dash.goal", { n: U.iso(gp.goal) })) + "</div></div>" +
        U.progressBar(gp.pct) +
        (gp.reached
          ? "<p>🎉 " + esc(t("rewards.unlockedCount", { n: U.iso(gp.unlocked.length) })) + "</p>" +
            (top ? "<small>" + esc(t("rewards.chooser", { name: top.child.id === c.id ? t("common.you") : S.nameOf(top.child) })) + "</small>" : "")
          : "<small>" + esc(gp.next
              ? t("rewards.nextGoal", { name: U.keyedTitle(gp.next) }) + " · " + t("rewards.short", { n: U.iso(gp.missing) })
              : t("rewards.short", { n: U.iso(gp.missing) })) + "</small>") +
      "</div>";

    html += '<div class="section-title">' + esc(t("dash.standings")) + "</div>" +
      '<div class="card flush"><ul class="list">' + rows.map(function (r, i) {
        return '<li' + (r.child.id === c.id ? ' style="background:var(--brand-soft)"' : "") + ">" +
          '<span class="rank-badge' + (i === 0 && r.earned > 0 ? " gold" : "") + '">' + (i + 1) + "</span>" +
          U.avatar(r.child.avatar, 38) +
          '<div class="grow"><div class="title">' + U.name(r.child) + "</div>" +
          '<div class="sub">' + esc(t("dash.earnedThisWeek", { n: U.signed(r.earned) })) + "</div></div>" +
          '<strong class="score" style="font-size:1.1rem">' + r.balance + "</strong></li>";
      }).join("") + "</ul></div>";

    html += '<div class="section-title">' + esc(t("movie.history")) + "</div>" +
      '<div class="card">' + (s.movieNights.length
        ? s.movieNights.slice(0, 8).map(function (m) {
            return '<div class="kv"><span class="k">' + esc(U.fmtDate(m.ts)) + "</span><span>🍿 " +
              esc(m.movie) + " · " + esc(nameOf(m.winnerId)) + "</span></div>";
          }).join("")
        : '<p class="muted">' + esc(t("movie.empty")) + "</p>") + "</div>";

    html += '<div class="section-title">' + esc(t("rewards.history")) + "</div>" +
      '<div class="card">' + (s.redemptions.length
        ? s.redemptions.slice(0, 8).map(function (r) {
            return '<div class="kv"><span class="k">' + esc(U.fmtDate(r.ts)) + "</span><span>" +
              (r.icon || "🎁") + " " + U.keyedTitleHtml(r) +
              (r.note ? " · " + U.trHtml(r, "note") : "") +
              (r.childId ? " · " + esc(nameOf(r.childId)) : "") + "</span></div>";
          }).join("")
        : '<p class="muted">' + esc(t("common.empty")) + "</p>") + "</div>";

    return html + "</div>";
  }

  function nameOf(id) { var c = S.child(id); return c ? c.name : "—"; }

  /* ================= notes ================= */

  function notesTab(c) {
    return '<div class="wrap"><h1>' + esc(t("nav.notes")) + "</h1>" +
      listCard(c, "notes", "📝 " + t("kids.notes"), t("kids.notesHint"), t("kids.addNote"), false, true) +
      listCard(c, "gifts", "🎁 " + t("kids.gifts"), t("kids.giftsHint"), t("kids.addGift"), false, false) +
      listCard(c, "outings", "🎡 " + t("kids.outings"), t("kids.outingsHint"), t("kids.addOuting"), true, false) +
      "</div>";
  }

  function listCard(child, field, title, hint, addLabel, ordered, multiline) {
    var items = child[field] || [];
    return '<div class="section-title">' + esc(title) + "</div>" +
      '<div class="card">' +
        '<small>' + esc(hint) + "</small>" +
        '<form data-act="c.itemAdd" data-field="' + field + '" class="row tight nowrap mt">' +
          (multiline
            ? '<textarea name="text" class="grow" placeholder="' + esc(addLabel) + '" style="min-height:64px"></textarea>'
            : '<input type="text" name="text" class="grow" placeholder="' + esc(addLabel) + '">') +
          '<button class="btn small" type="submit">＋</button>' +
        "</form>" +
        (items.length
          ? '<ul class="list" style="margin-top:10px">' + items.map(function (it, i) {
              return "<li>" + (ordered ? '<span class="rank-badge">' + (i + 1) + "</span>" : "") +
                '<div class="grow"><div class="title" style="white-space:pre-wrap">' + U.trHtml(it, "text") + "</div>" +
                '<div class="sub">' + esc(U.fmtDate(it.ts)) + "</div></div></li>";
            }).join("") + "</ul>"
          : '<p class="muted">' + esc(t("common.empty")) + "</p>") +
        '<div class="hint">' + esc(t("child.readOnly")) + "</div>" +
      "</div>";
  }

  /* ================= actions ================= */

  U.on("c.claim", function (d) {
    var c = me();
    S.claimTask(c.id, d.id);
    U.toast(t("tasks.claimSent"), "good");
    global.App.refresh();
  });
  U.on("c.itemAdd", function (d, form) {
    var input = form.querySelector('[name="text"]');
    var text = input.value.trim();
    if (!text) return;
    S.addListItem(me().id, d.field, text);
    input.value = "";
    global.App.refresh();
  });
  U.on("c.wantReward", function (d) {
    var c = me();
    var r = S.reward(d.id);
    if (!r) return;
    if (S.balance(c.id) < S.num(r.cost)) {
      return U.toast(t("rewards.short", { n: U.iso(S.num(r.cost) - S.balance(c.id)) }), "bad");
    }
    S.claimReward(c.id, r.id);
    U.toast(t("tasks.claimSent"), "good");
    global.App.refresh();
  });

  global.ChildView = { render: render };
})(window);

/* ==== js/app.js ==== */
/* Router, chrome and boot. */
(function (global) {
  "use strict";

  var t = function (k, p) { return global.I18N.t(k, p); };
  var esc = function (s) { return global.UI.esc(s); };
  var U = global.UI, S = global.Store;

  var view = { screen: "login", tab: "dashboard", params: {} };

  var PARENT_TABS = [
    { id: "dashboard", icon: "🏠", key: "nav.dashboard" },
    { id: "tasks", icon: "📋", key: "nav.tasks" },
    { id: "rewards", icon: "🎁", key: "nav.rewards" },
    { id: "kids", icon: "🧒", key: "nav.kids" },
    { id: "approvals", icon: "✅", key: "nav.approvals" },
    { id: "family", icon: "⚙️", key: "nav.family" }
  ];
  var CHILD_TABS = [
    { id: "me", icon: "⭐", key: "nav.me" },
    { id: "tasks", icon: "📋", key: "nav.tasks" },
    { id: "rewards", icon: "🎁", key: "nav.rewards" },
    { id: "group", icon: "👨‍👩‍👧", key: "nav.group" },
    { id: "notes", icon: "📝", key: "nav.notes" }
  ];

  function session() { return S.getSession() || {}; }

  function resolveScreen() {
    if (!S.exists()) return "setup";
    var s = session();
    if (s.kind === "parent" && S.parent(s.id)) return "parent";
    if (s.kind === "child" && S.child(s.id)) return "child";
    return "login";
  }

  function go(patch) {
    Object.keys(patch).forEach(function (k) { view[k] = patch[k]; });
    if (patch.tab && !patch.params) view.params = {};
    refresh();
    global.scrollTo(0, 0);
  }

  function refresh() {
    var screen = view.screen === "setup" && !S.exists() ? "setup" : resolveScreen();
    view.screen = screen;

    var tabs = screen === "parent" ? PARENT_TABS : screen === "child" ? CHILD_TABS : null;
    if (tabs && !tabs.some(function (x) { return x.id === view.tab; })) view.tab = tabs[0].id;

    U.el("#header").innerHTML = header(screen);
    U.el("#view").innerHTML =
      screen === "setup" ? global.Setup.render()
      : screen === "login" ? global.Setup.renderLogin()
      : screen === "parent" ? global.ParentView.render(view.tab, view.params)
      : global.ChildView.render(view.tab);
    U.el("#tabs").innerHTML = tabs ? tabBar(tabs) : "";
    document.body.classList.toggle("no-tabs", !tabs);
  }

  function header(screen) {
    var s = S.exists() ? S.get() : null;
    var who = "";
    if (screen === "parent") {
      var p = S.parent(session().id);
      if (p) who = U.avatar(p.avatar, 34);
    } else if (screen === "child") {
      var c = S.child(session().id);
      if (c) who = U.avatar(c.avatar, 34);
    }
    var title = (s && S.familyName()) || t("app.name");
    var sub = screen === "parent" ? S.nameOf(S.parent(session().id))
            : screen === "child" ? S.nameOf(S.child(session().id))
            : t("app.tagline");

    return '<div class="wrap">' +
      '<div class="brand-mark">🏆</div>' +
      '<div class="bar-title"><strong>' + esc(title) + "</strong><small>" + esc(sub || "") + "</small></div>" +
      '<div class="bar-actions">' +
        (global.Sync.connected()
          ? '<span id="syncDot" class="sync-dot" title="' + esc(t("sync.title")) + '">' + syncDot() + "</span>"
          : "") +
        '<button class="icon-btn" data-act="app.lang" aria-label="' + esc(t("common.language")) + '">🌐</button>' +
        (screen === "parent" || screen === "child"
          ? who + '<button class="icon-btn" data-act="app.logout" aria-label="' + esc(t("common.logout")) + '">⏻</button>'
          : "") +
      "</div></div>";
  }

  function syncDot() {
    var st = global.Sync.status();
    if (!st.connected) return "";
    return st.state === "syncing" ? "🔄" : st.state === "offline" ? "🟠" : st.state === "error" ? "🔴" : "🟢";
  }

  function tabBar(tabs) {
    var pending = S.pendingClaims().length;
    return tabs.map(function (tab) {
      var badge = tab.id === "approvals" && pending ? '<span class="badge">' + pending + "</span>" : "";
      return '<button class="' + (view.tab === tab.id ? "on" : "") + '" data-act="app.tab" data-tab="' + tab.id + '">' +
        '<span class="ic">' + tab.icon + "</span>" + badge +
        "<span>" + esc(t(tab.key)) + "</span></button>";
    }).join("");
  }

  U.on("app.tab", function (d) { go({ tab: d.tab, params: {} }); });
  U.on("app.logout", function () {
    S.clearSession();
    go({ screen: "login", tab: "dashboard", params: {} });
  });
  U.on("app.lang", function () {
    var signedIn = view.screen === "parent" || view.screen === "child";
    U.modal(signedIn ? t("tr.yourLang") : t("common.language"),
      '<div class="stack">' + global.I18N.langs.map(function (l) {
        return '<button class="btn ' + (l.code === global.I18N.lang ? "" : "ghost") +
          ' block" data-act="app.langPick" data-lang="' + l.code + '">' + l.flag + " " + esc(l.label) + "</button>";
      }).join("") + "</div>" +
      (signedIn ? '<p class="hint">' + esc(t("tr.userLangHint")) + "</p>" : ""));
  });
  /* Language is a personal setting: it changes what this account sees and
     leaves everyone else alone. Before anyone is signed in there is no account
     to attach it to, so it moves the family default instead. */
  U.on("app.langPick", function (d) {
    var s = session();
    if ((view.screen === "parent" || view.screen === "child") && s.id) {
      S.setUserLang(s.kind, s.id, d.lang);
    } else if (S.exists()) {
      S.get().settings.lang = d.lang;
      S.save();
    }
    global.I18N.setLang(d.lang);
    U.closeModal();
    refresh();
  });

  /* The language of whoever is signed in wins over the family default. */
  function applyUserLang() {
    if (!S.exists()) return;
    var s = session();
    var user = s.kind === "parent" ? S.parent(s.id) : s.kind === "child" ? S.child(s.id) : null;
    global.I18N.setLang((user && user.lang) || S.get().settings.lang || guessLang());
  }

  /* Joining a family from an invite link. Peek first so the person can see
     whose family they are about to join, since joining replaces this device. */
  function joinDialog(prefill) {
    U.modal(t("sync.join"),
      '<p class="hint">' + esc(t("sync.joinHint")) + "</p>" +
      '<textarea id="joinBox" style="min-height:80px;font-family:ui-monospace,monospace;font-size:.75rem">' +
        esc(prefill || "") + "</textarea>" +
      '<button class="btn block mt" data-act="app.joinGo">' + esc(t("sync.joinBtn")) + "</button>");
  }
  U.on("app.join", function () { joinDialog(""); });
  U.on("app.joinGo", function () {
    var box = U.el("#joinBox");
    if (!box) return;
    var text = box.value;
    U.toast(t("sync.syncing"));
    global.Sync.peek(text).then(function (res) {
      var set = (res && res.doc && res.doc.settings) || {};
      var name = (set.familyNames && set.familyNames[global.I18N.lang]) || set.familyName || t("app.name");
      U.confirmDialog(t("sync.joinReplace", { name: name }), function () {
        global.Sync.join(text).then(function () {
          applyUserLang();
          S.clearSession();
          go({ screen: "login", tab: "dashboard", params: {} });
          U.toast(t("sync.joined", { name: name }), "good");
        }).catch(function () { U.toast(t("sync.joinBad"), "bad"); });
      });
    }).catch(function () { U.toast(t("sync.joinBad"), "bad"); });
  });

  /* An invite link opened in a browser carries the family in its hash. */
  function invitationInUrl() {
    var hash = global.location.hash || "";
    if (hash.indexOf("#join=") !== 0) return null;
    var parsed = global.Sync.parseInvite(hash);
    if (!parsed) return null;
    try { global.history.replaceState(null, "", global.location.pathname + global.location.search); }
    catch (e) { global.location.hash = ""; }
    return hash;
  }

  function guessLang() {
    var nav = (global.navigator.language || "en").slice(0, 2).toLowerCase();
    return ["en", "nl", "he"].indexOf(nav) !== -1 ? nav : "en";
  }

  function boot() {
    S.load();
    var s = S.get();
    global.I18N.setLang(s && s.settings.lang ? s.settings.lang : guessLang());
    applyUserLang();
    view.screen = resolveScreen();
    view.tab = view.screen === "child" ? "me" : "dashboard";
    refresh();

    global.Sync.start();
    global.Sync.onChange(function () {
      var badge = U.el("#syncDot");
      if (badge) badge.textContent = syncDot();
    });

    var invitation = invitationInUrl();
    if (invitation) joinDialog(invitation);
  }

  global.App = {
    go: go, refresh: refresh, session: session, boot: boot,
    applyUserLang: applyUserLang,
    get view() { return view; }
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(window);

</script>
</body>
</html>
